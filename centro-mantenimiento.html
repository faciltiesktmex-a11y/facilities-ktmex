/* Layout concept: fixed top app-bar (brand + conectado + selector de bandeja)
   over a scrolling single column of cards on mobile / a responsive grid on
   wider screens. The "bandeja" selector simulates switching between the
   dispatcher's general view, Compras' inbox and each technician's own inbox,
   each with its own workflow actions. A right-side slide-over panel shows
   order detail + materials + the action available to the current bandeja. */
:root{
  --bg:#fcfdfe;
  --surface:#ffffff;
  --surface-2:#f3f5f8;
  --fg:#1c2433;
  --fg-muted:#6b7488;
  --border:#e6e9f0;
  --accent:#2f6fed;
  --accent-fg:#ffffff;
  --accent-soft:#eef3ff;
  --ok:#1a7f5a;
  --ok-bg:#e3f5ec;
  --warn:#9a5b00;
  --warn-bg:#fdf0db;
  --crit:#b3261e;
  --crit-bg:#fbe7e5;
  --info:#1d5fbf;
  --info-bg:#e8f0fd;
  --conf:#6d28d9;
  --conf-bg:#efe8fd;
  --proc:#0f766e;
  --proc-bg:#e1f5f2;
  --shadow:0 1px 2px rgba(16,21,31,.05),0 8px 24px -12px rgba(16,21,31,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  /* Solo "Auto" (sin atributo data-theme) sigue el modo oscuro del sistema;
     cualquier tema elegido a mano conserva sus propios colores. */
  :root:not([data-theme]){
    --bg:#0b0e14;
    --surface:#141924;
    --surface-2:#1a2130;
    --fg:#e8ecf3;
    --fg-muted:#9aa5b5;
    --border:#2a3344;
    --accent:#5c8df6;
    --accent-fg:#0b1220;
    --accent-soft:#16233c;
    --ok:#4fd396;
    --ok-bg:#122a22;
    --warn:#f2b84b;
    --warn-bg:#2e2410;
    --crit:#ff7a70;
    --crit-bg:#331715;
    --info:#7eb0ff;
    --info-bg:#14223a;
    --conf:#c3a4fb;
    --conf-bg:#271b40;
    --proc:#5eead4;
    --proc-bg:#0f2e2b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;padding:0;margin:0}
html[lang="ja"] body{font-family:"IBM Plex Sans","IBM Plex Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;line-break:strict}
html[lang="ja"] .mono{font-family:"IBM Plex Mono","IBM Plex Sans JP",ui-monospace,monospace}
.lang-b[lang="ja"]{font-family:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--fg);
  padding:12px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);border-bottom:1px solid var(--border)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand-mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center}
.brand-text{min-width:0}
.brand-text h1{font-size:16px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{margin:2px 0 0;font-size:11.5px;color:var(--fg-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;flex:none}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-muted);font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#9aa5b5}
.dot.live{background:#1a7f5a;box-shadow:0 0 0 3px rgba(26,127,90,.18)}

/* selector de tema: básicos (Auto / Claro / Oscuro) + combinaciones por uso,
   con vista previa de colores y una recomendación según la hora y la bandeja */
.theme-switch{display:flex;align-items:center;gap:6px;flex:none;position:relative}
.theme-label{font-size:11px;color:var(--fg-muted);font-weight:600;white-space:nowrap}
.theme-btn{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:5px 8px 5px 6px;cursor:pointer;color:var(--fg);font-size:12px;font-weight:600}
.theme-btn-name{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.theme-menu{position:fixed;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);z-index:26;padding:8px;overflow-y:auto}
.theme-menu[hidden]{display:none}
.theme-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding:10px 8px 4px}
.theme-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:8px;
  padding:7px 8px;cursor:pointer;text-align:left;color:var(--fg)}
.theme-item:hover{background:var(--surface-2)}
.theme-item.active{background:var(--accent-soft)}
.theme-item-text{display:flex;flex-direction:column;min-width:0;flex:1}
.theme-item-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.theme-item-why{font-size:10.5px;color:var(--fg-muted);line-height:1.35}
.theme-check{flex:none;color:var(--accent);visibility:hidden}
.theme-item.active .theme-check{visibility:visible}
.theme-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;
  padding:1px 6px;background:var(--ok-bg);color:var(--ok)}
/* mini vista previa: fondo + tarjeta + botón de acento */
.tp{position:relative;display:block;width:46px;height:32px;flex:none;border-radius:7px;border:1px solid;overflow:hidden}
#theme-btn-prev{display:flex}
.tp-card{position:absolute;left:5px;top:5px;width:26px;height:20px;border-radius:4px;border:1px solid;padding:4px 3px;
  display:flex;flex-direction:column;gap:3px}
.tp-line{display:block;height:3px;border-radius:2px;width:100%}
.tp-line.short{width:60%}
.tp-btn{position:absolute;right:4px;bottom:4px;width:10px;height:10px;border-radius:50%}
.theme-btn .tp{width:28px;height:20px;border-radius:5px}
.theme-btn .tp-card{left:3px;top:3px;width:15px;height:12px;padding:2px;gap:2px;border-radius:3px}
.theme-btn .tp-line{height:2px}
.theme-btn .tp-btn{width:6px;height:6px;right:3px;bottom:3px}
.theme-rec{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.theme-rec-text{flex:1;min-width:0}
.theme-rec-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.theme-rec-name{font-size:13px;font-weight:700;margin-top:1px}
.theme-rec-why{font-size:10.5px;color:var(--fg-muted);line-height:1.35;margin-top:2px}
@media (max-width:560px){.theme-btn-name{display:none}}

/* tipo de mantenimiento y tipo de equipo */
.tm{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;
  text-transform:none;letter-spacing:0}
.tm.Preventivo{background:var(--proc-bg);color:var(--proc)}
.tm.Predictivo{background:var(--conf-bg);color:var(--conf)}
.tm.Correctivo{background:var(--crit-bg);color:var(--crit)}
.tm i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--fg-muted);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.card-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.prio{font-size:10px;font-weight:700;color:var(--crit)}
.act-tipo{flex:none}
.card.correctivo{border-left:3px solid var(--crit)}

/* fichas extra en el perfil del equipo */
.ficha-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ficha-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini-btn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.danger{color:var(--crit)}
.mini-btn.danger:hover{border-color:var(--crit)}
.mini-btn:disabled{opacity:.6;cursor:default}
.equipo-photo.has-img{padding:0;overflow:hidden;cursor:zoom-in}
.equipo-photo.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.photo-note{font-size:10px;color:var(--fg-muted)}
.hist-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px}
.hist-row:last-child{border-bottom:0}
.hist-row .h-sub{grid-column:2 / 4;font-size:10.5px;color:var(--fg-muted)}
.hist-row.cur{background:var(--accent-soft)}

/* lightbox para fotos de equipo */
.lbx{position:fixed;inset:0;background:rgba(10,14,20,.86);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lbx.show{display:flex}
.lbx img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* formulario (reportar falla) */
.fdlg{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto}
.fgrid{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fgrid label{font-size:11.5px;font-weight:700;color:var(--fg);display:flex;flex-direction:column;gap:5px}
.fgrid textarea,.fgrid select,.fgrid input[type=text]{font:inherit;font-size:12.5px;color:var(--fg);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.fgrid textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.frow label{min-width:0}
.fgrid select{width:100%;min-width:0}
@media (max-width:480px){.frow{grid-template-columns:1fr}}
.mat-pick{max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.mat-pick label{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:11.5px;padding:4px 6px;border-radius:6px;cursor:pointer}
.mat-pick label:hover{background:var(--surface-2)}
.ferr{font-size:11.5px;color:var(--crit);font-weight:700;min-height:1em}

/* reloj de simulación */
.simclock{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--conf);background:var(--conf-bg);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.simclock[hidden]{display:none}
@media (max-width:760px){.simclock .sc-long{display:none}}

/* dashboard */
.dash-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dash-toolbar .spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg-muted);font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0;grid-column:span 6}
.dcard.w4{grid-column:span 4}.dcard.w8{grid-column:span 8}.dcard.w12{grid-column:span 12}
@media (max-width:900px){.dcard,.dcard.w4,.dcard.w8{grid-column:span 12}}
.dcard h3{font-size:12.5px;font-weight:700;margin-bottom:2px}
.dcard .dsub{font-size:11px;color:var(--fg-muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:10px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .num{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .lbl{font-size:11px;color:var(--fg-muted);font-weight:600;margin-top:3px}
.kpi .sub{font-size:10.5px;color:var(--fg-muted);margin-top:2px}
.kpi.ok .num{color:var(--ok)}.kpi.crit .num{color:var(--crit)}.kpi.info .num{color:var(--info)}.kpi.conf .num{color:var(--conf)}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:150px;flex:1}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li b{margin-left:auto;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:150px 1fr minmax(44px,auto);gap:8px;align-items:center;font-size:11.5px}
@media (max-width:560px){.hbar{grid-template-columns:110px 1fr minmax(32px,auto);font-size:11px}}
.hbar .hl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .hl img{width:20px;height:20px;border-radius:5px;object-fit:cover;flex:none}
.hbar .track{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.hbar .track span{display:block;height:100%}
.hbar .hv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.cols .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0;height:100%}
.cols .col span{display:block;border-radius:2px 2px 0 0}
.cols-x{display:flex;gap:4px;font-size:9.5px;color:var(--fg-muted);margin-top:4px}
.cols-x span{flex:1;text-align:center;min-width:0;overflow:hidden}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-muted);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);font-weight:700;
  padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.log-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.log-table tr:hover td{background:var(--surface-2)}
.log-table .ev{font-weight:700}
.log-scroll{overflow-x:auto}
@media (max-width:640px){.log-table .hide-sm{display:none}}
.sim-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim-note{font-size:11px;color:var(--fg-muted);line-height:1.45;margin-top:8px}
.prog{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.dash-link{display:inline-flex;align-items:center;gap:6px}

/* capacitación: estado de cada curso */
.cap{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.cap.vigente{background:var(--ok-bg);color:var(--ok)}
.cap.por_vencer{background:var(--warn-bg);color:var(--warn)}
.cap.vencido{background:var(--crit-bg);color:var(--crit)}
.cap.sin{background:var(--surface-2);color:var(--fg-muted);border:1px dashed var(--border)}
.req-list{display:flex;flex-direction:column;gap:6px}
.req-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 10px;border:1px solid var(--border);border-radius:9px;font-size:12px}
.req-row .rn{font-weight:600}
.req-row .rp{grid-column:1 / 3;display:flex;gap:6px;flex-wrap:wrap}
.block-box{border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.45;display:flex;gap:8px;align-items:flex-start}
.block-box.crit{background:var(--crit-bg);color:var(--crit)}
.block-box.warn{background:var(--warn-bg);color:var(--warn)}
.block-box.ok{background:var(--ok-bg);color:var(--ok)}
.block-box b{font-weight:700}
.card-block{font-size:10.5px;font-weight:700;border-radius:7px;padding:5px 8px;display:flex;gap:6px;align-items:center}
.card-block.crit{background:var(--crit-bg);color:var(--crit)}
.card-block.warn{background:var(--warn-bg);color:var(--warn)}

/* cuadrilla y carga de trabajo */
.crew{display:flex;flex-direction:column;gap:6px}
.crew-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:9px;font-size:12px}
.crew-row img,.crew-row .ini{width:30px;height:30px;border-radius:7px;object-fit:cover;display:flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700}
.crew-row .cn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.crew-row .cn:hover{color:var(--accent);text-decoration:underline}
.crew-row .cs{font-size:10.5px;color:var(--fg-muted);grid-column:2 / 3}
.crew-row .ch{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.crew-x{border:0;background:transparent;color:var(--fg-muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
.crew-x:hover{color:var(--crit)}
.crew-add{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crew-add select{flex:1;min-width:180px;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg)}
.mini-av{display:inline-flex;margin-left:4px}
.mini-av img,.mini-av span{width:18px;height:18px;border-radius:5px;object-fit:cover;border:1.5px solid var(--surface);margin-left:-5px;
  display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-size:8px;font-weight:700}
.loadbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.loadbar span{display:block;height:100%}
.load-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-muted);margin-top:4px;gap:8px;flex-wrap:wrap}
.load-chip{font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px}
.load-chip.ok{background:var(--ok-bg);color:var(--ok)}
.load-chip.warn{background:var(--warn-bg);color:var(--warn)}
.load-chip.crit{background:var(--crit-bg);color:var(--crit)}
.role-btn{margin-left:auto;flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);
  color:var(--fg);border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.role-btn:hover{border-color:var(--accent);color:var(--accent)}
.role-meta{font-size:10.5px;color:var(--fg-muted);font-weight:600}
@media (max-width:640px){.role-btn .rb-txt{display:none}}

/* perfil de la persona */
.cdlg.pf{width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow-y:auto;padding:0}
.pf-head{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.pf-head .role-avatar{width:72px;height:72px}
.pf-head h3{font-size:16px}
.pf-meta{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-muted);margin-top:3px}
.pf-meta b{color:var(--fg)}
.pf-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:16px}
.pf-sec h4{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);margin:0 0 8px}
.pf-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.pf-counts{grid-template-columns:repeat(2,1fr)}}
.pf-count{border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.pf-count .n{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pf-count .l{font-size:10.5px;color:var(--fg-muted);font-weight:600}
.pf-count.vencido .n{color:var(--crit)}.pf-count.por_vencer .n{color:var(--warn)}.pf-count.vigente .n{color:var(--ok)}
.tr-list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.tr-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px}
.tr-row .td{grid-column:1 / 2;grid-row:2}
.tr-row:last-child{border-bottom:0}
.tr-row .td{font-size:10.5px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.plan-chips{display:flex;flex-wrap:wrap;gap:6px}
.plan-chip{font-size:10.5px;font-weight:700;border-radius:7px;padding:4px 8px;border:1px solid var(--border)}
.plan-chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.plan-chip.no{background:var(--surface-2);color:var(--fg-muted);text-decoration:line-through}
.pf-note{font-size:10.5px;color:var(--fg-muted);line-height:1.45}
details.pf-more summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);padding:4px 0}
.pf-body > .pf-acc{margin-top:-8px}
.pf-acc{border:1px solid var(--border);border-radius:12px;background:var(--surface);min-width:0}
.pf-acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
button.pf-acc-h:hover{background:var(--surface-2)}
button.pf-acc-h:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.pf-acc.open > .pf-acc-h{border-radius:12px 12px 0 0}
.pf-acc-ic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.pf-acc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pf-acc-t > b{font-size:12.5px;font-weight:700;line-height:1.3}
.pf-acc-s{font-size:11px;color:var(--fg-muted);line-height:1.45}
.pf-acc-s b{color:var(--fg)}
.pf-acc-s .turno-chip{font-size:10.5px;padding-top:1px;padding-bottom:1px}
.pf-n-ok{color:var(--ok);font-weight:700}.pf-n-warn{color:var(--warn);font-weight:700}.pf-n-crit{color:var(--crit);font-weight:700}
.pf-acc-n{flex:none;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--surface-2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;font:700 11px "IBM Plex Mono",ui-monospace,monospace}
.pf-acc-n.warn{background:var(--warn-bg);color:var(--warn)}.pf-acc-n.crit{background:var(--crit-bg);color:var(--crit)}
.pf-acc-chev{flex:none;color:var(--fg-muted);transition:transform .18s}
.pf-acc-h[aria-expanded="true"] .pf-acc-chev{transform:rotate(180deg)}
.pf-acc-b{padding:10px 12px 12px;border-top:1px solid var(--border);min-width:0}
.pf-acc-b[hidden]{display:none}
.pf-acc.fijo{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
@media (prefers-reduced-motion:reduce){.pf-acc-chev{transition:none}}
.ot-load{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 10px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.ot-load:last-child{border-bottom:0}
.ot-load:hover{background:var(--surface-2)}
.ot-load .os{grid-column:1 / 3;font-size:10.5px;color:var(--fg-muted)}
.cap-matrix{border-collapse:collapse;font-size:11px;width:100%}
.cap-matrix th{font-size:10px;font-weight:700;color:var(--fg-muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--border);vertical-align:bottom}
.cap-matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:215px;text-align:left}
.cap-matrix td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:center}
.cap-matrix td.nm{text-align:left;font-weight:700;white-space:nowrap}
.cap-dot{display:inline-block;width:14px;height:14px;border-radius:4px}
.cap-dot.vigente{background:var(--ok)}.cap-dot.por_vencer{background:var(--warn)}.cap-dot.vencido{background:var(--crit)}
.cap-dot.sin{background:transparent;border:1.5px dashed var(--border)}

/* reiniciar simulación */
.reset-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 10px;font-size:12px}
.reset-btn:disabled{opacity:.6;cursor:default}
@media (max-width:820px){#reset-label{display:none}}

/* diálogo de confirmación propio (los diálogos nativos pueden estar bloqueados dentro del artefacto) */
.cdlg-scrim{position:fixed;inset:0;background:rgba(23,32,51,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .16s}
.cdlg-scrim.show{opacity:1;pointer-events:auto}
.cdlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(440px,calc(100vw - 32px));
  background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:46;
  padding:18px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.cdlg.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cdlg h3{font-size:15px;font-weight:700}
.cdlg-body{font-size:12.5px;color:var(--fg-muted);line-height:1.5;margin-top:8px}
.cdlg-body ul{margin:8px 0 0;padding-left:18px}
.cdlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-danger{background:var(--crit);color:#fff}

/* bandeja (role inbox) switcher — a fictitious "menu" for the demo that
   simulates logging in as the dispatcher, Compras, or a given technician */
.bandeja-switch{position:relative}
.bandeja-btn{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:5px 10px 5px 5px;cursor:pointer;color:var(--fg)}
.bandeja-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.01em;overflow:hidden}
.bandeja-avatar.sm{width:28px;height:28px;font-size:11px}
.bandeja-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
/* foto de perfil en recuadro (tamaño mediano) en el encabezado de la bandeja */
.role-avatar{width:64px;height:64px;border-radius:10px;object-fit:cover;object-position:center top;flex:none;display:block;
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border),0 2px 8px rgba(16,21,31,.12);background:var(--surface)}
.role-avatar-ph{display:flex;align-items:center;justify-content:center;color:var(--accent)}
.role-avatar-ph svg{width:26px;height:26px}
.role-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.role-name{font-size:14px;font-weight:700;color:var(--fg)}
.role-sub{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted)}
.role-desc{font-size:11.5px;font-weight:600}
.bandeja-label{font-size:12.5px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bandeja-chevron{flex:none;color:var(--fg-muted)}
.bandeja-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);min-width:270px;max-width:320px;max-height:72vh;overflow-y:auto;z-index:25;padding:6px}
.bandeja-sep{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding:10px 10px 4px}
.bandeja-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:8px;
  padding:7px 8px;cursor:pointer;text-align:left}
.bandeja-item:hover{background:var(--surface-2)}
.bandeja-item.active{background:var(--accent-soft)}
.bandeja-item.active .bandeja-item-label{color:var(--accent)}
.bandeja-item-text{display:flex;flex-direction:column;min-width:0}
.bandeja-item-label{font-size:12.5px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bandeja-item-sub{font-size:10.5px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.role-banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--accent);
  border-radius:12px;padding:10px 12px;font-size:11.5px;font-weight:600;line-height:1.4}
.role-banner[hidden]{display:none}
.role-banner svg{flex:none}
.role-banner b{font-weight:700}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 0}
.tiles[hidden]{display:none}
.tiles.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile-mapa{font:inherit;color:inherit;text-align:left;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;border-color:color-mix(in srgb,#16a34a 45%,var(--border))}
.tile-mapa:hover{border-color:#16a34a}
.tile-mapa[aria-expanded="true"]{border-color:#16a34a;box-shadow:0 0 0 2px color-mix(in srgb,#16a34a 30%,transparent),var(--shadow)}
.tile-mapa .num{color:#16a34a;display:flex;align-items:center;gap:7px}
.tile-mapa .num i{width:9px;height:9px;border-radius:50%;background:#16a34a;animation:mvlive 1.4s ease-in-out infinite}
.tile-mapa .tm-ic{grid-row:1/span 2;grid-column:2;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,#16a34a 14%,var(--surface));color:#16a34a}
.tile-mapa .tm-ic svg{transition:transform .15s}
.tile-mapa .tm-now{font:600 11px "IBM Plex Sans",sans-serif;color:var(--fg-muted);margin-left:2px}
.tile-mapa .tm-act{color:#16a34a;font-weight:700;white-space:nowrap}
.mapa-head-acts{display:flex;gap:6px;flex:none;align-items:flex-start}
.mapa-head-acts .btn{white-space:nowrap}
@media (max-width:900px){.tiles.t5{grid-template-columns:repeat(3,minmax(0,1fr))}.tiles.t5 .tile-mapa{grid-column:span 2}}
@media (max-width:700px){.tiles,.tiles.t5{grid-template-columns:repeat(2,1fr)}.tiles.t5 .tile-mapa{grid-column:1/-1}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .lbl{font-size:11.5px;color:var(--fg-muted);font-weight:500;margin-top:3px}
.tile.crit .num{color:var(--crit)}
.tile.ok .num{color:var(--ok)}
.tile.info .num{color:var(--info)}

/* content */
.content{flex:1;padding:14px 16px 40px;max-width:1180px;width:100%;margin:0 auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.select,.search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:12.5px;color:var(--fg);font-family:inherit}
.search{flex:1;min-width:160px}
.select{min-width:0}

.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:36px 20px;text-align:center;color:var(--fg-muted)}
.empty b{color:var(--fg);display:block;margin-bottom:6px;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.sec-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);
  display:flex;align-items:center;justify-content:space-between;gap:8px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-plan{font-size:11px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card-equipo{font-size:13.5px;font-weight:600;margin-top:2px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pill.pendiente{background:var(--warn-bg);color:var(--warn)}
.pill.enviada{background:var(--info-bg);color:var(--info)}
.pill.confirmada{background:var(--conf-bg);color:var(--conf)}
.pill.en_proceso{background:var(--proc-bg);color:var(--proc)}
.pill.completada{background:var(--ok-bg);color:var(--ok)}
.pill.solicitada{background:var(--warn-bg);color:var(--warn)}
.pill.cotizacion_recibida{background:var(--info-bg);color:var(--info)}
.pill.oc_generada{background:var(--conf-bg);color:var(--conf)}
.pill.recibido{background:var(--ok-bg);color:var(--ok)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--fg-muted)}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
.card-tecnico{font-size:11.5px;color:var(--fg-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-flag{font-size:10.5px;font-weight:700;color:var(--crit);display:flex;align-items:center;gap:4px}
.auto-tag{font-size:9.5px;font-weight:700;color:var(--info);white-space:nowrap}
.card-auto{font-size:10.5px;color:var(--info);background:var(--info-bg);border-radius:7px;padding:5px 8px;
  display:flex;align-items:center;gap:5px;margin-top:-1px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(23,32,51,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:31;
  box-shadow:-12px 0 32px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.show{transform:translateX(0)}
.panel-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.panel-head h2{font-size:16px;font-weight:700;line-height:1.3}
.panel-head .card-plan{margin-bottom:3px}
.closebtn{border:1px solid var(--border);background:var(--surface-2);color:var(--fg);width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.panel-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--fg-muted)}
.kv dd{margin:0;font-weight:600}

.acts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.act-row{display:flex;gap:8px;font-size:12.5px;padding:7px 9px;background:var(--surface-2);border-radius:8px}
.act-row .parte{font-weight:600;flex:none;color:var(--fg-muted);min-width:76px}

.mat-table{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mat-row{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;border-top:1px solid var(--border)}
.mat-row:first-child{border-top:0}
.mat-code{font-weight:600;flex:none;width:58px}
.mat-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-stock{flex:none;color:var(--fg-muted);width:96px;text-align:right;white-space:nowrap;font-size:11px}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-dot.OK{background:var(--ok)}
.status-dot.CRIT{background:var(--crit)}
.status-dot.SOBRE{background:var(--info)}
.mat-more{padding:8px 10px;font-size:11.5px;color:var(--fg-muted);text-align:center;background:var(--surface-2)}

.btn{border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.hint{font-size:11px;color:var(--fg-muted);text-align:center}

/* compras (bandeja de compras) */
.purchase-list{display:flex;flex-direction:column;gap:10px}
.purchase-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.purchase-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.purchase-title{font-size:13.5px;font-weight:700}
.purchase-sub{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.purchase-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qty{font-size:12.5px;font-weight:700;background:var(--crit-bg);color:var(--crit);padding:3px 9px;border-radius:999px;white-space:nowrap}
.timeline{display:flex;align-items:center;margin-top:12px;gap:0}
.tl-step{flex:1;display:flex;flex-direction:column;gap:5px;position:relative}
.tl-bar{height:5px;border-radius:3px;background:var(--border)}
.tl-bar.done{background:var(--ok)}
.tl-bar.active{background:var(--info)}
.tl-lbl{font-size:10px;color:var(--fg-muted);font-weight:600}
.tl-date{font-size:10.5px;font-weight:600}
.purchase-actions{margin-top:12px;display:flex;justify-content:flex-end}

/* ficha del equipo (foto ilustrativa + ubicación con mapa interactivo) */
.equipo-ficha{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.equipo-photo{width:72px;height:72px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
.equipo-photo svg{width:42px;height:42px}
.equipo-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.equipo-info .nombre{font-size:13.5px;font-weight:700;line-height:1.3}
.equipo-info .sistema-tag{font-size:11px;color:var(--fg-muted);font-weight:600}
.loc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.loc-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  color:var(--fg);border-radius:999px;padding:4px 10px 4px 8px;font-size:11.5px;font-weight:600;cursor:pointer}
.loc-chip:hover{border-color:var(--accent);color:var(--accent)}
.loc-chip svg{flex:none}
.loc-chip-edit{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding-left:7px;border-left:1px solid var(--border);
  color:var(--accent);font-weight:700}
.loc-ro-note{font-size:10.5px;color:var(--fg-muted)}
.loc-modal.view .loc-list li,.loc-modal.view .loc-z{cursor:default}
.loc-saved{color:var(--ok);font-weight:700}
.loc-saving{color:var(--fg-muted);font-weight:700}
.loc-err{color:var(--crit);font-weight:700}

/* modal del layout interactivo de planta (mapa de zonas) */
.loc-modal-scrim{position:fixed;inset:0;background:rgba(23,32,51,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.loc-modal-scrim.show{opacity:1;pointer-events:auto}
.loc-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(920px,94vw);height:min(640px,88vh);
  background:var(--surface);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:41;
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.loc-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.loc-modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loc-modal-head h3{font-size:14.5px;font-weight:700}
.loc-modal-head p{margin:2px 0 0;font-size:11.5px;color:var(--fg-muted)}
.loc-modal-body{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr}
@media (max-width:640px){.loc-modal-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.loc-side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding:10px}
@media (max-width:640px){.loc-side{border-right:0;border-bottom:1px solid var(--border);max-height:150px}}
.loc-search{margin-bottom:8px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--fg)}
.loc-list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1}
.loc-list li{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px}
.loc-list li:hover{background:var(--surface-2)}
.loc-list li.current{font-weight:700;background:var(--accent-soft);color:var(--accent)}
.loc-list li i{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.loc-list li.hide{display:none}
.loc-map{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:10px;background:var(--bg)}
.loc-stage{position:relative;width:100%;max-height:100%;aspect-ratio:3197/1786}
.loc-stage img,.loc-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.loc-stage img{user-select:none;-webkit-user-drag:none;pointer-events:none;border-radius:6px}
.loc-z{fill:transparent;stroke:none;cursor:pointer}
.loc-z.current{fill:var(--c);fill-opacity:.55;stroke:#000;stroke-width:3px;vector-effect:non-scaling-stroke}
.loc-z:hover{fill:var(--c);fill-opacity:.28}
.loc-lb{display:none;font:700 30px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:middle;
  paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round;fill:#000;pointer-events:none}
.loc-lb.on{display:block}
.loc-tip{position:fixed;display:none;pointer-events:none;z-index:50;background:#111;color:#fff;padding:5px 10px;
  border-radius:7px;font-weight:600;font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.loc-modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.loc-current-lbl{font-size:11.5px;color:var(--fg-muted)}
.loc-current-lbl b{color:var(--fg)}
.loc-foot-actions{display:flex;gap:8px}

/* toast */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;pointer-events:none}
.toast{background:var(--accent);color:var(--accent-fg);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);
  font-size:12.5px;font-weight:600;max-width:min(480px,90vw);text-align:center;transform:translateY(12px);opacity:0;
  transition:all .22s ease}
.toast.show{transform:translateY(0);opacity:1}

@media (max-width:520px){.bandeja-label{display:none}}
@media (max-width:1400px){#conn-text{display:none}}
@media (max-width:400px){#theme-label{display:none}}
@media (max-width:520px){.role-avatar{width:52px;height:52px}.role-name{font-size:13px}}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.toast{transition:none}}

/* ---- ergonomía (NOM-036), seguridad y Matriz de Eisenhower ---- */
.eis,.ergo{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;line-height:1.35}
.eis.q1{background:var(--crit-bg);color:var(--crit)}
.eis.q2{background:var(--info-bg);color:var(--info)}
.eis.q3{background:var(--warn-bg);color:var(--warn)}
.eis.q4{background:var(--surface-2);color:var(--fg-muted);border:1px solid var(--border)}
.ergo.no_aplica{background:var(--surface-2);color:var(--fg-muted);border:1px dashed var(--border)}
.ergo.bajo{background:var(--ok-bg);color:var(--ok)}
.ergo.medio{background:var(--warn-bg);color:var(--warn)}
.ergo.alto{background:var(--crit-bg);color:var(--crit)}
.ergo.muy_alto{background:var(--conf-bg);color:var(--conf)}
.eis-box{border:1px solid var(--border);border-left:4px solid var(--fg-muted);border-radius:10px;padding:9px 11px;background:var(--surface)}
.eis-box.q1{border-left-color:var(--crit)}.eis-box.q2{border-left-color:var(--info)}.eis-box.q3{border-left-color:var(--warn)}
.eis-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;font-weight:600}
.ef-list{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ef-row{display:grid;grid-template-columns:12px minmax(0,1.3fr) minmax(0,1fr) 28px;gap:8px;align-items:center;padding:6px 10px;font-size:11.5px;border-bottom:1px solid var(--border)}
.ef-row:last-child{border-bottom:0}
.ef-row .ef-d{color:var(--fg-muted)}
.ef-row b{text-align:right}
.ef-tot{background:var(--surface-2);font-weight:700}
.ef-dot{width:10px;height:10px;border-radius:3px;background:var(--fg-muted)}
.ef-dot.verde{background:#2f9e44}.ef-dot.naranja{background:#f08c00}.ef-dot.rojo{background:#e03131}.ef-dot.morado{background:#7048e8}
.seg-list{display:flex;flex-direction:column;gap:6px}
.seg-row{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;font-size:12px}
.seg-row .pf-note{grid-column:1/-1}
.seg-tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.seg-tag.sm{font-size:10px;padding:1px 6px;margin:1px 0}
.eis-grid{display:grid;grid-template-columns:22px 1fr 1fr;gap:6px;align-items:stretch}
.eis-ax{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);text-align:center}
.eis-ax.v{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;justify-content:center}
.eis-cell{border-radius:10px;padding:9px 10px;min-width:0;border:1px solid var(--border);background:var(--surface-2)}
.eis-cell.q1{background:var(--crit-bg);border-color:transparent}.eis-cell.q2{background:var(--info-bg);border-color:transparent}.eis-cell.q3{background:var(--warn-bg);border-color:transparent}
.eis-q{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.eis-q .mono{font-size:18px;font-weight:700;line-height:1}
.eis-cell.q1 .eis-q{color:var(--crit)}.eis-cell.q2 .eis-q{color:var(--info)}.eis-cell.q3 .eis-q{color:var(--warn)}
.eis-sub{font-size:10.5px;color:var(--fg-muted);margin-top:2px}
.eis-ids{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.eis-ids span{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--surface);cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.eis-ids span.more{cursor:default;background:transparent;color:var(--fg-muted)}
.crit-index{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
#crit-body .dcard{scroll-margin-top:200px}
@media (max-width:760px){#crit-body .dcard{scroll-margin-top:300px}}
.crit-index button{border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer}
.crit-index button:hover{border-color:var(--accent);color:var(--accent)}
.crit-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:4px}
@media (max-width:1000px){.crit-steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.crit-steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.crit-step{border:1px solid var(--border);border-radius:10px;padding:9px 10px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px;font-size:11.5px;min-width:0}
.crit-step b{font-size:12.5px}
.crit-step span:last-child{color:var(--fg-muted);line-height:1.4}
.cs-n{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.crit-formula{margin-top:10px;font-size:11.5px;background:var(--accent-soft);color:var(--fg);border-radius:8px;padding:8px 10px;line-height:1.5;overflow-wrap:anywhere}
.crit-ul{margin:4px 0 0 0;padding-left:18px;font-size:12px;line-height:1.55}
.crit-ul li{margin-bottom:4px}
.crit-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
@media (max-width:900px){.crit-cols{grid-template-columns:minmax(0,1fr)}}
.crit-h{font-size:11.5px;font-weight:700;margin-bottom:6px}
.crit-t td{font-size:11.5px}
.crit-t.compact td,.crit-t.compact th{padding:5px 6px}
.crit-ej-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.crit-ej-top .select{max-width:100%;min-width:0;flex:1 1 260px}
.crit-calc{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.cc-row{display:grid;grid-template-columns:22px minmax(120px,170px) minmax(90px,auto) 1fr;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px}
.cc-row:last-child{border-bottom:0}
.cc-n{width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.cc-l{font-weight:600}
.cc-d{color:var(--fg-muted);font-size:11.5px}
@media (max-width:640px){.cc-row{grid-template-columns:22px 1fr auto}.cc-d{grid-column:2/-1}}

/* ---- tiempo de ejecución ---- */
.run-ctrl{display:flex;gap:8px}
.run-ctrl .btn{flex:1;justify-content:center}
.run-ctrl .btn-ghost{flex:0 0 auto}
.run-box{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px}
.run-box.on{background:var(--proc-bg);border-color:transparent}
.run-box.pause{background:var(--warn-bg);border-color:transparent}
.run-dot{width:9px;height:9px;border-radius:50%;background:var(--fg-muted);flex:none;margin-top:4px}
.on .run-dot{background:var(--proc);box-shadow:0 0 0 0 var(--proc);animation:runpulse 1.6s infinite}
.pause .run-dot{background:var(--warn)}
@keyframes runpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--proc) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.on .run-dot{animation:none}}
.card-run{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;margin-top:8px;padding:5px 8px;border-radius:8px}
.card-run .run-dot{margin-top:0}
.card-run.on{background:var(--proc-bg);color:var(--proc)}
.card-run.pause{background:var(--warn-bg);color:var(--warn)}
.card-run.done{background:var(--surface-2);color:var(--fg-muted)}
.ratio-bar{position:relative;height:8px;border-radius:4px;background:var(--surface-2);min-width:90px}
.ratio-bar i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg-muted);left:50%}
.ratio-bar span{position:absolute;top:0;bottom:0;border-radius:4px}

/* ---- recuadros grandes del Administrador: perfiles de técnicos y órdenes ---- */
.sec-box{background:color-mix(in srgb,var(--surface-2) 55%,var(--bg));border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;min-width:0}
.sec-box-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.sec-box-title{display:flex;gap:10px;align-items:flex-start;min-width:0}
.sec-box-ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex:none}
.sec-box h2{font-size:15px;font-weight:700;line-height:1.25}
.sec-box-head p{font-size:11.5px;color:var(--fg-muted);margin-top:2px;line-height:1.4}
#ot-box .toolbar{margin-bottom:10px}
.tpf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.tpf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s}
.tpf-card:hover,.tpf-card:focus-visible{border-color:var(--accent);outline:none}
.tpf-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.tpf-head .role-avatar{width:50px;height:50px}
.tpf-id{min-width:0;display:flex;flex-direction:column;gap:2px}
.tpf-id b{font-size:13px;line-height:1.25}
.tpf-id > span{font-size:11px;color:var(--fg-muted)}
.tpf-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tpf-run{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
.tpf-run .run-dot{width:7px;height:7px;margin-top:0}
.tpf-run.on{background:var(--proc-bg);color:var(--proc)}.tpf-run.pause{background:var(--warn-bg);color:var(--warn)}
.tpf-row{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--fg-muted);align-items:baseline;min-width:0}
.tpf-row > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tpf-row b{color:var(--fg);font-weight:600;text-align:right;white-space:nowrap;flex:none}
.tpf-row b.mono{font-size:10.5px}
.tpf-mut{color:var(--fg-muted);font-weight:500}
.tpf-bar{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:-2px 0 2px}
.tpf-bar span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.tpf-bar span.ok{background:var(--ok)}.tpf-bar span.warn{background:var(--warn)}.tpf-bar span.crit{background:var(--crit)}
.tpf-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin:4px 0}
.tpf-stat{border:1px solid var(--border);border-radius:8px;padding:4px 4px;min-width:0;text-align:center}
.tpf-stat b{display:block;font-size:15px;line-height:1.2}
.tpf-stat span{display:block;font-size:9.5px;color:var(--fg-muted);font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpf-stat.info b{color:var(--info)}.tpf-stat.proc b{color:var(--proc)}.tpf-stat.warn b{color:var(--warn)}.tpf-stat.ok b{color:var(--ok)}
.tpf-aviso{display:flex;gap:6px;align-items:flex-start;font-size:10.5px;font-weight:600;border-radius:8px;padding:5px 8px;line-height:1.35}
.tpf-aviso.crit{background:var(--crit-bg);color:var(--crit)}.tpf-aviso.warn{background:var(--warn-bg);color:var(--warn)}
.tpf-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:nowrap}
.tpf-actions .btn{flex:1;justify-content:center;white-space:nowrap;padding-left:8px;padding-right:8px;font-size:11.5px}
@media (max-width:560px){.sec-box{padding:12px;margin-left:-4px;margin-right:-4px}.tpf-grid{grid-template-columns:minmax(0,1fr)}}

/* ---- módulos del dashboard (predictivo / preventivo / correctivo) ---- */
.mod-wrap{margin-bottom:12px}
.mod-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.mod-head h3{font-size:14px;font-weight:700}
.mod-head .dsub{margin:0}
.mod-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.mod-grid{grid-template-columns:minmax(0,1fr)}}
.mod-card{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--mc);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.mod-card:hover{border-color:var(--mc)}
.mod-card.on{border-color:var(--mc);box-shadow:0 0 0 2px color-mix(in srgb,var(--mc) 35%,transparent),var(--shadow)}
.mod-top{display:flex;justify-content:space-between;align-items:center}
.mod-name{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--mc)}
.mod-name i{width:9px;height:9px;border-radius:50%;background:var(--mc)}
.mod-cnt{color:var(--fg);font-weight:700}
.mod-chev{color:var(--fg-muted);transition:transform .15s}
.mod-card.on .mod-chev{transform:rotate(180deg)}
.mod-num{font-size:26px;font-weight:700;line-height:1.1;margin-top:2px}
.mod-lbl{font-size:11px;color:var(--fg-muted);font-weight:600}
.mod-mini{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--fg-muted);margin-top:4px}
.mod-mini b{color:var(--fg)}
.mod-desc{font-size:10.5px;color:var(--fg-muted);margin-top:4px;line-height:1.35}
.mod-panel{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--mc);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.mod-panel-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.mod-panel-head b{font-size:14px;color:var(--mc)}
.mod-panel-head .pf-note{flex:1}
.mod-subs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:12px}
@media (max-width:900px){.mod-subs{grid-template-columns:minmax(0,1fr)}}
.mod-gt{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);margin-bottom:6px}
.mod-gg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mod-gg.eis4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.mod-gg.eis4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod-sub{font:inherit;color:inherit;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.mod-sub:hover{border-color:var(--accent)}
.mod-sub.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ms-n{font-size:20px;font-weight:700;line-height:1.1}
.ms-t{font-size:12px;font-weight:700;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.ms-s{font-size:10.5px;color:var(--fg-muted);line-height:1.3;overflow-wrap:break-word;hyphens:auto}
/* el acomodo depende del ancho real del recuadro (no de la ventana): así también se ajusta en la vista de celular y en columnas angostas */
.mod-panel{container-type:inline-size}
@container (max-width:760px){.mod-subs{grid-template-columns:minmax(0,1fr)}}
@container (max-width:520px){.mod-gg.eis4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod-sub.env .ms-n{color:var(--info)}.mod-sub.pend .ms-n{color:var(--warn)}
.mod-sub.q1{background:var(--crit-bg)}.mod-sub.q1 .ms-n,.mod-sub.q1 .ms-t{color:var(--crit)}
.mod-sub.q2{background:var(--info-bg)}.mod-sub.q2 .ms-n,.mod-sub.q2 .ms-t{color:var(--info)}
.mod-sub.q3{background:var(--warn-bg)}.mod-sub.q3 .ms-n,.mod-sub.q3 .ms-t{color:var(--warn)}
.mod-sel{margin:12px 0 6px;font-size:12.5px}
.mod-list{max-height:380px;overflow:auto;border:1px solid var(--border);border-radius:10px}
.mod-list .log-table th{position:sticky;top:0;background:var(--surface);z-index:1}

/* ---- tema KTMEX retro 80s ---- */

[data-theme="ktmex"] .topbar{background:linear-gradient(180deg,#0b1f4d 0%,#13348f 100%);color:#fff;border-bottom:0;
  box-shadow:0 3px 0 #ffffff,0 6px 0 #d7263d,0 9px 0 #5b8cff,0 12px 0 #ffffff}
[data-theme="ktmex"] .brand-text h1,[data-theme="ktmex"] .sec-box h2,[data-theme="ktmex"] .dcard h3,[data-theme="ktmex"] .mod-head h3,
[data-theme="ktmex"] .panel-head h2,[data-theme="ktmex"] .role-name,[data-theme="ktmex"] .pf-head h3{font-family:"Audiowide","IBM Plex Sans",sans-serif;font-weight:400;letter-spacing:.03em}
[data-theme="ktmex"] .brand-text h1{color:#fff;text-transform:uppercase;font-size:17px;text-shadow:2px 2px 0 #d7263d}
[data-theme="ktmex"] .brand-text p{color:#bcd0ff}
[data-theme="ktmex"] .theme-menu,[data-theme="ktmex"] .bandeja-menu{color:var(--fg)}
[data-theme="ktmex"] .brand-mark{background:#d7263d;border-radius:3px;box-shadow:3px 3px 0 #5b8cff}
[data-theme="ktmex"] .conn,[data-theme="ktmex"] .theme-label{color:#bcd0ff}
[data-theme="ktmex"] .role-banner{border:2px solid #0b1f4d;border-radius:4px;box-shadow:3px 3px 0 #d7263d}
[data-theme="ktmex"] .tile,[data-theme="ktmex"] .card,[data-theme="ktmex"] .dcard,[data-theme="ktmex"] .kpi,[data-theme="ktmex"] .tpf-card,
[data-theme="ktmex"] .mod-card,[data-theme="ktmex"] .mod-panel,[data-theme="ktmex"] .purchase-card{border:2px solid #0b1f4d;border-radius:4px;box-shadow:4px 4px 0 #1f4fd1}
[data-theme="ktmex"] .mod-card{border-top:6px solid var(--mc)}
[data-theme="ktmex"] .mod-panel{border-left:6px solid var(--mc)}
[data-theme="ktmex"] .card:hover,[data-theme="ktmex"] .tpf-card:hover,[data-theme="ktmex"] .mod-card:hover{border-color:#0b1f4d;box-shadow:4px 4px 0 #d7263d;transform:translate(-1px,-1px)}
[data-theme="ktmex"] .sec-box{border:2px dashed #5b8cff;border-radius:6px;background:rgba(255,255,255,.72)}
[data-theme="ktmex"] .sec-box-ic{background:#d7263d;color:#fff;border-radius:3px}
[data-theme="ktmex"] .tile .num,[data-theme="ktmex"] .kpi .num,[data-theme="ktmex"] .mod-num{font-family:"Audiowide","IBM Plex Mono",monospace;font-weight:400}
[data-theme="ktmex"] .tile{border-top:6px solid #1f4fd1}
[data-theme="ktmex"] .tile:nth-child(2n){border-top-color:#5b8cff}
[data-theme="ktmex"] .tile:last-child{border-top-color:#d7263d}
[data-theme="ktmex"] .dcard h3::before{content:"";display:inline-block;width:9px;height:9px;background:#d7263d;margin-right:7px;vertical-align:0}
[data-theme="ktmex"] .sec-title{color:#13348f;border-left:4px solid #d7263d;padding-left:7px}
[data-theme="ktmex"] .btn{border-radius:3px}
[data-theme="ktmex"] .btn-primary{background:#1f4fd1;border:2px solid #0b1f4d;box-shadow:3px 3px 0 #d7263d;text-transform:uppercase;letter-spacing:.05em;font-size:12.5px}

/* ---- ventanita «¿dónde está trabajando?» ---- */
.tec-pop{position:fixed;z-index:40;width:380px;max-width:calc(100% - 16px);background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px -8px rgba(0,0,0,.35),var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tec-pop[hidden]{display:none}
.tpop-h{display:flex;gap:10px;align-items:center}
.tpop-h .role-avatar{width:40px;height:40px}
.tpop-h div{display:flex;flex-direction:column;min-width:0}
.tpop-k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted)}
.tpop-h b{font-size:13px}
.tpop-job{display:flex;flex-direction:column;gap:2px;border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--surface-2);font-size:12px}
.tpop-st{font-size:10.5px;font-weight:700;color:var(--proc)}
.tpop-sub{font-size:10.5px;color:var(--fg-muted)}
.tpop-row{display:flex;gap:6px;align-items:center;color:var(--fg-muted);font-size:11.5px}
.tpop-row b{color:var(--fg)}
.tpop-empty{font-size:11.5px;color:var(--fg-muted)}
.tpop-more{font-size:10.5px;color:var(--fg-muted);line-height:1.4}
.mm-stage{position:relative;width:100%;aspect-ratio:3197/1786;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:#fff}
.mm-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mm-badge{position:absolute;left:6px;bottom:6px;font-size:9.5px;font-weight:700;background:rgba(255,255,255,.9);color:#0b1f4d;border-radius:4px;padding:1px 6px;border:1px solid #c9d3e6}
.mm-z{fill:rgba(31,111,235,.28);stroke:#1f6feb;stroke-width:8}
.mm-z.main{fill:rgba(215,38,61,.45);stroke:#d7263d;stroke-width:12;animation:mmpulse 1.4s ease-in-out infinite}
@keyframes mmpulse{50%{fill:rgba(215,38,61,.18)}}
@media (prefers-reduced-motion: reduce){.mm-z.main{animation:none}}
.mm-l{font:700 40px "IBM Plex Sans",sans-serif;fill:#0b1f4d;paint-order:stroke;stroke:#fff;stroke-width:10px;text-anchor:middle}
.mm-l.main{fill:#b3001b;font-size:56px}
.tpf-actions .tpf-pin{flex:0 0 auto;padding-left:9px;padding-right:9px}
.mm-key{display:inline-block;width:10px;height:10px;border-radius:2px;background:rgba(31,111,235,.35);border:2px solid #1f6feb;vertical-align:-1px}
.mm-key.main{background:rgba(215,38,61,.45);border-color:#d7263d}

/* ---- rol de turnos ---- */
.turno-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 7px 2px 2px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid var(--border);white-space:nowrap;vertical-align:middle;line-height:1.3}
.turno-chip i{font-style:normal;min-width:16px;height:16px;padding:0 3px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font:700 10px "IBM Plex Mono",ui-monospace,monospace;background:var(--kb,#fff);color:var(--kf,#131a2c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.turno-chip.knone{padding:2px 7px;color:var(--fg-muted)}
.k1{--kb:#ffffff;--kf:#131a2c}.k2{--kb:#2b4c9b;--kf:#ffffff}.kD{--kb:#e3e7ee;--kf:#5f6878}.kG{--kb:#1f2533;--kf:#ffc247}.kV{--kb:#3e9e4c;--kf:#ffffff}
.kT{--kb:#8455bd;--kf:#ffffff}.kH{--kb:#f4d738;--kf:#3a3000}.kA{--kb:#d23f3f;--kf:#ffffff}.kI{--kb:#f0a3be;--kf:#4a1028}.kP{--kb:#3b9db0;--kf:#ffffff}.kE{--kb:#ffffff;--kf:#4b566b}.knone{--kb:transparent;--kf:var(--fg-muted)}
.rg-c{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:5px;background:var(--kb);color:var(--kf);font:700 11px "IBM Plex Mono",ui-monospace,monospace;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}

.rg-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.rg{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.rg th,.rg td{padding:3px 2px;text-align:center;border-bottom:1px solid var(--border)}
.rg tbody tr:last-child th,.rg tbody tr:last-child td{border-bottom:0}
.rg thead th{font-weight:600;color:var(--fg-muted);background:var(--surface-2);position:sticky;top:0}
.rg thead th span{display:block;font-size:9.5px;text-transform:uppercase}
.rg thead th b{display:block;font:700 11px "IBM Plex Mono",ui-monospace,monospace;color:var(--fg)}
.rg th.rg-n{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:3px 10px 3px 8px;white-space:nowrap;font-weight:700;color:var(--fg);cursor:pointer}
.rg thead th.rg-n{background:var(--surface-2)}
.rg .we{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.rg thead th.fest b{color:#9a7b00}
.rg thead th.paro{background:repeating-linear-gradient(135deg,var(--surface-2) 0 4px,var(--border) 4px 6px)}
.rg .hoy{box-shadow:inset 0 0 0 2px var(--accent)}
.rg-ley{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:11px;color:var(--fg-muted)}
.rg-ley > span{display:inline-flex;align-items:center;gap:5px}
.rg-ley .rg-c{min-width:18px;height:18px;font-size:10px}
.turno-hoy{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:4px;font-size:12px}
.th-g{display:inline-flex;align-items:center;gap:6px}
.pf-turnos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pt-d{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;border-radius:6px;font-size:10px;color:var(--fg-muted)}
.pt-d.we{background:var(--surface-2)}
.pt-d.hoy{box-shadow:inset 0 0 0 2px var(--accent)}
.mv-turno{display:flex !important;align-items:center;gap:5px}
.tec-rol{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.tec-rol[hidden]{display:none}
.tec-rol-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.tec-rol-tit{display:flex;gap:10px;align-items:flex-start;min-width:0;flex:1 1 320px}
.tec-rol-tit h3{font-size:13.5px;font-weight:700;line-height:1.3}
.tec-rol-tit p{font-size:11px;color:var(--fg-muted);margin-top:2px;line-height:1.4}
.tec-rol-nav{display:flex;gap:6px;flex-wrap:wrap}
.tec-rol-nav .btn[disabled]{opacity:.45;cursor:default}
.tec-rol-cob{display:flex;align-items:flex-start;gap:10px;margin-top:10px;font-size:12px}
.tec-rol-cob > b{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding-top:5px}
.tec-rol-cob .turno-hoy{margin-top:0}
.crit-ol{margin:4px 0 0;padding-left:20px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:5px}
[data-theme="mac"] .rg-c{border-radius:0}
/* ---- barra de avance de la carga y entrada suave del contenido ---- */
.carga{position:fixed;top:0;left:0;right:0;z-index:3000;pointer-events:none;transition:opacity .45s ease .15s}
.carga.fin{opacity:0}
.carga[hidden]{display:none}
.carga-bar{height:3px;background:color-mix(in srgb,var(--accent) 12%,transparent);overflow:hidden}

<script>
(function(){
"use strict";
// ══════════════════════════════════════════════════════════════
// Centro de Mantenimiento KTMEX · V9.19.3 (basado en el demo «Centro de Mantenimiento Ktmex-FAC (6)»)
// Este archivo NO trae datos: el sistema (index.html) inyecta en #cm-data lo
// que devuelve el servidor con la sesión iniciada, y cada acción se pide al
// sistema con postMessage ({type:'cm-accion'}). El servidor valida sesión y rol.
// ══════════════════════════════════════════════════════════════
var BOOT={}; try{BOOT=JSON.parse(document.getElementById('cm-data').textContent||'{}');}catch(e){BOOT={};}
var S=BOOT.servidor||{}, FOTOS=BOOT.fotos||{}, TRAD=BOOT.trad||{}, CURSOS_EN=BOOT.cursosEn||{};
var SOLO_INGLES=!!BOOT.soloIngles, LANG=SOLO_INGLES?'en':(BOOT.lang==='en'?'en':'es');
// V9.19.4: japonés solo dentro del Centro (el resto del sistema sigue ES/EN). Se recuerda en este navegador.
try{if(localStorage.getItem('ktmex-cm-lang')==='ja')LANG='ja';}catch(e){}
var YO=S.yo||{}, CFG=S.cfg||{anticipacionMinDias:14,leadTimeDias:30};
var JA_UI=(function(){try{return JSON.parse(document.getElementById('cm-ja').textContent||'{}');}catch(e){return {};}})(), JA_FALTAN={};
// Japonés: diccionario por el texto en español; si trae números se busca con «#» en su lugar. Si falta, se usa el inglés.
function jaT(es,en){es=String(es==null?'':es);if(!es)return en==null?'':en;if(Object.prototype.hasOwnProperty.call(JA_UI,es))return JA_UI[es];
  var nums=[],k=es.replace(/\d+(?:[.,]\d+)*/g,function(m){nums.push(m);return '#';});
  if(nums.length&&Object.prototype.hasOwnProperty.call(JA_UI,k)){var i=0;return JA_UI[k].replace(/#/g,function(){return nums[i++]||'';});}
  JA_FALTAN[es]=en; return en==null?es:en;}
function T(es,en){return LANG==='en'?en:(LANG==='ja'?jaT(es,en):es);}
function L(o){if(!o)return '';return LANG==='en'?(o.en||o.es||''):(LANG==='ja'?(o.ja||o.en||o.es||''):(o.es||''));}
function trPat(x,l){var m=/^(\d+(?:\.\d+)?) kg · 1 cada (\d+) min$/.exec(x);if(m)return l==='ja'?m[1]+' kg・'+m[2]+'分に1回':m[1]+' kg · once every '+m[2]+' min';
  m=/^(\d+(?:\.\d+)?) kg · 1 vez por día$/.exec(x);if(m)return l==='ja'?m[1]+' kg・1日1回':m[1]+' kg · once a day';
  m=/^(\d+(?:\.\d+)?) kg entre (\d+) personas$/.exec(x);if(m)return l==='ja'?m[1]+' kgを'+m[2]+'人で':m[1]+' kg shared by '+m[2]+' people';return null;}
function TD(x){x=String(x==null?'':x);if(LANG==='es'||!x)return x;var D2=(S&&S.trad)||{};
  if(LANG==='en')return TRAD[x]||(D2.en&&D2.en[x])||trPat(x,'en')||x;
  return (D2.ja&&D2.ja[x])||trPat(x,'ja')||(JA_UI[x]!=null?JA_UI[x]:null)||TRAD[x]||(D2.en&&D2.en[x])||x;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}

// ── Puente con el sistema ──
var PEND={}, SEQ=0;
function api(op,payload){
  return new Promise(function(res){
    var id=++SEQ; PEND[id]=res;
    try{parent.postMessage({type:'cm-accion',id:id,op:op,payload:payload||{}},'*');}catch(e){delete PEND[id];res({success:false,error:'postMessage'});return;}
    setTimeout(function(){if(PEND[id]){delete PEND[id];res({success:false,error:T('El sistema no respondió. Revisa tu conexión e intenta de nuevo.','The system did not respond. Check your connection and try again.')});}},180000);
  });
}
function errTxt(r,es,en){if(!r)return T(es,en);if(LANG==='ja'&&r.errorJa)return r.errorJa;if(LANG!=='es'&&r.errorEn)return LANG==='ja'?jaT(r.error||es,r.errorEn):r.errorEn;return r.error||T(es,en);}
window.addEventListener('message',function(e){
  if(e.source!==parent)return; var d=e.data||{};
  if(d.type==='cm-resultado'&&PEND[d.id]){var f=PEND[d.id];delete PEND[d.id];f(d.ok?(d.result||{success:false}):{success:false,error:d.error||'Error'});}
  else if(d.type==='cm-lang'){if(SOLO_INGLES&&LANG==='ja')return;setLang(SOLO_INGLES?'en':(d.lang==='en'?'en':'es'),true);}
});

// ── Fechas y formato ──
function parseFecha(iso){if(iso instanceof Date)return new Date(iso.getTime());var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(m)return new Date(+m[1],+m[2]-1,+m[3]);return new Date(iso);}

function reducirADataURL(file,maxChars){
  return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var lados=[900,720,600,480,380,300],cal=[0.8,0.7,0.6,0.5];URL.revokeObjectURL(url);
      for(var i=0;i<lados.length;i++){var s=Math.min(1,lados[i]/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        for(var k=0;k<cal.length;k++){var d=c.toDataURL('image/jpeg',cal[k]);if(d.length<=maxChars)return res(d);}}
      rej(new Error('grande'));};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('imagen'));}; img.src=url;});
}

var MAP_X0=304, MAP_Y0=236, MAP_W=3197, MAP_H=1786;
function capSemanal(){return Number(CFG.capacidadSemanalHoras)||45;}
function diasUrgente(){return Number(CFG.diasUrgente)||7;}
function esActiva(w){return w.estado==='enviada'||w.estado==='confirmada'||w.estado==='en_proceso';}
// llave del técnico de una orden: username si lo trae; si no (fallas), por nombre
function tecKey(w){var u=tecDe(w);if(u)return u;var n=norm(w.tecnico);if(!n)return '';var t=TECS.find(function(x){return norm(x.nombre)===n;});return t?String(t.username).toLowerCase():'';}
function finSemana(){var d=parseFecha(hoyISO()),dw=d.getDay();d.setDate(d.getDate()+(dw===0?0:7-dw));return iso(d);}
function nombreCorto(t){var p=String(t||'').trim().split(/\s+/);return p.length>=4?p[0]+' '+p[p.length-2]:p.slice(0,2).join(' ');}

// ── Matriz de Eisenhower ──
// Urgente: orden de plan a ≤ N días de su fecha (o vencida); falla de prioridad Alta o Media.
// Importante: plan de criticidad A (seguridad, cumplimiento legal o paro de operación, según la evaluación
// validada en campo); en fallas, prioridad Alta.
var CUAD={
  1:{es:'Hacer ya',en:'Do now',ses:'Urgente e importante',sen:'Urgent and important',ees:'Se envía primero.',een:'Goes out first.'},
  2:{es:'Planificar',en:'Schedule',ses:'Importante, no urgente',sen:'Important, not urgent',ees:'Se programa con anticipación; al faltar pocos días pasa a «Hacer ya».',een:'Schedule it ahead; when only a few days remain it becomes «Do now».'},
  3:{es:'Delegar',en:'Delegate',ses:'Urgente, no importante',sen:'Urgent, not important',ees:'Debe salir pronto; se puede dar a cualquier técnico capacitado.',een:'Must go out soon; any trained technician can take it.'},
  4:{es:'Reprogramar',en:'Reschedule',ses:'Ni urgente ni importante',sen:'Neither urgent nor important',ees:'Sale al final; espera hasta volverse urgente.',een:'Goes out last; it waits until it becomes urgent.'}};
function cuadNom(q){return T(CUAD[q].es,CUAD[q].en);}
function cuadSub(q){return T(CUAD[q].ses,CUAD[q].sen);}
function eisenhower(w){
  var esCorr=w.tipo==='Correctivo',u,i,mu;
  if(esCorr){u=w.prioridad==='Alta'||w.prioridad==='Media';i=w.prioridad==='Alta';mu=T('falla de prioridad ','failure priority ')+prioTxt(w.prioridad||'Media');}
  else{var d=diasEntre(w.fecha,hoyISO());u=d<=diasUrgente();i=criticidadDe(w)==='A';mu=d<0?T('vencida hace ','overdue by ')+(-d)+' d':(d===0?T('programada hoy','due today'):T('faltan ','left: ')+d+' d');}
  var q=u?(i?1:3):(i?2:4);
