<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centro de Mantenimiento KTMEX</title>
<meta name="cm-marca" content="Centro de Mantenimiento KTMEX · V9.19.0">
<!-- Pantalla del Centro de Mantenimiento. NO contiene datos: el sistema los inyecta en #cm-data con la sesión iniciada. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{box-sizing:border-box}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout concept: fixed top app-bar (brand + conectado + selector de bandeja)
   over a scrolling single column of cards on mobile / a responsive grid on
   wider screens. The "bandeja" selector simulates switching between the
   dispatcher's general view, Compras' inbox and each technician's own inbox,
   each with its own workflow actions. A right-side slide-over panel shows
   order detail + materials + the action available to the current bandeja. */
:root{
  --bg:#fcfdfe;
  --surface:#ffffff;
  --surface-2:#f3f5f8;
  --fg:#1c2433;
  --fg-muted:#6b7488;
  --border:#e6e9f0;
  --accent:#2f6fed;
  --accent-fg:#ffffff;
  --accent-soft:#eef3ff;
  --ok:#1a7f5a;
  --ok-bg:#e3f5ec;
  --warn:#9a5b00;
  --warn-bg:#fdf0db;
  --crit:#b3261e;
  --crit-bg:#fbe7e5;
  --info:#1d5fbf;
  --info-bg:#e8f0fd;
  --conf:#6d28d9;
  --conf-bg:#efe8fd;
  --proc:#0f766e;
  --proc-bg:#e1f5f2;
  --shadow:0 1px 2px rgba(16,21,31,.05),0 8px 24px -12px rgba(16,21,31,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  /* Solo "Auto" (sin atributo data-theme) sigue el modo oscuro del sistema;
     cualquier tema elegido a mano conserva sus propios colores. */
  :root:not([data-theme]){
    --bg:#0b0e14;
    --surface:#141924;
    --surface-2:#1a2130;
    --fg:#e8ecf3;
    --fg-muted:#9aa5b5;
    --border:#2a3344;
    --accent:#5c8df6;
    --accent-fg:#0b1220;
    --accent-soft:#16233c;
    --ok:#4fd396;
    --ok-bg:#122a22;
    --warn:#f2b84b;
    --warn-bg:#2e2410;
    --crit:#ff7a70;
    --crit-bg:#331715;
    --info:#7eb0ff;
    --info-bg:#14223a;
    --conf:#c3a4fb;
    --conf-bg:#271b40;
    --proc:#5eead4;
    --proc-bg:#0f2e2b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14;
  --surface:#141924;
  --surface-2:#1a2130;
  --fg:#e8ecf3;
  --fg-muted:#9aa5b5;
  --border:#2a3344;
  --accent:#5c8df6;
  --accent-fg:#0b1220;
  --accent-soft:#16233c;
  --ok:#4fd396;
  --ok-bg:#122a22;
  --warn:#f2b84b;
  --warn-bg:#2e2410;
  --crit:#ff7a70;
  --crit-bg:#331715;
  --info:#7eb0ff;
  --info-bg:#14223a;
  --conf:#c3a4fb;
  --conf-bg:#271b40;
  --proc:#5eead4;
  --proc-bg:#0f2e2b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
/* ---- combinaciones adicionales de tema ---- */
/* Acero industrial: azul acero oscuro + acento cian (salas de control / TV de monitoreo) */
:root[data-theme="acero"]{
  --bg:#0d1520; --surface:#132031; --surface-2:#1a2a3f; --fg:#e6edf5; --fg-muted:#93a4ba; --border:#263a54;
  --accent:#4cc3ff; --accent-fg:#04121c; --accent-soft:#11293d;
  --ok:#4fd396; --ok-bg:#10291f; --warn:#f2b84b; --warn-bg:#2f2610; --crit:#ff7a70; --crit-bg:#351816;
  --info:#7eb0ff; --info-bg:#14243d; --conf:#c3a4fb; --conf-bg:#281c42; --proc:#5eead4; --proc-bg:#0f2f2c;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -12px rgba(0,0,0,.65);
  color-scheme:dark;
}
/* Grafito: gris neutro oscuro (sin tono azul) + acento naranja de seguridad (taller) */
:root[data-theme="grafito"]{
  --bg:#121212; --surface:#1c1c1c; --surface-2:#262626; --fg:#ececec; --fg-muted:#a3a3a3; --border:#353535;
  --accent:#ff8a3d; --accent-fg:#1a0d03; --accent-soft:#33210f;
  --ok:#5ad19a; --ok-bg:#132a20; --warn:#f2cf4b; --warn-bg:#2e2a10; --crit:#ff7a70; --crit-bg:#341917;
  --info:#8ab4ff; --info-bg:#172338; --conf:#c9aefc; --conf-bg:#2a1f3f; --proc:#5eead4; --proc-bg:#10302c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
/* Arena: claro cálido, menos luz azul (jornadas largas frente a la pantalla) */
:root[data-theme="arena"]{
  --bg:#f7f3ea; --surface:#fffdf8; --surface-2:#f0e9da; --fg:#2b2418; --fg-muted:#776b57; --border:#e4dac6;
  --accent:#b5651d; --accent-fg:#ffffff; --accent-soft:#f7e9d9;
  --ok:#2f7d4f; --ok-bg:#e4f1e2; --warn:#8a5a00; --warn-bg:#f8ecd0; --crit:#b3261e; --crit-bg:#f8e3dc;
  --info:#2c5f9e; --info-bg:#e6eef7; --conf:#6d3fb5; --conf-bg:#eee6f6; --proc:#136f63; --proc-bg:#e0f0ea;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 8px 24px -12px rgba(60,40,10,.18);
  color-scheme:light;
}
/* Verde planta: claro con acento verde "condición segura" (seguridad e higiene, tablets en piso) */
:root[data-theme="verde"]{
  --bg:#f8fbf9; --surface:#ffffff; --surface-2:#eef5f0; --fg:#17261d; --fg-muted:#5f7266; --border:#dbe7df;
  --accent:#1f8a4c; --accent-fg:#ffffff; --accent-soft:#e6f4ec;
  --ok:#1a7f5a; --ok-bg:#e3f5ec; --warn:#9a5b00; --warn-bg:#fdf0db; --crit:#b3261e; --crit-bg:#fbe7e5;
  --info:#1d5fbf; --info-bg:#e8f0fd; --conf:#6d28d9; --conf-bg:#efe8fd; --proc:#0f766e; --proc-bg:#e1f5f2;
  --shadow:0 1px 2px rgba(16,31,21,.05),0 8px 24px -12px rgba(16,31,21,.14);
  color-scheme:light;
}
/* Alto contraste: negro sobre blanco, bordes marcados (reflejos, luz solar, accesibilidad) */
:root[data-theme="contraste"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#efefef; --fg:#000000; --fg-muted:#2e2e2e; --border:#3a3a3a;
  --accent:#0040c1; --accent-fg:#ffffff; --accent-soft:#dbe6ff;
  --ok:#00663d; --ok-bg:#d6f5e6; --warn:#7a4100; --warn-bg:#ffe8c2; --crit:#a1000b; --crit-bg:#ffdcdc;
  --info:#003f9e; --info-bg:#dce8ff; --conf:#4c0fb0; --conf-bg:#ebe0ff; --proc:#005c55; --proc-bg:#d4f2ee;
  --shadow:0 0 0 1px rgba(0,0,0,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,sans-serif;padding:0;margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
h1,h2,h3{text-wrap:balance;margin:0}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}

.app{min-height:100%;display:flex;flex-direction:column}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--fg);
  padding:12px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);border-bottom:1px solid var(--border)}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto}
.brand-mark{width:34px;height:34px;flex:none;border-radius:8px;background:var(--accent);
  display:flex;align-items:center;justify-content:center}
.brand-text{min-width:0}
.brand-text h1{font-size:16px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text p{margin:2px 0 0;font-size:11.5px;color:var(--fg-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;flex:none}
.conn{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-muted);font-weight:500;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#9aa5b5}
.dot.live{background:#1a7f5a;box-shadow:0 0 0 3px rgba(26,127,90,.18)}

/* selector de tema: básicos (Auto / Claro / Oscuro) + combinaciones por uso,
   con vista previa de colores y una recomendación según la hora y la bandeja */
.theme-switch{display:flex;align-items:center;gap:6px;flex:none;position:relative}
.theme-label{font-size:11px;color:var(--fg-muted);font-weight:600;white-space:nowrap}
.theme-btn{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:9px;padding:5px 8px 5px 6px;cursor:pointer;color:var(--fg);font-size:12px;font-weight:600}
.theme-btn-name{white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.theme-menu{position:fixed;width:340px;background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);z-index:26;padding:8px;overflow-y:auto}
.theme-menu[hidden]{display:none}
.theme-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding:10px 8px 4px}
.theme-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:8px;
  padding:7px 8px;cursor:pointer;text-align:left;color:var(--fg)}
.theme-item:hover{background:var(--surface-2)}
.theme-item.active{background:var(--accent-soft)}
.theme-item-text{display:flex;flex-direction:column;min-width:0;flex:1}
.theme-item-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.theme-item-why{font-size:10.5px;color:var(--fg-muted);line-height:1.35}
.theme-check{flex:none;color:var(--accent);visibility:hidden}
.theme-item.active .theme-check{visibility:visible}
.theme-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;
  padding:1px 6px;background:var(--ok-bg);color:var(--ok)}
/* mini vista previa: fondo + tarjeta + botón de acento */
.tp{position:relative;display:block;width:46px;height:32px;flex:none;border-radius:7px;border:1px solid;overflow:hidden}
#theme-btn-prev{display:flex}
.tp-card{position:absolute;left:5px;top:5px;width:26px;height:20px;border-radius:4px;border:1px solid;padding:4px 3px;
  display:flex;flex-direction:column;gap:3px}
.tp-line{display:block;height:3px;border-radius:2px;width:100%}
.tp-line.short{width:60%}
.tp-btn{position:absolute;right:4px;bottom:4px;width:10px;height:10px;border-radius:50%}
.theme-btn .tp{width:28px;height:20px;border-radius:5px}
.theme-btn .tp-card{left:3px;top:3px;width:15px;height:12px;padding:2px;gap:2px;border-radius:3px}
.theme-btn .tp-line{height:2px}
.theme-btn .tp-btn{width:6px;height:6px;right:3px;bottom:3px}
.theme-rec{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.theme-rec-text{flex:1;min-width:0}
.theme-rec-k{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.theme-rec-name{font-size:13px;font-weight:700;margin-top:1px}
.theme-rec-why{font-size:10.5px;color:var(--fg-muted);line-height:1.35;margin-top:2px}
@media (max-width:560px){.theme-btn-name{display:none}}

/* tipo de mantenimiento y tipo de equipo */
.tm{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;
  text-transform:none;letter-spacing:0}
.tm.Preventivo{background:var(--proc-bg);color:var(--proc)}
.tm.Predictivo{background:var(--conf-bg);color:var(--conf)}
.tm.Correctivo{background:var(--crit-bg);color:var(--crit)}
.tm i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--fg-muted);white-space:nowrap}
.cat i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none}
.card-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px}
.prio{font-size:10px;font-weight:700;color:var(--crit)}
.act-tipo{flex:none}
.card.correctivo{border-left:3px solid var(--crit)}

/* fichas extra en el perfil del equipo */
.ficha-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ficha-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mini-btn{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;cursor:pointer}
.mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.mini-btn.danger{color:var(--crit)}
.mini-btn.danger:hover{border-color:var(--crit)}
.mini-btn:disabled{opacity:.6;cursor:default}
.equipo-photo.has-img{padding:0;overflow:hidden;cursor:zoom-in}
.equipo-photo.has-img img{width:100%;height:100%;object-fit:cover;display:block}
.photo-note{font-size:10px;color:var(--fg-muted)}
.hist-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px}
.hist-row:last-child{border-bottom:0}
.hist-row .h-sub{grid-column:2 / 4;font-size:10.5px;color:var(--fg-muted)}
.hist-row.cur{background:var(--accent-soft)}

/* lightbox para fotos de equipo */
.lbx{position:fixed;inset:0;background:rgba(10,14,20,.86);z-index:60;display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lbx.show{display:flex}
.lbx img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* formulario (reportar falla) */
.fdlg{width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow-y:auto}
.fgrid{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.fgrid label{font-size:11.5px;font-weight:700;color:var(--fg);display:flex;flex-direction:column;gap:5px}
.fgrid textarea,.fgrid select,.fgrid input[type=text]{font:inherit;font-size:12.5px;color:var(--fg);background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.fgrid textarea{min-height:70px;resize:vertical}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.frow label{min-width:0}
.fgrid select{width:100%;min-width:0}
@media (max-width:480px){.frow{grid-template-columns:1fr}}
.mat-pick{max-height:170px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;padding:4px}
.mat-pick label{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:11.5px;padding:4px 6px;border-radius:6px;cursor:pointer}
.mat-pick label:hover{background:var(--surface-2)}
.ferr{font-size:11.5px;color:var(--crit);font-weight:700;min-height:1em}

/* reloj de simulación */
.simclock{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--conf);background:var(--conf-bg);
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.simclock[hidden]{display:none}
@media (max-width:760px){.simclock .sc-long{display:none}}

/* dashboard */
.dash-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dash-toolbar .spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg-muted);font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.dash-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0;grid-column:span 6}
.dcard.w4{grid-column:span 4}.dcard.w8{grid-column:span 8}.dcard.w12{grid-column:span 12}
@media (max-width:900px){.dcard,.dcard.w4,.dcard.w8{grid-column:span 12}}
.dcard h3{font-size:12.5px;font-weight:700;margin-bottom:2px}
.dcard .dsub{font-size:11px;color:var(--fg-muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:10px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi .num{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .lbl{font-size:11px;color:var(--fg-muted);font-weight:600;margin-top:3px}
.kpi .sub{font-size:10.5px;color:var(--fg-muted);margin-top:2px}
.kpi.ok .num{color:var(--ok)}.kpi.crit .num{color:var(--crit)}.kpi.info .num{color:var(--info)}.kpi.conf .num{color:var(--conf)}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;min-width:150px;flex:1}
.legend .li{display:flex;align-items:center;gap:8px}
.legend .li i{width:10px;height:10px;border-radius:3px;flex:none}
.legend .li b{margin-left:auto;font-variant-numeric:tabular-nums}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:11.5px}
@media (max-width:560px){.hbar{grid-template-columns:118px 1fr 32px;font-size:11px}}
.hbar .hl{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .hl img{width:20px;height:20px;border-radius:5px;object-fit:cover;flex:none}
.hbar .track{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.hbar .track span{display:block;height:100%}
.hbar .hv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cols{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:6px}
.cols .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;min-width:0;height:100%}
.cols .col span{display:block;border-radius:2px 2px 0 0}
.cols-x{display:flex;gap:4px;font-size:9.5px;color:var(--fg-muted);margin-top:4px}
.cols-x span{flex:1;text-align:center;min-width:0;overflow:hidden}
.chart-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--fg-muted);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.log-table{width:100%;border-collapse:collapse;font-size:12px}
.log-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-muted);font-weight:700;
  padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.log-table td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.log-table tr:hover td{background:var(--surface-2)}
.log-table .ev{font-weight:700}
.log-scroll{overflow-x:auto}
@media (max-width:640px){.log-table .hide-sm{display:none}}
.sim-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sim-note{font-size:11px;color:var(--fg-muted);line-height:1.45;margin-top:8px}
.prog{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.prog span{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.dash-link{display:inline-flex;align-items:center;gap:6px}

/* reiniciar simulación */
.reset-btn{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:6px 10px;font-size:12px}
.reset-btn:disabled{opacity:.6;cursor:default}
@media (max-width:820px){#reset-label{display:none}}

/* diálogo de confirmación propio (los diálogos nativos pueden estar bloqueados dentro del artefacto) */
.cdlg-scrim{position:fixed;inset:0;background:rgba(23,32,51,.5);z-index:45;opacity:0;pointer-events:none;transition:opacity .16s}
.cdlg-scrim.show{opacity:1;pointer-events:auto}
.cdlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(440px,calc(100vw - 32px));
  background:var(--surface);color:var(--fg);border-radius:14px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:46;
  padding:18px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.cdlg.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.cdlg h3{font-size:15px;font-weight:700}
.cdlg-body{font-size:12.5px;color:var(--fg-muted);line-height:1.5;margin-top:8px}
.cdlg-body ul{margin:8px 0 0;padding-left:18px}
.cdlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn-danger{background:var(--crit);color:#fff}

/* bandeja (role inbox) switcher — a fictitious "menu" for the demo that
   simulates logging in as the dispatcher, Compras, or a given technician */
.bandeja-switch{position:relative}
.bandeja-btn{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:5px 10px 5px 5px;cursor:pointer;color:var(--fg)}
.bandeja-avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:.01em;overflow:hidden}
.bandeja-avatar.sm{width:28px;height:28px;font-size:11px}
.bandeja-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
/* foto de perfil en recuadro (tamaño mediano) en el encabezado de la bandeja */
.role-avatar{width:64px;height:64px;border-radius:10px;object-fit:cover;object-position:center top;flex:none;display:block;
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border),0 2px 8px rgba(16,21,31,.12);background:var(--surface)}
.role-avatar-ph{display:flex;align-items:center;justify-content:center;color:var(--accent)}
.role-avatar-ph svg{width:26px;height:26px}
.role-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.role-name{font-size:14px;font-weight:700;color:var(--fg)}
.role-sub{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted)}
.role-desc{font-size:11.5px;font-weight:600}
.bandeja-label{font-size:12.5px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bandeja-chevron{flex:none;color:var(--fg-muted)}
.bandeja-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--border);
  border-radius:12px;box-shadow:var(--shadow);min-width:270px;max-width:320px;max-height:72vh;overflow-y:auto;z-index:25;padding:6px}
.bandeja-sep{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);padding:10px 10px 4px}
.bandeja-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-radius:8px;
  padding:7px 8px;cursor:pointer;text-align:left}
.bandeja-item:hover{background:var(--surface-2)}
.bandeja-item.active{background:var(--accent-soft)}
.bandeja-item.active .bandeja-item-label{color:var(--accent)}
.bandeja-item-text{display:flex;flex-direction:column;min-width:0}
.bandeja-item-label{font-size:12.5px;font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bandeja-item-sub{font-size:10.5px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.role-banner{display:flex;align-items:center;gap:12px;background:var(--accent-soft);color:var(--accent);
  border-radius:12px;padding:10px 12px;font-size:11.5px;font-weight:600;line-height:1.4}
.role-banner[hidden]{display:none}
.role-banner svg{flex:none}
.role-banner b{font-weight:700}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 0}
.tiles[hidden]{display:none}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .lbl{font-size:11.5px;color:var(--fg-muted);font-weight:500;margin-top:3px}
.tile.crit .num{color:var(--crit)}
.tile.ok .num{color:var(--ok)}
.tile.info .num{color:var(--info)}

/* content */
.content{flex:1;padding:14px 16px 40px;max-width:1180px;width:100%;margin:0 auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.select,.search{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font-size:12.5px;color:var(--fg);font-family:inherit}
.search{flex:1;min-width:160px}
.select{min-width:0}

.empty{background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:36px 20px;text-align:center;color:var(--fg-muted)}
.empty b{color:var(--fg);display:block;margin-bottom:6px;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.sec-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-muted);
  display:flex;align-items:center;justify-content:space-between;gap:8px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card-plan{font-size:11px;color:var(--fg-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.card-equipo{font-size:13.5px;font-weight:600;margin-top:2px;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:none}
.pill.pendiente{background:var(--warn-bg);color:var(--warn)}
.pill.enviada{background:var(--info-bg);color:var(--info)}
.pill.confirmada{background:var(--conf-bg);color:var(--conf)}
.pill.en_proceso{background:var(--proc-bg);color:var(--proc)}
.pill.completada{background:var(--ok-bg);color:var(--ok)}
.pill.solicitada{background:var(--warn-bg);color:var(--warn)}
.pill.cotizacion_recibida{background:var(--info-bg);color:var(--info)}
.pill.oc_generada{background:var(--conf-bg);color:var(--conf)}
.pill.recibido{background:var(--ok-bg);color:var(--ok)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--fg-muted)}
.card-meta span{display:flex;align-items:center;gap:4px}
.card-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:8px;margin-top:2px}
.card-tecnico{font-size:11.5px;color:var(--fg-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-flag{font-size:10.5px;font-weight:700;color:var(--crit);display:flex;align-items:center;gap:4px}
.auto-tag{font-size:9.5px;font-weight:700;color:var(--info);white-space:nowrap}
.card-auto{font-size:10.5px;color:var(--info);background:var(--info-bg);border-radius:7px;padding:5px 8px;
  display:flex;align-items:center;gap:5px;margin-top:-1px}

/* detail panel */
.scrim{position:fixed;inset:0;background:rgba(23,32,51,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:31;
  box-shadow:-12px 0 32px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .2s ease;
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.show{transform:translateX(0)}
.panel-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.panel-head h2{font-size:16px;font-weight:700;line-height:1.3}
.panel-head .card-plan{margin-bottom:3px}
.closebtn{border:1px solid var(--border);background:var(--surface-2);color:var(--fg);width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.panel-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.panel-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--fg-muted)}
.kv dd{margin:0;font-weight:600}

.acts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.act-row{display:flex;gap:8px;font-size:12.5px;padding:7px 9px;background:var(--surface-2);border-radius:8px}
.act-row .parte{font-weight:600;flex:none;color:var(--fg-muted);min-width:76px}

.mat-table{margin-top:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.mat-row{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:12px;border-top:1px solid var(--border)}
.mat-row:first-child{border-top:0}
.mat-code{font-weight:600;flex:none;width:58px}
.mat-desc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-stock{flex:none;color:var(--fg-muted);width:96px;text-align:right;white-space:nowrap;font-size:11px}
.status-dot{width:8px;height:8px;border-radius:50%;flex:none}
.status-dot.OK{background:var(--ok)}
.status-dot.CRIT{background:var(--crit)}
.status-dot.SOBRE{background:var(--info)}
.mat-more{padding:8px 10px;font-size:11.5px;color:var(--fg-muted);text-align:center;background:var(--surface-2)}

.btn{border:0;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn-primary{background:var(--accent);color:var(--accent-fg)}
.btn-primary:disabled{opacity:.55;cursor:default}
.btn-ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--border)}
.hint{font-size:11px;color:var(--fg-muted);text-align:center}

/* compras (bandeja de compras) */
.purchase-list{display:flex;flex-direction:column;gap:10px}
.purchase-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.purchase-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.purchase-title{font-size:13.5px;font-weight:700}
.purchase-sub{font-size:11.5px;color:var(--fg-muted);margin-top:2px}
.purchase-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qty{font-size:12.5px;font-weight:700;background:var(--crit-bg);color:var(--crit);padding:3px 9px;border-radius:999px;white-space:nowrap}
.timeline{display:flex;align-items:center;margin-top:12px;gap:0}
.tl-step{flex:1;display:flex;flex-direction:column;gap:5px;position:relative}
.tl-bar{height:5px;border-radius:3px;background:var(--border)}
.tl-bar.done{background:var(--ok)}
.tl-bar.active{background:var(--info)}
.tl-lbl{font-size:10px;color:var(--fg-muted);font-weight:600}
.tl-date{font-size:10.5px;font-weight:600}
.purchase-actions{margin-top:12px;display:flex;justify-content:flex-end}

/* ficha del equipo (foto ilustrativa + ubicación con mapa interactivo) */
.equipo-ficha{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px}
.equipo-photo{width:72px;height:72px;flex:none;border-radius:10px;background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--accent)}
.equipo-photo svg{width:42px;height:42px}
.equipo-info{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.equipo-info .nombre{font-size:13.5px;font-weight:700;line-height:1.3}
.equipo-info .sistema-tag{font-size:11px;color:var(--fg-muted);font-weight:600}
.loc-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.loc-chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);
  color:var(--fg);border-radius:999px;padding:4px 10px 4px 8px;font-size:11.5px;font-weight:600;cursor:pointer}
.loc-chip:hover{border-color:var(--accent);color:var(--accent)}
.loc-chip svg{flex:none}
.loc-chip-edit{display:inline-flex;align-items:center;gap:3px;margin-left:4px;padding-left:7px;border-left:1px solid var(--border);
  color:var(--accent);font-weight:700}
.loc-ro-note{font-size:10.5px;color:var(--fg-muted)}
.loc-modal.view .loc-list li,.loc-modal.view .loc-z{cursor:default}
.loc-saved{color:var(--ok);font-weight:700}
.loc-saving{color:var(--fg-muted);font-weight:700}
.loc-err{color:var(--crit);font-weight:700}

/* modal del layout interactivo de planta (mapa de zonas) */
.loc-modal-scrim{position:fixed;inset:0;background:rgba(23,32,51,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.loc-modal-scrim.show{opacity:1;pointer-events:auto}
.loc-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);width:min(920px,94vw);height:min(640px,88vh);
  background:var(--surface);border-radius:16px;box-shadow:0 24px 64px rgba(0,0,0,.35);z-index:41;
  display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.loc-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.loc-modal-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.loc-modal-head h3{font-size:14.5px;font-weight:700}
.loc-modal-head p{margin:2px 0 0;font-size:11.5px;color:var(--fg-muted)}
.loc-modal-body{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr}
@media (max-width:640px){.loc-modal-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}}
.loc-side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;padding:10px}
@media (max-width:640px){.loc-side{border-right:0;border-bottom:1px solid var(--border);max-height:150px}}
.loc-search{margin-bottom:8px;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font:inherit;font-size:12.5px;background:var(--surface);color:var(--fg)}
.loc-list{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1}
.loc-list li{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:12px}
.loc-list li:hover{background:var(--surface-2)}
.loc-list li.current{font-weight:700;background:var(--accent-soft);color:var(--accent)}
.loc-list li i{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.loc-list li.hide{display:none}
.loc-map{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:10px;background:var(--bg)}
.loc-stage{position:relative;width:100%;max-height:100%;aspect-ratio:3197/1786}
.loc-stage img,.loc-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.loc-stage img{user-select:none;-webkit-user-drag:none;pointer-events:none;border-radius:6px}
.loc-z{fill:transparent;stroke:none;cursor:pointer}
.loc-z.current{fill:var(--c);fill-opacity:.55;stroke:#000;stroke-width:3px;vector-effect:non-scaling-stroke}
.loc-z:hover{fill:var(--c);fill-opacity:.28}
.loc-lb{display:none;font:700 30px Arial,Helvetica,sans-serif;text-anchor:middle;dominant-baseline:middle;
  paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round;fill:#000;pointer-events:none}
.loc-lb.on{display:block}
.loc-tip{position:fixed;display:none;pointer-events:none;z-index:50;background:#111;color:#fff;padding:5px 10px;
  border-radius:7px;font-weight:600;font-size:12px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.loc-modal-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.loc-current-lbl{font-size:11.5px;color:var(--fg-muted)}
.loc-current-lbl b{color:var(--fg)}
.loc-foot-actions{display:flex;gap:8px}

/* toast */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:50;pointer-events:none}
.toast{background:var(--accent);color:var(--accent-fg);padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);
  font-size:12.5px;font-weight:600;max-width:min(480px,90vw);text-align:center;transform:translateY(12px);opacity:0;
  transition:all .22s ease}
.toast.show{transform:translateY(0);opacity:1}

@media (max-width:520px){.bandeja-label{display:none}}
@media (max-width:460px){#conn-text{display:none}}
@media (max-width:400px){#theme-label{display:none}}
@media (max-width:520px){.role-avatar{width:52px;height:52px}.role-name{font-size:13px}}
@media (prefers-reduced-motion:reduce){.panel,.scrim,.toast{transition:none}}
/* ── V9.19.0: añadidos del sistema real ── */
.pill.cerrada{background:var(--surface-2);color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok-bg)}
.pill.aprobacion{background:var(--warn-bg);color:var(--warn)}
.pill.cotizacion{background:var(--info-bg);color:var(--info)}
.pill.ordenada{background:var(--conf-bg);color:var(--conf)}
.pill.recibida{background:var(--ok-bg);color:var(--ok)}
.pill.cancelada{background:var(--crit-bg);color:var(--crit)}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--surface)}
.lang-switch[hidden]{display:none}
.lang-switch button{background:none;border:0;padding:7px 10px;font-weight:700;font-size:12px;color:var(--fg-muted);cursor:pointer;font-family:inherit}
.lang-switch button.on{background:var(--accent);color:var(--accent-fg)}
.panel.wide{width:min(880px,100vw)}
.asig-box{border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-2);display:grid;gap:10px;width:100%}
.asig-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.asig-box label,.sug-field{font-size:12px;font-weight:600;color:var(--fg-muted);display:grid;gap:4px}
.asig-box select,.asig-box input,.sug-field select,.sug-field input{font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0}
.adv{font-size:12px;border-radius:8px;padding:7px 10px;line-height:1.4}
.adv.alta{background:var(--crit-bg);color:var(--crit)}.adv.media{background:var(--warn-bg);color:var(--warn)}.adv.info{background:var(--info-bg);color:var(--info)}.adv.ok{background:var(--ok-bg);color:var(--ok)}
.advs{display:grid;gap:6px}
.eq-list{display:grid;gap:6px}
.eq-row{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface)}
.eq-row .eq-n{font-weight:600;font-size:13px;min-width:0;overflow-wrap:anywhere}
.eq-row .eq-s{font-size:11.5px;color:var(--fg-muted)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}

// ── Fechas y formato ──
function parseFecha(iso){if(iso instanceof Date)return new Date(iso.getTime());var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||''));if(m)return new Date(+m[1],+m[2]-1,+m[3]);return new Date(iso);}

// ── Tarjetas ──
function matchesFilters(w){
  if(state.sistema!=='todos'&&catOf(w).key!==state.sistema)return false;
  if(state.tipo!=='todos'&&w.tipo!==state.tipo)return false;
  if(state.estado==='activas'){if(esHecha(w.estado))return false;}else if(state.estado!=='todos'&&w.estado!==state.estado)return false;
  if(state.q){var q=norm(state.q),h=norm([w.id,w.idOrden,w.folio,w.plan,TD(w.plan),w.idPlan,w.sistema,catLabel(catOf(w)),w.localizacion,w.tecnico,w.falla].concat((w.equipos||[]).map(function(e){return e.equipo+' '+e.idEquipo;})).join(' '));if(h.indexOf(q)<0)return false;}
  return true;
}
function cardHTML(w){

    if(w.criticos>0&&!esHecha(w.estado))flags.push('<div class="card-flag">'+I.warn+' '+(w.estado==='pendiente'?T(w.criticos+' por comprar',w.criticos+' to buy'):T(w.criticos+' en compra',w.criticos+' on order'))+'</div>');
    if(w.sinConfirmar24)flags.push('<div class="card-flag">'+I.clock+' '+esc(T('Sin confirmar > '+(CFG.confirmHorasLimite||24)+' h','Unconfirmed > '+(CFG.confirmHorasLimite||24)+' h'))+'</div>');

  return '<div class="card'+(esCorr?' correctivo':'')+'" data-ot="'+esc(w.id)+'" tabindex="0">'+
    '<div class="card-top"><div><div class="card-plan">'+esc(esCorr?w.folio:(w.idOrden?w.idOrden+' · ':'')+w.idPlan)+' · '+esc(catLabel(catOf(w)))+'</div><div class="card-equipo">'+esc(equipoTitulo(w))+'</div>'+
      '<div class="card-tags">'+tipoHTML(w.tipo)+(esCorr?'<span class="prio">'+esc(T('Prioridad ','Priority ')+prioTxt(w.prioridad))+'</span>':(fq?'<span class="cat">'+esc(freqTxt(fq))+'</span>':''))+(esCorr?'':'<span class="cat">'+esc(TD(w.plan))+'</span>')+'</div></div>'+

function reducirADataURL(file,maxChars){
  return new Promise(function(res,rej){var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var lados=[900,720,600,480,380,300],cal=[0.8,0.7,0.6,0.5];URL.revokeObjectURL(url);
      for(var i=0;i<lados.length;i++){var s=Math.min(1,lados[i]/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        for(var k=0;k<cal.length;k++){var d=c.toDataURL('image/jpeg',cal[k]);if(d.length<=maxChars)return res(d);}}
      rej(new Error('grande'));};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('imagen'));}; img.src=url;});
}

function aprobarSug(){

  api('getCMDatos',{}).then(function(r){recargando=false;b.disabled=false;
    if(!r.success){$('conn-dot').classList.remove('live');$('conn-text').textContent=T('Sin conexión con el sistema','No connection with the system');toast(errTxt(r,'No se pudieron actualizar los datos.','Data could not be refreshed.'));return;}
    S=r; UBIC=r.ubicaciones||{}; prepararDatos(); $('conn-dot').classList.add('live'); aplicarTextos(); renderAll();});
}

  {key:'auto',g:'b',es:'Auto (sistema)',en:'Auto (system)',ues:'Sigue el modo claro u oscuro de tu dispositivo.',uen:'Follows your device light or dark mode.',p:{bg:'linear-gradient(135deg,#fcfdfe 50%,#0b0e14 50%)',card:'linear-gradient(135deg,#ffffff 50%,#141924 50%)',border:'#9aa5b5',fg:'#6b7488',muted:'#9aa5b5',accent:'#2f6fed'}},
  {key:'light',g:'b',es:'Claro',en:'Light',ues:'Oficina y turno de día.',uen:'Office and day shift.',p:{bg:'#fcfdfe',card:'#ffffff',border:'#e6e9f0',fg:'#1c2433',muted:'#6b7488',accent:'#2f6fed'}},
  {key:'dark',g:'b',es:'Oscuro',en:'Dark',ues:'Turno nocturno y áreas con poca luz.',uen:'Night shift and low-light areas.',p:{bg:'#0b0e14',card:'#141924',border:'#2a3344',fg:'#e8ecf3',muted:'#9aa5b5',accent:'#5c8df6'}},
  {key:'acero',g:'c',es:'Acero industrial',en:'Industrial steel',ues:'Pantallas de sala de control o TV de monitoreo.',uen:'Control-room screens or monitoring TVs.',p:{bg:'#0d1520',card:'#132031',border:'#263a54',fg:'#e6edf5',muted:'#93a4ba',accent:'#4cc3ff'}},
  {key:'grafito',g:'c',es:'Grafito + naranja seguridad',en:'Graphite + safety orange',ues:'Monitores de taller: oscuro neutro con acento naranja.',uen:'Workshop monitors: neutral dark with orange accent.',p:{bg:'#121212',card:'#1c1c1c',border:'#353535',fg:'#ececec',muted:'#a3a3a3',accent:'#ff8a3d'}},
  {key:'arena',g:'c',es:'Arena (descanso visual)',en:'Sand (eye rest)',ues:'Jornadas largas: tonos cálidos con menos luz azul.',uen:'Long days: warm tones with less blue light.',p:{bg:'#f7f3ea',card:'#fffdf8',border:'#e4dac6',fg:'#2b2418',muted:'#776b57',accent:'#b5651d'}},
  {key:'verde',g:'c',es:'Verde planta',en:'Plant green',ues:'Tablets en piso de planta; verde de condición segura.',uen:'Shop-floor tablets; safe-condition green.',p:{bg:'#f8fbf9',card:'#ffffff',border:'#dbe7df',fg:'#17261d',muted:'#5f7266',accent:'#1f8a4c'}},
  {key:'contraste',g:'c',es:'Alto contraste',en:'High contrast',ues:'Piso de planta con reflejos o luz solar; lectura más fácil.',uen:'Shop floor with glare or sunlight; easier reading.',p:{bg:'#ffffff',card:'#ffffff',border:'#3a3a3a',fg:'#000000',muted:'#2e2e2e',accent:'#0040c1'}}];
var TBK={};THEMES.forEach(function(t){TBK[t.key]=t;});
var THEME_KEY='ktmex-cmms-tema', curTheme='light';
try{curTheme=localStorage.getItem(THEME_KEY)||'light';}catch(e){} if(!TBK[curTheme])curTheme='light';
function tName(t){return LANG==='en'?t.en:t.es;}
function tPrev(t){var p=t.p;return '<span class="tp" style="background:'+p.bg+';border-color:'+p.border+'"><span class="tp-card" style="background:'+p.card+';border-color:'+p.border+'"><span class="tp-line" style="background:'+p.fg+'"></span><span class="tp-line short" style="background:'+p.muted+'"></span></span><span class="tp-btn" style="background:'+p.accent+'"></span></span>';}
function applyTheme(k){curTheme=TBK[k]?k:'light';if(curTheme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',curTheme);try{localStorage.setItem(THEME_KEY,curTheme);}catch(e){}updateThemeButton();if(!$('theme-menu').hidden)renderThemeMenu();}
function updateThemeButton(){var t=TBK[curTheme];$('theme-btn-prev').innerHTML=tPrev(t);$('theme-btn-name').textContent=tName(t);}
function recTheme(){var h=new Date().getHours(),tec=esVistaTec(state.view);
  if(tec)return h>=7&&h<19?{k:'contraste',m:T('En piso de planta (tablet o celular), con reflejos el alto contraste se lee mejor.','On the shop floor (tablet or phone), high contrast reads better with glare.')}:{k:'dark',m:T('Turno nocturno: menos brillo y fatiga visual.','Night shift: less glare and eye strain.')};
  if(h>=7&&h<18)return {k:'light',m:T('Turno de día en oficina: máxima legibilidad.','Day shift in the office: best legibility.')};
  if(h>=18&&h<22)return {k:'arena',m:T('Final de jornada: tonos cálidos que cansan menos.','End of the day: warm tones that tire less.')};
  return {k:'dark',m:T('Turno nocturno: menos brillo de pantalla.','Night shift: less screen glare.')};}
function themeItem(t,rk){return '<button type="button" class="theme-item'+(t.key===curTheme?' active':'')+'" role="menuitemradio" aria-checked="'+(t.key===curTheme)+'" data-theme-key="'+t.key+'">'+tPrev(t)+'<span class="theme-item-text"><span class="theme-item-name">'+esc(tName(t))+(t.key===rk?'<span class="theme-badge">'+esc(T('Recomendado','Recommended'))+'</span>':'')+'</span><span class="theme-item-why">'+esc(LANG==='en'?t.uen:t.ues)+'</span></span><span class="theme-check">'+I.check+'</span></button>';}
function renderThemeMenu(){var r=recTheme(),rt=TBK[r.k],uso=r.k===curTheme;
  var h='<div class="theme-rec">'+tPrev(rt)+'<div class="theme-rec-text"><div class="theme-rec-k">'+esc(T('Recomendado ahora','Recommended now'))+' · '+esc(new Date().toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'}))+'</div><div class="theme-rec-name">'+esc(tName(rt))+'</div><div class="theme-rec-why">'+esc(r.m)+'</div></div>'+(uso?'<button type="button" class="btn btn-ghost btn-sm" disabled>'+esc(T('En uso','In use'))+'</button>':'<button type="button" class="btn btn-primary btn-sm" data-theme-key="'+r.k+'">'+esc(T('Aplicar','Apply'))+'</button>')+'</div>';
  h+='<div class="theme-sec">'+esc(T('Básicos','Basic'))+'</div>'+THEMES.filter(function(t){return t.g==='b';}).map(function(t){return themeItem(t,r.k);}).join('');
  h+='<div class="theme-sec">'+esc(T('Combinaciones por área de uso','Combinations by area of use'))+'</div>'+THEMES.filter(function(t){return t.g==='c';}).map(function(t){return themeItem(t,r.k);}).join('');
  $('theme-menu').innerHTML=h;}
function posThemeMenu(){var m=$('theme-menu'),r=$('theme-btn').getBoundingClientRect(),w=Math.min(340,innerWidth-32),l=Math.max(16,Math.min(r.right-w,innerWidth-w-16)),t=r.bottom+8;m.style.width=w+'px';m.style.left=l+'px';m.style.top=t+'px';m.style.maxHeight=Math.max(200,innerHeight-t-16)+'px';}
function setThemeMenu(o){var m=$('theme-menu');if(o){renderThemeMenu();m.hidden=false;posThemeMenu();}else m.hidden=true;$('theme-btn').setAttribute('aria-expanded',o?'true':'false');}

// ── Eventos ──
$('bandeja-btn').addEventListener('click',function(e){e.stopPropagation();setThemeMenu(false);var m=$('bandeja-menu');m.hidden=!m.hidden;$('bandeja-btn').setAttribute('aria-expanded',m.hidden?'false':'true');});
$('bandeja-menu').addEventListener('click',function(e){var b=e.target.closest('.bandeja-item');if(!b)return;$('bandeja-menu').hidden=true;switchView(b.getAttribute('data-view'));});

$('theme-menu').addEventListener('click',function(e){e.stopPropagation();var b=e.target.closest('[data-theme-key]');if(!b)return;applyTheme(b.getAttribute('data-theme-key'));toast(T('Tema: ','Theme: ')+tName(TBK[curTheme])+'.');});
window.addEventListener('resize',function(){if(!$('theme-menu').hidden)posThemeMenu();});
$('search').addEventListener('input',function(e){state.q=e.target.value;state.limit=60;renderOrdenes();});
['filter-sistema','filter-tipo','filter-estado'].forEach(function(id){$(id).addEventListener('change',function(e){var k={'filter-sistema':'sistema','filter-tipo':'tipo','filter-estado':'estado'}[id];state[k]=e.target.value;state.limit=60;renderOrdenes();});});
$('open-dash-btn').addEventListener('click',function(){switchView('dashboard');});
$('sug-btn').addEventListener('click',abrirSugerencias);
$('refresh-btn').addEventListener('click',function(){recargar();});

$('scrim').addEventListener('click',closePanel);
$('dash-cat').addEventListener('change',function(e){state.dash.cat=e.target.value;state.dash.logLimit=40;renderDashboard();});
$('dash-tec').addEventListener('change',function(e){state.dash.tec=e.target.value;state.dash.logLimit=40;renderDashboard();});
document.addEventListener('change',function(e){var t=e.target;
  if(t.id==='log-tipo'){state.dash.logTipo=t.value;state.dash.logLimit=40;renderDashboard();return;}
  if(t.id==='sug-confirmo'){SUG.confirmo=t.checked;return;}
  if(t.hasAttribute('data-sug-sel')){SUG.lista[+t.getAttribute('data-sug-sel')].sel=t.checked;pintarSug();return;}
  if(t.hasAttribute('data-sug-tec')){SUG.lista[+t.getAttribute('data-sug-tec')].tec=t.value;return;}
  if(t.hasAttribute('data-sug-fecha')){SUG.lista[+t.getAttribute('data-sug-fecha')].fEnv=t.value;return;}
});
document.addEventListener('click',function(e){
  var t=e.target, x;
  if(!$('bandeja-menu').hidden&&!$('bandeja-switch').contains(t))$('bandeja-menu').hidden=true;
  if(!$('theme-menu').hidden&&!$('theme-switch').contains(t))setThemeMenu(false);
  if((x=t.closest('[data-close-panel]'))){closePanel();return;}
  if((x=t.closest('[data-volver]'))){openPanel(state.volverA);return;}
  if((x=t.closest('[data-open-loc]'))){openLoc(x.getAttribute('data-open-loc'));return;}
  if((x=t.closest('[data-loc-close]'))){closeLoc();return;}
  if((x=t.closest('[data-subir-foto]'))){pedirFoto(x.getAttribute('data-subir-foto'));return;}
  if((x=t.closest('[data-reportar]'))){abrirFalla(x.getAttribute('data-reportar'));return;}
  if((x=t.closest('[data-lbx]'))){openLightbox(x.getAttribute('data-lbx'));return;}
  if((x=t.closest('[data-hoja]'))){openEquipo(x.getAttribute('data-hoja'),state.panelMode==='orden'?state.openId:state.volverA);return;}
  if((x=t.closest('[data-ficha]'))){openEquipo(x.getAttribute('data-ficha'),state.panelMode==='orden'?state.openId:null);return;}
  if((x=t.closest('[data-ot-link]'))){openPanel(x.getAttribute('data-ot-link'));return;}
  if((x=t.closest('[data-asignar]'))){asignar(x.getAttribute('data-asignar'));return;}
  if((x=t.closest('[data-liberar]'))){liberar(x.getAttribute('data-liberar'));return;}
  if((x=t.closest('[data-confirmar]'))){confirmarOrden(x.getAttribute('data-confirmar'));return;}
  if((x=t.closest('[data-conf-mat]'))){confirmarMaterial(x.getAttribute('data-conf-mat'));return;}
  if((x=t.closest('[data-plan-diario]'))){api('irPlanDiario',{});return;}
  if((x=t.closest('[data-ir-compras]'))){api('irCompras',{});return;}
  if((x=t.closest('[data-sug-aprobar]'))){aprobarSug();return;}
  if((x=t.closest('[data-more]'))){state.limit+=60;renderOrdenes();return;}
  if((x=t.closest('[data-dash-tipo]'))){state.dash.tipo=x.getAttribute('data-dash-tipo');state.dash.logLimit=40;renderDashboard();return;}
  if((x=t.closest('[data-dash-set-tipo]'))){state.dash.tipo=x.getAttribute('data-dash-set-tipo');state.dash.logLimit=40;renderDashboard();return;}
  if((x=t.closest('[data-dash-cat]'))){state.dash.cat=x.getAttribute('data-dash-cat');state.dash.logLimit=40;renderDashboard();return;}
  if((x=t.closest('[data-log-more]'))){state.dash.logLimit+=60;renderDashboard();return;}
  if((x=t.closest('.card[data-ot]'))){openPanel(x.getAttribute('data-ot'));return;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('card')){openPanel(e.target.getAttribute('data-ot'));return;}
  if(e.key!=='Escape')return; setThemeMenu(false);
  if(cdlgResolve){closeConfirm(false);return;} if($('lbx').classList.contains('show')){$('lbx').classList.remove('show');return;}

});
