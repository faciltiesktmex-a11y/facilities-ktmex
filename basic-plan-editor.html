<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basic Plan · Editor</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--blue2:#1d4ed8;--bg:#e6ebf3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;user-select:none}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
select,input{font:inherit}
/* top bars */
.top{height:50px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none}
.top .brand{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px;margin-right:6px}
.top .brand i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;color:#fff;font-style:normal}
.sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.tb{height:32px;min-width:32px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#334155;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tb:hover:not(:disabled){background:#f1f5fb}
.tb.on{background:#e8f0ff;border-color:#9db9f5;color:var(--blue2)}
.tb.primary{background:var(--blue);border-color:var(--blue);color:#fff}.tb.primary:hover:not(:disabled){background:var(--blue2)}
.spacer{flex:1}
.tb[hidden]{display:none}
.fmt{height:42px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px;flex:none;overflow-x:auto;white-space:nowrap}
.fmt select{height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 6px}
.fmt input[type=number]{width:56px;height:30px;border:1px solid var(--line);border-radius:7px;padding:0 6px}
.fmt .tb{height:30px;min-width:30px;padding:0 8px}
.fmt label.cl{position:relative;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-weight:700}
.fmt label.cl input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.fmt label.cl b{display:block;width:16px;height:4px;border-radius:2px;background:currentColor}
.fmt .hint{color:var(--muted);font-size:12px;margin-left:auto}
/* layout */
.main{flex:1;display:flex;min-height:0}
.left{width:68px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;overflow-y:auto;flex:none}
.ins{width:58px;padding:6px 2px;border:0;background:transparent;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#475569;font-size:10.5px;font-weight:600}
.ins:hover,.ins.on{background:#eaf1ff;color:var(--blue2)}
.ins svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.work{flex:1;overflow:auto;position:relative;padding:28px}
#wrap{position:relative;margin:0 auto}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#page{position:absolute;left:0;top:0;z-index:0;background:#fff;box-shadow:0 4px 30px rgba(15,23,42,.25);overflow:hidden}
#grid{position:absolute;left:0;top:0;z-index:1;pointer-events:none;display:none;background-image:linear-gradient(#0000000f 1px,transparent 1px),linear-gradient(90deg,#0000000f 1px,transparent 1px);background-size:20px 20px}
#ovl{position:absolute;left:0;top:0;width:0;height:0;z-index:2;--z:1}
.right{width:300px;background:#fff;border-left:1px solid var(--line);overflow-y:auto;flex:none;padding:10px 12px 40px;user-select:none}
/* objects */
.o{position:absolute;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
#page{font-family:Arial,Helvetica,sans-serif;color:#111827;line-height:1.3}
.o.t-text{overflow:visible}
.vt{display:flex;width:100%;height:100%}
.rt{width:100%;outline:none;word-wrap:break-word;white-space:pre-wrap;min-height:1em}
.rt ul,.rt ol{margin:0;padding-left:1.3em}
.sbox{position:absolute;inset:0}
.sbar{position:absolute;left:12px;top:10px;max-width:calc(100% - 24px);padding:4px 40px 4px 12px;display:flex;gap:.4em;align-items:center;line-height:1.2}
.sbar .jp{font-family:Meiryo,"Yu Gothic","MS Gothic",sans-serif}
.st{outline:none}
.ph-img{position:absolute;inset:0;border:2px dashed #b6c2d6;border-radius:8px;background:#f7f9fd;color:#8a97ad;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:13px;gap:4px;padding:6px}
.ph-img b{font-size:26px;font-weight:400}
.o.dropping{outline:3px solid var(--blue)}
td[contenteditable=true]{outline:2px solid var(--blue);outline-offset:-2px}
/* selection overlay */
.sb{position:absolute;border:calc(1.5px/var(--z)) solid var(--blue);pointer-events:none}
.sb.lk{border-style:dashed;border-color:#94a3b8}
.sb.u{border-style:dashed}
.hd{position:absolute;width:calc(10px/var(--z));height:calc(10px/var(--z));background:#fff;border:calc(1.5px/var(--z)) solid var(--blue);border-radius:2px;pointer-events:auto;margin:calc(-5px/var(--z)) 0 0 calc(-5px/var(--z))}
.hd[data-h=nw]{left:0;top:0;cursor:nwse-resize}.hd[data-h=n]{left:50%;top:0;cursor:ns-resize}.hd[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
.hd[data-h=e]{left:100%;top:50%;cursor:ew-resize}.hd[data-h=se]{left:100%;top:100%;cursor:nwse-resize}.hd[data-h=s]{left:50%;top:100%;cursor:ns-resize}
.hd[data-h=sw]{left:0;top:100%;cursor:nesw-resize}.hd[data-h=w]{left:0;top:50%;cursor:ew-resize}
.hd[data-h=rot]{left:50%;top:calc(-28px/var(--z));border-radius:50%;cursor:grab;background:var(--blue)}
.mq{position:absolute;border:calc(1px/var(--z)) solid var(--blue);background:rgba(37,99,235,.1);pointer-events:none}
/* props */
.ph{font-weight:800;font-size:14px;margin:2px 0 8px}
.pg{border-top:1px solid var(--line);padding:10px 0 6px}
.pg h5{margin:0 0 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pf{display:flex;align-items:center;gap:8px;margin:0 0 7px;font-size:12.5px}
.pf>span{flex:0 0 96px;color:#475569}
.pf input[type=number],.pf input[type=text],.pf select{flex:1;min-width:0;height:28px;border:1px solid #d5dce9;border-radius:7px;padding:0 7px;background:#fff}
.pf input[type=color]{width:40px;height:28px;border:1px solid #d5dce9;border-radius:7px;padding:2px;background:#fff;cursor:pointer}
.pf input[type=range]{flex:1}
.pf.none input[type=color]{opacity:.35}
.mini{height:28px;min-width:28px;border:1px solid #d5dce9;background:#fff;border-radius:7px;color:#64748b}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 8px}
.pf input[type=number]{width:100%}
.g2 .pf{margin:0}.g2 .pf>span{flex:0 0 18px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns .tb{height:28px;font-size:12px;padding:0 8px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.15);cursor:pointer}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.themes button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 8px;text-align:left;font-weight:600;font-size:12px;display:flex;gap:6px;align-items:center}
.themes button i{width:14px;height:14px;border-radius:4px;display:inline-block}
.muted{color:var(--muted)}
.tip2{font-size:11.5px;color:var(--muted);margin:6px 0 0}
/* flyout */
#fly{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.25);padding:10px;max-width:360px;max-height:70vh;overflow:auto;display:none}
#fly h6{margin:2px 2px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fgrid button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:9px;display:grid;place-items:center;padding:6px;color:#334155}
.fgrid button:hover{background:#eaf1ff;border-color:#9db9f5;color:var(--blue2)}
.fgrid button svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.flist button{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:8px;padding:8px 10px;font-weight:600;color:#334155}
.flist button:hover{background:#eaf1ff}
.flist small{display:block;font-weight:400;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.ov[hidden]{display:none}
.mdl{background:#fff;border-radius:16px;padding:18px;max-width:880px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);user-select:text}
.mdl h3{margin:0 0 10px;font-size:17px}
.mdl table{border-collapse:collapse;width:100%}
.mdl th{font-size:11.5px;text-align:left;color:var(--muted);padding:4px}
.mdl td{padding:3px}
.mdl td input[type=text],.mdl td input[type=number],.mdl td input[type=date]{width:100%;height:30px;border:1px solid #d5dce9;border-radius:7px;padding:0 6px}
.mdl td input[type=color]{width:34px;height:28px;border:1px solid #d5dce9;border-radius:6px;padding:1px}
.mdl .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;align-items:center}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:10px 0}
.tpl button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.tpl button:hover{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.tpl .pv{height:90px;border-radius:8px;background:#f1f5fb;border:1px solid var(--line);position:relative;overflow:hidden}
.tpl .pv i{position:absolute;border:1.5px solid #c0392b;border-radius:2px;background:#fff}
.tpl .pv i::before{content:"";position:absolute;left:3px;top:3px;width:40%;height:4px;background:#8dc3f8}
.tpl b{font-size:13.5px}.tpl small{color:var(--muted);font-size:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:#0f172a;color:#fff;padding:9px 15px;border-radius:11px;opacity:0;transition:.2s;z-index:120;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media print{
  @page{size:A3 landscape;margin:0}
  body{background:#fff;display:block;overflow:visible}
  .top,.fmt,.left,.right,#fly,#ovl,#grid,.ov,#toast,.noexp{display:none!important}
  .main,.work{display:block;padding:0;overflow:visible}
  #wrap{width:auto!important;height:auto!important;margin:0}
  #stage{position:static;transform:none!important}
  #page{position:static;box-shadow:none;zoom:.9446}
}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><i>▦</i>Basic Plan</div>
  <button class="tb" id="bTpl" title="Cambiar de plantilla">Plantillas ▾</button>
  <div class="sep"></div>
  <button class="tb" id="bUndo" title="Deshacer (Ctrl+Z)">↶</button>
  <button class="tb" id="bRedo" title="Rehacer (Ctrl+Y)">↷</button>
  <div class="sep"></div>
  <button class="tb" id="bZm" title="Alejar">−</button><b id="zLbl" style="min-width:44px;text-align:center">100%</b><button class="tb" id="bZp" title="Acercar">+</button><button class="tb" id="bFit">Ajustar</button>
  <div class="sep"></div>
  <button class="tb" id="bGrid" title="Mostrar cuadrícula">▦ Cuadrícula</button>
  <button class="tb on" id="bSnap" title="Ajustar a cuadrícula al mover">⌗ Imán</button>
  <div class="spacer"></div>
  <button class="tb" id="bExp">Exportar ▾</button>
  <button class="tb" id="bClose" hidden>Cancelar</button>
  <button class="tb primary" id="bAttach" hidden>✓ Guardar y adjuntar a la solicitud</button>
</div>
<div class="fmt" id="fmt">
  <select id="fFont" title="Fuente"></select>
  <input type="number" id="fSize" min="6" max="200" value="16" title="Tamaño">
  <button class="tb" data-f="bold" title="Negrita (Ctrl+B)"><b>B</b></button>
  <button class="tb" data-f="italic" title="Cursiva (Ctrl+I)"><i>I</i></button>
  <button class="tb" data-f="underline" title="Subrayado (Ctrl+U)"><u>U</u></button>
  <button class="tb" data-f="strikeThrough" title="Tachado"><s>S</s></button>
  <label class="cl" title="Color de texto" style="color:#111827">A<b></b><input type="color" id="fColor" value="#111827"></label>
  <label class="cl" title="Resaltar texto" style="color:#facc15">▮<b></b><input type="color" id="fHi" value="#facc15"></label>
  <div class="sep"></div>
  <button class="tb" data-f="justifyLeft" title="Izquierda">⯇</button><button class="tb" data-f="justifyCenter" title="Centro">≡</button><button class="tb" data-f="justifyRight" title="Derecha">⯈</button>
  <button class="tb" data-f="insertUnorderedList" title="Viñetas">• ≡</button><button class="tb" data-f="insertOrderedList" title="Numeración">1.≡</button>
  <button class="tb" data-f="removeFormat" title="Quitar formato">Tx</button>
  <span class="hint" id="fHint">Selecciona un texto o una forma · doble clic para editar</span>
</div>
<div class="main">
  <div class="left" id="left"></div>
  <div class="work" id="work"><div id="wrap"><div id="stage"><div id="page"></div><div id="grid"></div><div id="ovl"></div></div></div></div>
  <div class="right" id="props"></div>
</div>
<div id="fly"></div>
<div id="mdl" class="ov" hidden></div>
<div id="toast"></div>
<input type="file" id="fileImg" accept="image/*" hidden multiple>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

   UTILIDADES
   ==================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SHAPES=[['rect','Rectángulo'],['round','Redondeado'],['ellipse','Elipse'],['diamond','Rombo'],['triangle','Triángulo'],['hexagon','Hexágono'],['star','Estrella'],['rarrow','Flecha'],['pentagon','Pentágono'],['chevron','Chevron'],['callout','Globo'],['cross','Cruz'],['line','Línea'],['arrowline','Línea con flecha'],['darrow','Doble flecha']];
const IMGS={},IMGREV=new Map();let imgN=0;
function regImg(src){if(!src||!src.startsWith('data:'))return src;if(IMGREV.has(src))return IMGREV.get(src);const k='img_'+(++imgN);IMGS[k]=src;IMGREV.set(src,k);return k}
const imgURL=s=>s&&s.startsWith('data:')?s:(IMGS[s]||'');
const isLine=s=>s==='line'||s==='arrowline'||s==='darrow';
function shapeSVG(o){
  const w=o.w,h=o.h,sw=o.sw||0,i=sw/2,gid='g'+o.id;
  const line=isLine(o.shape);
  const fill=line?'none':(o.fill2?'url(#'+gid+')':(o.fill||'none'));
  const defs=(!line&&o.fill2)?'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+(o.fill||'#fff')+'"/><stop offset="1" stop-color="'+o.fill2+'"/></linearGradient></defs>':'';
  const st='fill="'+fill+'" stroke="'+(o.stroke||'none')+'" stroke-width="'+sw+'" stroke-linejoin="round" '+(o.dash?'stroke-dasharray="'+o.dash+'"':'');
  const P=pts=>'<polygon points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" '+st+'/>';
  let g='';
  switch(o.shape){
    case'rect':g='<rect x="'+i+'" y="'+i+'" width="'+Math.max(0,w-sw)+'" height="'+Math.max(0,h-sw)+'" '+st+'/>';break;
    case'round':g='<rect x="'+i+'" y="'+i+'" width="'+Math.max(0,w-sw)+'" height="'+Math.max(0,h-sw)+'" rx="'+Math.min(o.radius,w/2,h/2)+'" '+st+'/>';break;
    case'ellipse':g='<ellipse cx="'+w/2+'" cy="'+h/2+'" rx="'+Math.max(0,w/2-i)+'" ry="'+Math.max(0,h/2-i)+'" '+st+'/>';break;
    case'diamond':g=P([[w/2,i],[w-i,h/2],[w/2,h-i],[i,h/2]]);break;
    case'triangle':g=P([[w/2,i],[w-i,h-i],[i,h-i]]);break;
    case'hexagon':g=P([[w*.25,i],[w*.75,i],[w-i,h/2],[w*.75,h-i],[w*.25,h-i],[i,h/2]]);break;
    case'star':{const pts=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,r=k%2?.42:1;pts.push([w/2+Math.cos(a)*w/2*r,h/2+Math.sin(a)*h/2*r])}g=P(pts);break}
    case'rarrow':g=P([[i,h*.25],[w*.6,h*.25],[w*.6,i],[w-i,h/2],[w*.6,h-i],[w*.6,h*.75],[i,h*.75]]);break;
    case'pentagon':g=P([[i,i],[w*.82,i],[w-i,h/2],[w*.82,h-i],[i,h-i]]);break;
    case'chevron':g=P([[i,i],[w*.75,i],[w-i,h/2],[w*.75,h-i],[i,h-i],[w*.25,h/2]]);break;
    case'callout':g=P([[i,i],[w-i,i],[w-i,h*.75],[w*.4,h*.75],[w*.2,h-i],[w*.25,h*.75],[i,h*.75]]);break;
    case'cross':g=P([[w*.35,i],[w*.65,i],[w*.65,h*.35],[w-i,h*.35],[w-i,h*.65],[w*.65,h*.65],[w*.65,h-i],[w*.35,h-i],[w*.35,h*.65],[i,h*.65],[i,h*.35],[w*.35,h*.35]]);break;
    case'line':case'arrowline':case'darrow':{
      const c=o.stroke||'#111827',hs=Math.max(10,sw*3.2),y=h/2;
      const x1=o.shape==='darrow'?hs-1:0,x2=o.shape==='line'?w:w-hs+1;
      g='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+c+'" stroke-width="'+sw+'" '+(o.dash?'stroke-dasharray="'+o.dash+'"':'')+' stroke-linecap="butt"/>';
      if(o.shape!=='line')g+='<polygon points="'+w+','+y+' '+(w-hs)+','+(y-hs/2)+' '+(w-hs)+','+(y+hs/2)+'" fill="'+c+'"/>';
      if(o.shape==='darrow')g+='<polygon points="0,'+y+' '+hs+','+(y-hs/2)+' '+hs+','+(y+hs/2)+'" fill="'+c+'"/>';
      break}
  }
  return'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="position:absolute;left:0;top:0;overflow:visible">'+defs+g+'</svg>';
}
const VA={top:'flex-start',middle:'center',bottom:'flex-end'};
const tstyle=o=>'font-family:'+o.font+';font-size:'+o.size+'px;color:'+o.color+';font-weight:'+(o.bold?700:400)+';font-style:'+(o.italic?'italic':'normal')+';text-align:'+o.align+';line-height:'+o.lh+';letter-spacing:'+(o.ls||0)+'px';

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function chartSVG(o){
  const W=o.w,H=o.h,fs=o.size,ink=o.color,L=o.labels,S=o.series;
  const col=i=>S[i].color||PAL[i%PAL.length];
  const sl=i=>o.sliceColors[i]||PAL[i%PAL.length];
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Arial" font-size="'+fs+'" style="display:block"><rect width="'+W+'" height="'+H+'" fill="'+(o.bg||'none')+'"/>';
  const tH=o.title?fs*2+6:8;
  if(o.title)s+='<text x="'+W/2+'" y="'+(fs+8)+'" text-anchor="middle" font-weight="700" font-size="'+(fs+3)+'" fill="'+ink+'">'+esc(o.title)+'</text>';
  const pie=o.kind==='pie'||o.kind==='donut';
  const legItems=pie?L.map((l,i)=>[l,sl(i)]):S.map((x,i)=>[x.name,col(i)]);
  const showLeg=o.legend&&(pie||S.length>1||true);
  const legH=showLeg?fs*2:4;
  if(showLeg){let lx=10;const ly=H-fs-2;const items=legItems;
    const widths=items.map(it=>it[0].length*fs*.58+fs*2);const total=widths.reduce((a,b)=>a+b,0);lx=Math.max(8,(W-total)/2);
    items.forEach((it,i)=>{s+='<rect x="'+lx+'" y="'+(ly-fs+2)+'" width="'+fs*.9+'" height="'+fs*.9+'" rx="2" fill="'+it[1]+'"/><text x="'+(lx+fs*1.2)+'" y="'+(ly+1)+'" fill="'+ink+'">'+esc(it[0])+'</text>';lx+=widths[i]})}
  const top=tH,bot=H-legH-4;
  if(pie){
    const vals=(S[0]?S[0].vals:[]).map(v=>Math.max(0,+v||0)),tot=vals.reduce((a,b)=>a+b,0);
    const cx=W/2,cy=(top+bot)/2,r=Math.max(10,Math.min(W/2-14,(bot-top)/2-4)),ri=o.kind==='donut'?r*.55:0;
    if(!tot)s+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" fill="'+ink+'">Sin datos</text>';
    else{let a=-Math.PI/2;vals.forEach((v,i)=>{if(!v)return;const da=v/tot*Math.PI*2,a2=a+da,lg=da>Math.PI?1:0;
      const p=(rr,an)=>[cx+Math.cos(an)*rr,cy+Math.sin(an)*rr];
      let d;if(da>=Math.PI*2-1e-6){d='M'+(cx-r)+','+cy+'a'+r+','+r+' 0 1,0 '+2*r+',0a'+r+','+r+' 0 1,0 '+(-2*r)+',0'+(ri?'M'+(cx-ri)+','+cy+'a'+ri+','+ri+' 0 1,1 '+2*ri+',0a'+ri+','+ri+' 0 1,1 '+(-2*ri)+',0':'')}
      else{const p1=p(r,a),p2=p(r,a2);d='M'+p1[0]+','+p1[1]+'A'+r+','+r+' 0 '+lg+',1 '+p2[0]+','+p2[1];
        if(ri){const p3=p(ri,a2),p4=p(ri,a);d+='L'+p3[0]+','+p3[1]+'A'+ri+','+ri+' 0 '+lg+',0 '+p4[0]+','+p4[1]+'Z'}else d+='L'+cx+','+cy+'Z'}
      s+='<path d="'+d+'" fill="'+sl(i)+'" fill-rule="evenodd" stroke="#fff" stroke-width="2"/>';
      if(o.values&&da>.25){const m=a+da/2,pp=p((r+ri)/2,m);s+='<text x="'+pp[0]+'" y="'+(pp[1]+fs/3)+'" text-anchor="middle" font-weight="700" fill="#fff">'+Math.round(v/tot*100)+'%</text>'}
      a=a2})}
    return s+'</svg>';
  }
  const horiz=o.kind==='hbar';
  const stacked=o.kind==='stacked';
  const all=S.map(x=>x.vals.map(v=>+v||0));
  let mx=0;if(stacked){for(let j=0;j<L.length;j++)mx=Math.max(mx,all.reduce((a,x)=>a+Math.max(0,x[j]||0),0))}else mx=Math.max(0,...all.flat());
  const M=niceMax(mx),ticks=5;
  const lblW=horiz?Math.min(W*.3,Math.max(...L.map(l=>l.length))*fs*.55+10):0;
  const pl=horiz?lblW+8:fs*3.2,pr=14,pt=top+4,pb=horiz?bot-6:bot-fs-10;
  const pw=W-pl-pr,ph=pb-pt;
  const n=Math.max(1,L.length);
  for(let t=0;t<=ticks;t++){
    const v=M*t/ticks,txt=(+v.toFixed(2))+'';
    if(horiz){const x=pl+pw*t/ticks;if(o.grid)s+='<line x1="'+x+'" y1="'+pt+'" x2="'+x+'" y2="'+pb+'" stroke="#e5e7eb"/>';s+='<text x="'+x+'" y="'+(pb+fs+2)+'" text-anchor="middle" fill="'+ink+'" opacity=".7">'+txt+'</text>'}
    else{const y=pb-ph*t/ticks;if(o.grid||t===0)s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="'+(t===0?'#9ca3af':'#e5e7eb')+'"/>';s+='<text x="'+(pl-6)+'" y="'+(y+fs/3)+'" text-anchor="end" fill="'+ink+'" opacity=".7">'+txt+'</text>'}
  }
  if(o.kind==='line'||o.kind==='area'){
    const xs=j=>pl+pw*(j+.5)/n;
    S.forEach((x,i)=>{const pts=x.vals.map((v,j)=>[xs(j),pb-ph*(+v||0)/M]);if(!pts.length)return;
      if(o.kind==='area')s+='<polygon points="'+pts[0][0]+','+pb+' '+pts.map(p=>p.join(',')).join(' ')+' '+pts[pts.length-1][0]+','+pb+'" fill="'+col(i)+'" opacity=".2"/>';
      s+='<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+col(i)+'" stroke-width="3" stroke-linejoin="round"/>';
      pts.forEach((p,j)=>{s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#fff" stroke="'+col(i)+'" stroke-width="2.5"/>';if(o.values)s+='<text x="'+p[0]+'" y="'+(p[1]-8)+'" text-anchor="middle" fill="'+ink+'" font-weight="700">'+(+(+x.vals[j]).toFixed(2))+'</text>'})});
    L.forEach((l,j)=>{s+='<text x="'+xs(j)+'" y="'+(pb+fs+4)+'" text-anchor="middle" fill="'+ink+'">'+esc(l)+'</text>'});
  }else{
    const band=(horiz?ph:pw)/n,gap=band*.2,inner=band-gap,k=stacked?1:Math.max(1,S.length),bw=inner/k;
    L.forEach((l,j)=>{
      const b0=(horiz?pt:pl)+band*j+gap/2;
      let acc=0;
      S.forEach((x,i)=>{const v=Math.max(0,+x.vals[j]||0);
        if(horiz){const len=pw*v/M,y=stacked?b0:b0+bw*i,xx=pl+(stacked?pw*acc/M:0);s+='<rect x="'+xx+'" y="'+y+'" width="'+len+'" height="'+(stacked?inner:bw)+'" fill="'+col(i)+'" rx="2"/>';
          if(o.values&&len>fs*1.5)s+='<text x="'+(xx+len-5)+'" y="'+((stacked?b0+inner/2:y+bw/2)+fs/3)+'" text-anchor="end" fill="#fff" font-weight="700">'+(+v.toFixed(2))+'</text>'}
        else{const hh=ph*v/M,x0=stacked?b0:b0+bw*i,y=pb-hh-(stacked?ph*acc/M:0);s+='<rect x="'+x0+'" y="'+y+'" width="'+(stacked?inner:bw)+'" height="'+hh+'" fill="'+col(i)+'" rx="2"/>';
          if(o.values&&(stacked?hh>fs*1.3:true))s+='<text x="'+((stacked?b0+inner/2:x0+bw/2))+'" y="'+(stacked?y+hh/2+fs/3:y-4)+'" text-anchor="middle" fill="'+(stacked?'#fff':ink)+'" font-weight="700">'+(+v.toFixed(2))+'</text>'}
        acc+=v});
      if(horiz)s+='<text x="'+(pl-6)+'" y="'+(b0+inner/2+fs/3)+'" text-anchor="end" fill="'+ink+'">'+esc(l)+'</text>';
      else s+='<text x="'+(b0+inner/2)+'" y="'+(pb+fs+4)+'" text-anchor="middle" fill="'+ink+'">'+esc(l)+'</text>';
    });
  }
  return s+'</svg>';
}
function ganttSVG(o){
  const W=o.w,H=o.h,fs=o.size,ink=o.color,rows=o.rows.filter(r=>r.start&&r.end);
  let s='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" font-family="Arial" font-size="'+fs+'" style="display:block"><rect width="'+W+'" height="'+H+'" fill="'+(o.bg||'none')+'"/>';
  const tH=o.title?fs*2+8:4;
  if(o.title)s+='<text x="'+W/2+'" y="'+(fs+8)+'" text-anchor="middle" font-weight="700" font-size="'+(fs+3)+'" fill="'+ink+'">'+esc(o.title)+'</text>';
  if(!rows.length)return s+'<text x="'+W/2+'" y="'+H/2+'" text-anchor="middle" fill="#94a3b8">Sin tareas con fechas</text></svg>';
  let mn=rows.map(r=>r.start).sort()[0],mx=rows.map(r=>r.end).sort().slice(-1)[0];
  mn=addD(mn,-3);mx=addD(mx,3);
  const total=dayN(mx)-dayN(mn)+1,lw=Math.min(W*.32,220),pw=W-lw-8,hh=fs*2.2,top=tH;
  const rh=Math.min(34,(H-top-hh-4)/rows.length);
  const X=d=>lw+pw*(dayN(d)-dayN(mn))/total;
  s+='<rect x="'+lw+'" y="'+top+'" width="'+pw+'" height="'+hh+'" fill="#eef2f8"/>';
  // meses
  let d=mn.slice(0,8)+'01';if(d<mn)d=addD(d,32).slice(0,8)+'01';
  const ms=[];for(;d<=mx;d=addD(d,32).slice(0,8)+'01')ms.push(d);
  ms.forEach(m=>{const x=X(m);s+='<line x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(top+hh+rh*rows.length)+'" stroke="#d6dde9"/><text x="'+(x+4)+'" y="'+(top+hh*.68)+'" font-weight="700" fill="'+ink+'">'+MES[+m.slice(5,7)-1]+' '+m.slice(2,4)+'</text>'});
  rows.forEach((r,i)=>{
    const y=top+hh+rh*i;
    s+='<line x1="0" y1="'+(y+rh)+'" x2="'+W+'" y2="'+(y+rh)+'" stroke="#e5e9f1"/>';
    const nm=r.name.length>Math.floor(lw/(fs*.55))?r.name.slice(0,Math.floor(lw/(fs*.55))-1)+'…':r.name;
    s+='<text x="6" y="'+(y+rh/2+fs/3)+'" fill="'+ink+'" font-weight="600">'+esc(nm)+'</text>';
    const x1=X(r.start),x2=X(addD(r.end,1)),bh=Math.min(rh*.62,22),by=y+(rh-bh)/2,c=r.color||'#2f80ed';
    s+='<rect x="'+x1+'" y="'+by+'" width="'+Math.max(2,x2-x1)+'" height="'+bh+'" rx="4" fill="'+c+'" opacity=".25" stroke="'+c+'" stroke-opacity=".6"/>';
    const pc=clamp(+r.pct||0,0,100);
    if(pc>0)s+='<rect x="'+x1+'" y="'+by+'" width="'+Math.max(2,(x2-x1)*pc/100)+'" height="'+bh+'" rx="4" fill="'+c+'"/>';
    if(x2-x1>fs*3)s+='<text x="'+(x1+4)+'" y="'+(by+bh/2+fs/3)+'" font-size="'+(fs-1)+'" font-weight="700" fill="'+(pc>0?'#fff':ink)+'">'+pc+'%</text>';
  });
  if(o.today&&TODAY>=mn&&TODAY<=mx){const x=X(TODAY)+pw/total/2;s+='<line x1="'+x+'" y1="'+top+'" x2="'+x+'" y2="'+(top+hh+rh*rows.length)+'" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/><rect x="'+(x-22)+'" y="'+(top-2)+'" width="44" height="'+(fs+5)+'" rx="4" fill="#ef4444"/><text x="'+x+'" y="'+(top+fs*.85)+'" text-anchor="middle" font-size="'+(fs-2)+'" font-weight="700" fill="#fff">HOY</text>'}
  return s+'</svg>';
}
function tableHTML(o){
  let h='<table style="width:100%;height:100%;border-collapse:collapse;table-layout:fixed;font-family:'+o.font+';font-size:'+o.size+'px;color:'+o.color+'">';
  o.cells.forEach((row,r)=>{h+='<tr>';row.forEach((c,ci)=>{
    const head=o.header&&r===0;
    const fill=(o.cf&&o.cf[r+','+ci])||(head?o.hFill:(o.zebra&&r%2===0?'#eef2f7':o.cFill));
    h+='<td data-r="'+r+'" data-c="'+ci+'" style="border:'+o.bw+'px solid '+o.border+';padding:3px 6px;background:'+(fill||'transparent')+';color:'+(head?o.hColor:o.color)+';font-weight:'+(head?700:400)+';text-align:'+(head?'center':o.align)+';vertical-align:'+(head?'middle':'top')+';overflow:hidden;word-wrap:break-word">'+c+'</td>'});h+='</tr>'});
  return h+'</table>';
}
function geomCSS(o){return'left:'+o.x+'px;top:'+o.y+'px;width:'+o.w+'px;height:'+o.h+'px;transform:rotate('+o.rot+'deg);opacity:'+(o.opacity==null?1:o.opacity)+';'}
function paint(el,o){
  el.className='o t-'+o.type+(o.locked?' locked':'');
  let css=geomCSS(o),html='';
  switch(o.type){
    case'section':
      html='<div class="sbox" style="border:'+o.bw+'px solid '+o.border+';background:'+(o.bg||'transparent')+'"></div><div class="sbar" style="background:'+o.barColor+';color:'+o.barText+';font-size:'+o.barSize+'px"><span class="sn">'+(o.num?esc(o.num)+' .':'')+'</span>'+(o.jp?'<span class="jp">'+esc(o.jp)+'</span>':'')+'<span class="st">'+esc(o.title)+'</span></div>';break;
    case'text':
      css+=(o.fill?'background:'+o.fill+';':'')+(o.stroke&&o.sw?'border:'+o.sw+'px solid '+o.stroke+';':'')+'border-radius:'+o.radius+'px;'+(o.shadow?'box-shadow:0 4px 12px rgba(0,0,0,.25);':'');
      html='<div class="vt" style="align-items:'+VA[o.valign]+';padding:'+o.pad+'px"><div class="rt" style="'+tstyle(o)+'">'+o.html+'</div></div>';break;
    case'shape':
      css+=o.shadow?'filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));':'';
      html=shapeSVG(o)+(isLine(o.shape)?'':'<div class="vt" style="position:absolute;inset:0;align-items:'+VA[o.valign]+';padding:6px"><div class="rt" style="'+tstyle(o)+'">'+o.html+'</div></div>');break;
    case'image':{
      const f='brightness('+o.bright+'%) contrast('+o.contrast+'%) grayscale('+o.gray+'%)';
      const tr=(o.flipH||o.flipV)?'transform:scale('+(o.flipH?-1:1)+','+(o.flipV?-1:1)+');':'';
      css+='border-radius:'+o.radius+'px;'+(o.stroke&&o.sw?'border:'+o.sw+'px solid '+o.stroke+';':'');
      html=o.src?'<img draggable="false" src="'+imgURL(o.src)+'" style="width:100%;height:100%;object-fit:'+o.fit+';border-radius:'+o.radius+'px;filter:'+f+';'+tr+'display:block;pointer-events:none">':'<div class="ph-img noexp"><b>🖼</b><span>Arrastra una imagen aquí<br>o haz doble clic para subirla</span></div>';break}
    case'table':html=tableHTML(o);break;
    case'chart':html=chartSVG(o);break;
    case'gantt':html=ganttSVG(o);break;
    case'icon':{
      if(o.bg){const sh=o.bgShape==='square'?'<rect width="24" height="24" rx="5" fill="'+o.bg+'"/>':'<circle cx="12" cy="12" r="12" fill="'+o.bg+'"/>';
        html='<svg viewBox="0 0 24 24" width="100%" height="100%">'+sh+'<g transform="translate(4.8 4.8) scale(.6)" fill="none" stroke="'+o.color+'" stroke-width="'+o.sw+'" stroke-linecap="round" stroke-linejoin="round">'+ICONS[o.name]+'</g></svg>'}
      else html=iconSVG(o.name,'100%',o.color,o.sw);break}
  }
  el.style.cssText=css;el.innerHTML=html;
}
const els=new Map();
function renderObjs(){
  const page=$('#page');
  const live=new Set(doc.objs.map(o=>o.id));
  els.forEach((v,id)=>{if(!live.has(id)){v.el.remove();els.delete(id)}});
  doc.objs.forEach((o,i)=>{
    let v=els.get(o.id);
    if(!v){v={el:document.createElement('div'),sig:''};v.el.dataset.id=o.id;els.set(o.id,v);page.appendChild(v.el)}
    const editing=ui.edit&&ui.edit.id===o.id;
    if(editing){const sig=JSON.stringify([o.x,o.y,o.w,o.h,o.rot]);if(v.gsig!==sig){v.el.style.left=o.x+'px';v.el.style.top=o.y+'px';v.el.style.width=o.w+'px';v.el.style.height=o.h+'px';v.el.style.transform='rotate('+o.rot+'deg)';v.gsig=sig}}
    else{const sig=JSON.stringify(o);if(v.sig!==sig){paint(v.el,o);v.sig=sig}}
    v.el.style.zIndex=i;
  });
  page.style.background=doc.page.bg;
}

function drawSel(){

window.addEventListener('pointermove',e=>{
  const d=ui.drag;if(!d)return;const p=pt(e);
  if(d.mode==='move'){
    let dx=p.x-d.sx,dy=p.y-d.sy;
    if(!d.moved&&Math.hypot(dx,dy)*ui.zoom<3)return;
    d.moved=true;
    if(ui.snap&&d.items.length){const nx=snapV(d.items[0].x+dx);dx=nx-d.items[0].x;const ny=snapV(d.items[0].y+dy);dy=ny-d.items[0].y}
    d.items.forEach(it=>{it.o.x=Math.round(it.x+dx);it.o.y=Math.round(it.y+dy);const v=els.get(it.o.id);if(v){v.el.style.left=it.o.x+'px';v.el.style.top=it.o.y+'px'}});
    drawSel();
  }else if(d.mode==='resize'){
    d.moved=true;const o=d.o,r=d.orot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
    const gx=p.x-d.sx,gy=p.y-d.sy,lx=gx*c+gy*s,ly=-gx*s+gy*c;
    const sx=d.h.includes('e')?1:d.h.includes('w')?-1:0,sy=d.h.includes('s')?1:d.h.includes('n')?-1:0;
    let nw=d.ow+sx*lx,nh=d.oh+sy*ly;
    if((e.shiftKey||o.type==='icon'||o.type==='image')&&sx&&sy){const k=Math.max(nw/d.ow,nh/d.oh);nw=d.ow*k;nh=d.oh*k}
    else if(ui.snap){if(sx)nw=Math.round(nw/10)*10;if(sy)nh=Math.round(nh/10)*10}
    nw=Math.max(10,nw);nh=Math.max(10,nh);
    const dw=nw-d.ow,dh=nh-d.oh,cxl=sx*dw/2,cyl=sy*dh/2;
    const cx=d.ox+d.ow/2+cxl*c-cyl*s,cy=d.oy+d.oh/2+cxl*s+cyl*c;
    o.w=Math.round(nw);o.h=Math.round(nh);o.x=Math.round(cx-o.w/2);o.y=Math.round(cy-o.h/2);
    const v=els.get(o.id);if(v){const el=v.el;el.style.left=o.x+'px';el.style.top=o.y+'px';el.style.width=o.w+'px';el.style.height=o.h+'px'}
    drawSel();renderPropsGeom();
    if(o.type!=='text'&&o.type!=='section'&&o.type!=='table'&&o.type!=='image')renderObjs();
  }else if(d.mode==='rot'){
    d.moved=true;const o=d.o,cx=o.x+o.w/2,cy=o.y+o.h/2;
    let a=Math.atan2(p.y-cy,p.x-cx)*180/Math.PI+90;a=((a%360)+360)%360;if(e.shiftKey||Math.abs(a%15)<3||Math.abs(a%15)>12)a=Math.round(a/15)*15%360;
    o.rot=Math.round(a);const v=els.get(o.id);if(v)v.el.style.transform='rotate('+o.rot+'deg)';drawSel();renderPropsGeom();
  }else if(d.mode==='marquee'){
    d.x1=p.x;d.y1=p.y;
    const x0=Math.min(d.x0,d.x1),x1=Math.max(d.x0,d.x1),y0=Math.min(d.y0,d.y1),y1=Math.max(d.y0,d.y1);
    const hit=doc.objs.filter(o=>o.type!=='section'&&!(o.x>x1||o.x+o.w<x0||o.y>y1||o.y+o.h<y0)).map(o=>o.id);
    ui.sel=new Set(d.add?[...ui.sel,...hit]:hit);drawSel();
  }
});

function dup(off){const sel=selObjs();if(!sel.length)return;const ids=[];
  sel.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id='o'+(++seq)+'_'+Math.random().toString(36).slice(2,5);c.x+=off;c.y+=off;doc.objs.push(c);ids.push(c.id)});

function order(act){
  const sel=selObjs();if(!sel.length)return;const ids=new Set(sel.map(o=>o.id));
  const rest=doc.objs.filter(o=>!ids.has(o.id));
  if(act==='front')doc.objs=rest.concat(sel);
  else if(act==='back')doc.objs=sel.concat(rest);
  else{const a=doc.objs.slice();
    if(act==='fwd'){for(let i=a.length-2;i>=0;i--)if(ids.has(a[i].id)&&!ids.has(a[i+1].id)){[a[i],a[i+1]]=[a[i+1],a[i]]}}
    else{for(let i=1;i<a.length;i++)if(ids.has(a[i].id)&&!ids.has(a[i-1].id)){[a[i],a[i-1]]=[a[i-1],a[i]]}}
    doc.objs=a}
  renderObjs();snap();
}
function align(act){
  const sel=selObjs().filter(o=>!o.locked);if(!sel.length)return;
  let box=sel.length>1?{x0:Math.min(...sel.map(o=>o.x)),y0:Math.min(...sel.map(o=>o.y)),x1:Math.max(...sel.map(o=>o.x+o.w)),y1:Math.max(...sel.map(o=>o.y+o.h))}:{x0:0,y0:0,x1:doc.page.w,y1:doc.page.h};
  if(act==='dh'||act==='dv'){
    if(sel.length<3)return toast('Selecciona al menos 3 objetos');
    const k=act==='dh'?'x':'y',s=act==='dh'?'w':'h',a=sel.slice().sort((p,q)=>p[k]-q[k]);
    const tot=a.reduce((n,o)=>n+o[s],0),gap=((act==='dh'?box.x1-box.x0:box.y1-box.y0)-tot)/(a.length-1);
    let c=act==='dh'?box.x0:box.y0;a.forEach(o=>{o[k]=Math.round(c);c+=o[s]+gap});
  }else sel.forEach(o=>{
    if(act==='l')o.x=box.x0;if(act==='c')o.x=Math.round((box.x0+box.x1)/2-o.w/2);if(act==='r')o.x=box.x1-o.w;
    if(act==='t')o.y=box.y0;if(act==='m')o.y=Math.round((box.y0+box.y1)/2-o.h/2);if(act==='b')o.y=box.y1-o.h});
  renderObjs();drawSel();renderProps();snap();
}

  renderObjs();drawSel();renderProps();snap();
}

/* imágenes */
async function readImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const mx=1800,k=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight));
    let src;
    if(k===1&&file.size<900e3){src=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)})}
    else{const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);src=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.88)}
    return{src,w:img.naturalWidth,h:img.naturalHeight};
  }finally{URL.revokeObjectURL(url)}
}
async function addImages(files,at,targetId){
  files=Array.from(files).filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  let off=0;
  for(const f of files){
    let r;try{r=await readImage(f)}catch(e){toast('No se pudo leer '+f.name);continue}
    const t=targetId&&byId(targetId);
    if(t&&t.type==='image'&&off===0){t.src=regImg(r.src);renderObjs();drawSel();renderProps();snap();off++;continue}
    const k=Math.min(1,420/Math.max(r.w,r.h)),w=Math.round(r.w*k),h=Math.round(r.h*k);
    const o=mk('image',{src:regImg(r.src),w,h,fit:'contain'});
    if(at){o.x=snapV(at.x-w/2+off*20);o.y=snapV(at.y-h/2+off*20)}else placeAtCenter(o);
    addObj(o);off++;
  }
}

  if(e.key==='Escape'){if(ui.edit){endEdit();return}hideFly();select([]);return}
  if(ui.edit||inField)return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();select(doc.objs.filter(o=>o.type!=='section').map(o=>o.id));return}
  if(mod&&e.key.toLowerCase()==='c'){ui.clip=JSON.stringify(selObjs());return}
  if(mod&&e.key.toLowerCase()==='x'){ui.clip=JSON.stringify(selObjs());delSel();return}
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dup(24);return}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel();return}
  if(e.key==='Enter'&&document.activeElement===document.body){const o=selObjs()[0];if(o&&selObjs().length===1)startEdit(o,null,false);e.preventDefault();return}
  const step=e.shiftKey?10:1,mv={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
  if(mv&&ui.sel.size){e.preventDefault();selObjs().filter(o=>!o.locked).forEach(o=>{o.x+=mv[0];o.y+=mv[1]});renderObjs();drawSel();renderPropsGeom();snapSoon()}
});

const props=$('#props');
function applyProp(p,v){

    if(['x','y','w','h','rot'].includes(p)){if(sel.length===1){o[p]=p==='w'||p==='h'?Math.max(10,v):v}return}

  applyProp(p,v);
  if(t.type==='color'||t.type==='range'||t.type==='text')snapSoon();

props.addEventListener('change',e=>{

props.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,o=selObjs()[0];
  switch(a){
    case'none':selObjs().forEach(x=>{if(b.dataset.p in x)x[b.dataset.p]=''});renderObjs();drawSel();snap();renderProps();break;
    case'theme':applyTheme(k);break;
    case'align':align(k);break;
    case'order':order(k);break;
    case'dup':dup(24);break;
    case'del':delSel();break;
    case'lock':selObjs().forEach(x=>x.locked=!x.locked);renderObjs();drawSel();snap();renderProps();break;
    case'imgpick':ui.pickFor=o.id;$('#fileImg').click();break;
    case'flip':o[k]=!o[k];renderObjs();snap();break;
    case'imgreset':o.bright=100;o.contrast=100;o.gray=0;renderObjs();snap();renderProps();break;
    case'chartedit':openChartEditor(o);break;
    case'ganttedit':openGanttEditor(o);break;
    case'iconpick':showFly(b,'icon-change');break;
    case'tbl':tableOp(o,k);break;
    case'cellfill':{const c=ui.cell;if(c&&c.id===o.id){o.cf[c.r+','+c.c]=$('#cellFill').value;renderObjs();snap()}else toast('Haz clic primero en una celda de la tabla')}break;
    case'cellclear':{const c=ui.cell;if(c&&c.id===o.id){delete o.cf[c.r+','+c.c];renderObjs();snap()}}break;
  }
});
function tableOp(o,k){
  const c=(ui.cell&&ui.cell.id===o.id)?ui.cell:{r:o.cells.length-1,c:o.cells[0].length-1};
  const cols=o.cells[0].length;
  if(k==='row-above'||k==='row-below'){o.cells.splice(k==='row-above'?c.r:c.r+1,0,Array(cols).fill(''));o.h+=26}
  else if(k==='row-del'){if(o.cells.length<=1)return toast('La tabla necesita al menos una fila');o.cells.splice(c.r,1);o.h=Math.max(30,o.h-26)}
  else if(k==='col-left'||k==='col-right'){o.cells.forEach(r=>r.splice(k==='col-left'?c.c:c.c+1,0,''));o.w+=60}
  else if(k==='col-del'){if(cols<=1)return toast('La tabla necesita al menos una columna');o.cells.forEach(r=>r.splice(c.c,1));o.w=Math.max(40,o.w-60)}
  o.cf={};ui.cell=null;renderObjs();drawSel();renderProps();snap();
}

    addObj(placeAtCenter(o),{edit:!isLine(s)})}
  else if(ic){const n=ic.dataset.ic;if(ui.flyMode==='icon-change'){selObjs().forEach(o=>{if(o.type==='icon')o.name=n});renderObjs();snap();hideFly()}else{hideFly();addObj(placeAtCenter(mk('icon',{name:n,w:90,h:90})))}}
  else if(ch){const k=ch.dataset.ch;hideFly();const o=mk('chart',{kind:k,w:460,h:300});
    if(k==='pie'||k==='donut'){o.series=[{name:'Datos',color:'',vals:[40,30,20,10]}];o.labels=['Seguridad','Calidad','Producción','Costo'];o.title='Distribución'}
    addObj(placeAtCenter(o))}
  else if(q){const Q=QUICK[+q.dataset.q];hideFly();const objs=Q.make();place(objs)}
  else if(ti){const r=clamp(+$('#tr').value||3,1,30),c=clamp(+$('#tc').value||3,1,12);hideFly();
    const cells=[];for(let i=0;i<r;i++){cells.push(Array(c).fill(i===0?'Encabezado':''))}
    addObj(placeAtCenter(mk('table',{cells,w:Math.min(760,c*150),h:r*34})))}
});
function place(objs){
  endEdit();const x0=Math.min(...objs.map(o=>o.x)),y0=Math.min(...objs.map(o=>o.y)),x1=Math.max(...objs.map(o=>o.x+o.w)),y1=Math.max(...objs.map(o=>o.y+o.h));
  const c=viewCenter(),dx=Math.round(c.x-(x0+x1)/2),dy=Math.round(c.y-(y0+y1)/2);
  objs.forEach(o=>{o.x+=dx;o.y+=dy;doc.objs.push(o)});renderObjs();select(objs.map(o=>o.id));snap();
}
const QUICK=[
 {n:'Semáforo / simbología',d:'Bueno · Advertencia · Malo',make:()=>{const r=[];[['#22a847','Good condition'],['#fbbf24','Warning condition'],['#ef4444','No good condition']].forEach((s,i)=>{r.push(SH('ellipse',0,i*34,26,26,'',{fill:s[0],stroke:'#111827',sw:1}));r.push(T(36,i*34,230,28,s[1],{size:15,pad:2,valign:'middle'}))});return r}},
 {n:'Tabla KPI',d:'Goal KPI / Sub KPI',make:()=>[TB(0,0,520,200,[['Goal KPI','Sub KPI'],['Safety: 0 accidents','Control charts'],['Quality','Checklist'],['Production','Standard operation'],['Cost','Energy control chart']],{size:13,hFill:'#ffffff',hColor:'#111827'})]},
 {n:'Tabla de actividades',d:'Category · Main activities · Strategy',make:()=>[TB(0,0,720,230,[['Category','Main activities','Strategy'],['1. Safety','',''],['2. Quality','',''],['3. Production','',''],['4. Cost','','']],{size:13,hFill:'#ffffff',hColor:'#111827'})]},
 {n:'Tabla plan de acción',d:'Activity · PIC · Due date · Next step',make:()=>[TB(0,0,720,230,[['Activity','PIC','Due date','Next step'],['1)','','',''],['2)','','',''],['3)','','','']],{size:14,hFill:'#3d78c2',hColor:'#ffffff',align:'center'})]},
 {n:'Proceso en pasos (verde)',d:'8 cajas + flecha de avance',make:()=>{const r=[];['Create basic plan','Create Master Schedule','Create Method','Create tools','Create/ standarize system','Evaluate and approve system','Training','System feedback'].forEach((t,i)=>r.push(SH('rect',i*95,0,88,92,t,{fill:'#8cb44e',stroke:'#7aa13f',sw:1,radius:3,size:14,bold:false})));r.push(SH('arrowline',0,110,750,24,'',{stroke:'#2a9bbf',sw:6}));return r}},
 {n:'Etiquetas azules de equipo',d:'Rejilla 3×4 editable',make:()=>{const r=[];for(let i=0;i<12;i++)r.push(SH('rect',(i%3)*135,Math.floor(i/3)*44,125,38,'EQUIPO '+(i+1),{fill:'#2f80d8',fill2:'#4a98ec',stroke:'#1f5fae',sw:1,radius:3,size:11}));return r}},
 {n:'Diagrama KPI',d:'Círculo central + 4 objetivos',make:()=>{const r=[SH('ellipse',130,60,150,150,'KPI',{fill:'#4aa8c7',stroke:'#2d7d99',sw:2,size:30})];[[0,0,'Objetivo 1'],[280,0,'Objetivo 2'],[0,220,'Objetivo 3'],[280,220,'Objetivo 4']].forEach(a=>r.push(SH('rect',a[0],a[1],130,44,a[2],{fill:'#e9e9e9',stroke:'#555',sw:1,radius:3,color:'#111827',size:13,bold:false})));return r}},
 {n:'Fila de 4 iconos',d:'Seguridad · Calidad · Producción · Costo',make:()=>[['shield','#1e3a5f'],['award','#f59e0b'],['gear','#111827'],['dollar','#111827']].map((a,i)=>IC(a[0],i*90,0,72,{color:a[1],sw:1.6}))},
 {n:'Cuadro de objetivos',d:'Texto numerado con borde',make:()=>[T(0,0,420,170,'1. Objetivo uno<br>2. Objetivo dos<br>3. Objetivo tres<br>4. Objetivo cuatro',{size:14,stroke:'#9ca3af',sw:1,lh:1.6})]}
];

/* ====================================================================
   MODALES: datos de gráfico y Gantt, plantillas
   ==================================================================== */
const mdl=$('#mdl');
function openModal(html){mdl.innerHTML='<div class="mdl">'+html+'</div>';mdl.hidden=false}
function closeModal(){mdl.hidden=true;mdl.innerHTML='';mdl.onclick=null;mdl.oninput=null;mdl.onchange=null;snap();renderProps()}
mdl.addEventListener('mousedown',e=>{if(e.target===mdl&&mdl.dataset.close!=='no')closeModal()});
function openChartEditor(o){
  const draw=()=>{
    const pie=o.kind==='pie'||o.kind==='donut';
    const S=pie?o.series.slice(0,1):o.series;
    let h='<h3>Datos del gráfico</h3><p class="muted" style="margin:0 0 8px">Edita etiquetas y valores; los cambios se ven al instante.</p><table><thead><tr><th>Etiqueta</th>'+S.map((s,j)=>'<th><input type="text" data-sn="'+j+'" value="'+esc(s.name)+'" style="width:110px;height:26px;border:1px solid #d5dce9;border-radius:6px;padding:0 5px"> '+(pie?'':'<input type="color" data-sc="'+j+'" value="'+hex(s.color||PAL[j%PAL.length])+'">')+(!pie&&o.series.length>1?' <button class="mini" data-delser="'+j+'" title="Quitar serie">✕</button>':'')+'</th>').join('')+(pie?'<th>Color</th>':'')+'<th></th></tr></thead><tbody>';
    o.labels.forEach((l,i)=>{h+='<tr><td><input type="text" data-lb="'+i+'" value="'+esc(l)+'"></td>'+S.map((s,j)=>'<td><input type="number" step="any" data-v="'+j+','+i+'" value="'+(s.vals[i]==null?'':s.vals[i])+'"></td>').join('')+(pie?'<td><input type="color" data-slc="'+i+'" value="'+hex(o.sliceColors[i]||PAL[i%PAL.length])+'"></td>':'')+'<td><button class="mini" data-delrow="'+i+'">✕</button></td></tr>'});
    h+='</tbody></table><div class="row" style="justify-content:flex-start"><button class="tb" data-addrow>+ Fila</button>'+(pie?'':'<button class="tb" data-addser>+ Serie</button>')+'<span class="spacer"></span><button class="tb primary" data-done>Listo</button></div>';
    mdl.innerHTML='<div class="mdl">'+h+'</div>';
  };
  const upd=()=>{renderObjs();drawSel()};
  openModal('');draw();
  mdl.oninput=e=>{const t=e.target;
    if(t.dataset.lb!=null)o.labels[+t.dataset.lb]=t.value;
    else if(t.dataset.v){const [j,i]=t.dataset.v.split(',').map(Number);o.series[j].vals[i]=t.value===''?0:parseFloat(t.value)}
    else if(t.dataset.sn!=null)o.series[+t.dataset.sn].name=t.value;
    else if(t.dataset.sc!=null)o.series[+t.dataset.sc].color=t.value;
    else if(t.dataset.slc!=null)o.sliceColors[+t.dataset.slc]=t.value;
    upd()};
  mdl.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if('done' in t.dataset){closeModal();return}
    if('addrow' in t.dataset){o.labels.push('Nuevo');o.series.forEach(s=>s.vals.push(0))}
    else if('addser' in t.dataset){o.series.push({name:'Serie '+(o.series.length+1),color:'',vals:o.labels.map(()=>0)})}
    else if(t.dataset.delrow!=null){if(o.labels.length<=1)return;const i=+t.dataset.delrow;o.labels.splice(i,1);o.series.forEach(s=>s.vals.splice(i,1));o.sliceColors.splice(i,1)}
    else if(t.dataset.delser!=null){o.series.splice(+t.dataset.delser,1)}
    draw();upd()};
}
function openGanttEditor(o){
  const draw=()=>{
    let h='<h3>Tareas del cronograma</h3><table><thead><tr><th>Tarea</th><th>Inicio</th><th>Fin</th><th>% avance</th><th>Color</th><th></th></tr></thead><tbody>';
    o.rows.forEach((r,i)=>{h+='<tr><td><input type="text" data-g="name,'+i+'" value="'+esc(r.name)+'"></td><td><input type="date" data-g="start,'+i+'" value="'+r.start+'"></td><td><input type="date" data-g="end,'+i+'" value="'+r.end+'"></td><td style="width:80px"><input type="number" min="0" max="100" data-g="pct,'+i+'" value="'+(r.pct||0)+'"></td><td><input type="color" data-g="color,'+i+'" value="'+hex(r.color)+'"></td><td><button class="mini" data-delrow="'+i+'">✕</button></td></tr>'});
    h+='</tbody></table><div class="row" style="justify-content:flex-start"><button class="tb" data-addrow>+ Tarea</button><span class="spacer"></span><button class="tb primary" data-done>Listo</button></div>';
    mdl.innerHTML='<div class="mdl">'+h+'</div>';
  };
  openModal('');draw();
  mdl.oninput=e=>{const t=e.target;if(!t.dataset.g)return;const [k,i]=t.dataset.g.split(',');o.rows[+i][k]=k==='pct'?clamp(parseFloat(t.value)||0,0,100):t.value;
    if((k==='start'||k==='end')&&o.rows[+i].start>o.rows[+i].end&&t.value){o.rows[+i][k==='start'?'end':'start']=t.value;}
    renderObjs();drawSel()};
  mdl.onchange=e=>{if(e.target.dataset.g&&/start|end/.test(e.target.dataset.g))draw()};
  mdl.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if('done' in t.dataset){closeModal();return}
    if('addrow' in t.dataset){const l=o.rows[o.rows.length-1];const s=l?l.end:TODAY;o.rows.push({name:'Nueva tarea',start:s,end:addD(s,14),color:PAL[o.rows.length%PAL.length],pct:0})}
    else if(t.dataset.delrow!=null){o.rows.splice(+t.dataset.delrow,1)}
    draw();renderObjs();drawSel()};
}
function openTemplates(first){
  const keys=Object.keys(TEMPLATES);
  openModal('<h3>'+(first?'¿Con qué formato quieres empezar?':'Cambiar de plantilla')+'</h3><p class="muted" style="margin:0 0 4px">Son las 3 hojas del formato Basic Plan de Facilities, ya con las 5 secciones. Todo se puede editar.'+(first?'':' <b>Esto reemplaza el contenido actual.</b>')+'</p><div class="tpl">'
    +keys.map(k=>'<button data-tpl="'+k+'"><div class="pv"><i style="left:5%;top:8%;width:42%;height:48%"></i><i style="left:5%;top:60%;width:20%;height:32%"></i><i style="left:27%;top:60%;width:20%;height:32%"></i><i style="left:52%;top:8%;width:43%;height:36%"></i><i style="left:52%;top:48%;width:43%;height:44%"></i></div><b>'+TEMPLATES[k].name+'</b><small>'+TEMPLATES[k].desc+'</small></button>').join('')
    +'</div><div class="row" style="justify-content:space-between"><button class="tb" data-imp>Importar archivo .json…</button>'+(first&&!doc.objs.length?'':'<button class="tb" data-x>Cancelar</button>')+'</div>');
  mdl.dataset.close=first&&!doc.objs.length?'no':'';
  mdl.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tpl){loadTemplate(b.dataset.tpl);mdl.dataset.close='';closeModal()}
    else if('imp' in b.dataset)$('#fileJson').click();else if('x' in b.dataset)closeModal()};
}
function loadTemplate(k){
  endEdit(true);doc.objs=TEMPLATES[k].build(doc.theme);els.forEach(v=>v.el.remove());els.clear();ui.sel.clear();
  renderObjs();drawSel();renderProps();updateFmt();ui.hist=[];ui.hi=-1;snap();fit();
}
$('#bTpl').onclick=()=>openTemplates(false);

/* ====================================================================
   ZOOM / VISTA
   ==================================================================== */
function setZoom(z){
  ui.zoom=clamp(z,.2,3);const s=$('#stage');s.style.transform='scale('+ui.zoom+')';
  const w=$('#wrap');w.style.width=doc.page.w*ui.zoom+'px';w.style.height=doc.page.h*ui.zoom+'px';
  $('#zLbl').textContent=Math.round(ui.zoom*100)+'%';drawSel();
}
function fit(){const w=$('#work');setZoom(Math.min((w.clientWidth-56)/doc.page.w,(w.clientHeight-56)/doc.page.h))}
function initPage(){
  const p=$('#page');p.style.width=doc.page.w+'px';p.style.height=doc.page.h+'px';
  const g=$('#grid');g.style.width=doc.page.w+'px';g.style.height=doc.page.h+'px';
}
$('#bZm').onclick=()=>setZoom(ui.zoom/1.15);$('#bZp').onclick=()=>setZoom(ui.zoom*1.15);$('#bFit').onclick=fit;
$('#work').addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(ui.zoom*(e.deltaY<0?1.08:1/1.08))}},{passive:false});
window.addEventListener('resize',()=>{});
$('#bGrid').onclick=e=>{ui.grid=!ui.grid;$('#grid').style.display=ui.grid?'block':'none';e.currentTarget.classList.toggle('on',ui.grid)};
$('#bSnap').onclick=e=>{ui.snap=!ui.snap;e.currentTarget.classList.toggle('on',ui.snap)};
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;

/* ====================================================================
   EXPORTAR / GUARDAR
   ==================================================================== */
function getData(){endEdit();return full()}
function setData(d){
  endEdit(true);doc.theme=d.theme||'ktmex';doc.page=d.page||doc.page;doc.objs=d.objs||[];normalize(doc.objs);
  seq=Math.max(seq,doc.objs.length+100);els.forEach(v=>v.el.remove());els.clear();ui.sel.clear();
  initPage();renderObjs();drawSel();renderProps();updateFmt();ui.hist=[];ui.hi=-1;snap();fit();
}
async function exportPNG(scale){
  endEdit();select([]);scale=scale||2;
  const page=$('#page'),clone=page.cloneNode(true);
  clone.style.cssText='position:relative;left:0;top:0;transform:none;box-shadow:none;width:'+doc.page.w+'px;height:'+doc.page.h+'px;background:'+doc.page.bg+';overflow:hidden';
  clone.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
  clone.querySelectorAll('.noexp').forEach(n=>n.remove());
  clone.querySelectorAll('[contenteditable]').forEach(n=>n.removeAttribute('contenteditable'));
  const css=$$('style').map(s=>s.textContent).join('\n').replace(/@media print\{[\s\S]*\}\s*$/,'');
  const xml=new XMLSerializer().serializeToString(clone);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+doc.page.w+'" height="'+doc.page.h+'"><foreignObject width="100%" height="100%"><style xmlns="http://www.w3.org/1999/xhtml">'+css.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</style>'+xml+'</foreignObject></svg>';
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('render'));i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  const c=document.createElement('canvas');c.width=doc.page.w*scale;c.height=doc.page.h*scale;
  const x=c.getContext('2d');x.fillStyle=doc.page.bg;x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return c.toDataURL('image/png');
}
function download(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('#bExp').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  fly.innerHTML='<h6>Exportar</h6><div class="flist"><button data-ex="png">Imagen PNG<small>Alta resolución, lista para compartir</small></button><button data-ex="pdf">PDF / Imprimir<small>Tamaño A3 horizontal</small></button><button data-ex="json">Archivo editable (.json)<small>Para seguir editando después</small></button><button data-ex="imp">Abrir archivo .json…</button></div>';
  fly.style.display='block';fly.style.left=Math.min(innerWidth-fly.offsetWidth-8,r.left)+'px';fly.style.top=r.bottom+6+'px';ui.flyMode='export';
};
fly.addEventListener('click',async e=>{
  const b=e.target.closest('[data-ex]');if(!b)return;hideFly();const k=b.dataset.ex;
  if(k==='png'){try{toast('Generando imagen…');download(await exportPNG(2),'basic_plan.png')}catch(err){toast('No se pudo generar el PNG en este navegador. Usa PDF / Imprimir.')}}
  else if(k==='pdf'){endEdit();select([]);setTimeout(()=>window.print(),50)}
  else if(k==='json'){download('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(getData())),'basic_plan.json')}
  else if(k==='imp')$('#fileJson').click();
});
$('#fileJson').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.objs))throw 0;setData(d);mdl.dataset.close='';if(!mdl.hidden)closeModal();toast('Archivo abierto')}catch(err){toast('El archivo no es un Basic Plan válido')}};r.readAsText(f)});

/* modo embebido: se integra con el formulario de solicitud */
if(EMBED){
  $('#bAttach').hidden=false;$('#bClose').hidden=false;
  $('#bAttach').onclick=async()=>{
    try{toast('Preparando Basic Plan…');const png=await exportPNG(1.25);
      parent.postMessage({type:'basicplan:save',data:getData(),png},'*')}
    catch(err){parent.postMessage({type:'basicplan:save',data:getData(),png:''},'*')}};
  $('#bClose').onclick=()=>parent.postMessage({type:'basicplan:cancel'},'*');
  window.addEventListener('message',e=>{const m=e.data||{};if(m.type==='basicplan:load'&&m.data){setData(m.data);if(!mdl.hidden){mdl.dataset.close='';closeModal()}}});
}
window.BasicPlanEditor={getData,setData,exportPNG,loadTemplate};

/* ====================================================================
   ARRANQUE
   ==================================================================== */
initPage();setZoom(.6);
let saved=null;if(!EMBED){try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
if(saved&&Array.isArray(saved.objs)&&saved.objs.length){doc.theme=saved.theme||'ktmex';doc.page=saved.page||doc.page;doc.objs=saved.objs;normalize(doc.objs);seq=doc.objs.length+100;renderObjs();snap()}
else{renderObjs();snap();openTemplates(true)}
renderProps();updateFmt();updUndo();
requestAnimationFrame(fit);
if(EMBED)parent.postMessage({type:'basicplan:ready'},'*');
})();
</script>
