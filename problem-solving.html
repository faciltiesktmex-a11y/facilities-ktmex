<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Problem Solving · KTMEX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ===== Estilos de la aplicación ===== -->
<style id="appCss">
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#14233b; --mut:#5d6b82; --line:#e8ecf3; --line2:#d5dce8;
  --pri:#0b4a9e; --pri-ink:#ffffff; --pri-soft:#f1f6fd; --ok:#1f9d55; --ok-soft:#e3f6ea;
  --bad:#d6332b; --bad-soft:#fdeceb; --warn:#e8892b; --warn-soft:#fff1e0; --field:#fafbfd;
  --shadow:0 1px 2px rgba(16,35,60,.04),0 6px 20px rgba(16,35,60,.05);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-img{display:block;height:36px;width:auto;flex:0 0 auto}
.brand b{display:block;font-size:16px}
.brand small{color:var(--mut);font-size:12px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;min-height:40px;transition:transform .08s,background .15s}
.btn:hover{background:var(--pri-soft)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{filter:brightness(1.08);background:var(--pri)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;min-height:32px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.stepper{position:sticky;top:0;z-index:20;display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:6px 12px 6px 7px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut)}
.pill b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);font-size:12px}
.pill.done b{background:var(--ok);color:#fff}
.pill.on{border-color:var(--pri);color:var(--ink);background:var(--pri-soft)}
.pill.on b{background:var(--pri);color:var(--pri-ink)}
main{max-width:1100px;margin:0 auto;padding:18px 14px 110px}
.stephead{margin:6px 2px 16px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.stephead h1{font-size:26px;margin-top:4px}
.stephead p{margin:6px 0 0;color:var(--mut);max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:4px}
.card h3{font-size:15px}
.hint{color:var(--mut);font-size:13.5px;margin:2px 0 12px}
.f{display:block;margin:12px 0 0}
.f>span{display:block;font-size:12.5px;font-weight:700;color:var(--mut);margin-bottom:5px;letter-spacing:.02em}
.in{width:100%;border:1px solid var(--line2);background:var(--field);border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 22%,transparent)}
textarea.in{resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:10px;align-items:end}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}.grid5{grid-template-columns:1fr 1fr}.stephead h1{font-size:22px}.top{flex-direction:column;align-items:stretch}.top-actions{justify-content:flex-start}}
.gapbar{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);font-weight:700;font-size:13px;margin:-4px 0 12px}
.gapbar i{flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--line2))}
.gapbar i:last-child{background:linear-gradient(270deg,transparent,var(--line2))}
.media .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.thumb{position:relative;margin:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.thumb img{display:block;max-height:130px;max-width:200px}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(20,35,59,.85);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.up{margin-top:10px;cursor:pointer}
.filechip{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;background:var(--field);font-size:13.5px}
.filechip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.filechip small{color:var(--mut)}
/* flow editor */
.flow-ed{display:flex;flex-wrap:wrap;gap:16px 6px;align-items:flex-start;font-size:14px;padding:6px 2px}
.flow-ed .node{width:14em}
.flow-ed .rc-chev-in textarea{background:transparent;border:0;color:inherit;font:inherit;font-weight:700;text-align:center;resize:none;width:100%;outline:none;padding:0}
.flow-ed .rc-chev-in textarea::placeholder{color:rgba(255,255,255,.75)}
.node .seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin:8px .6em 0 .2em}
.node .seg button{flex:1;border:0;background:var(--card);padding:6px 4px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--mut)}
.node .seg button.on.ok{background:var(--ok);color:#fff}
.node .seg button.on.nok{background:var(--bad);color:#fff}
.node .note{margin:6px .6em 0 .2em;width:calc(100% - .8em);font-size:12.5px;min-height:56px;padding:7px 9px}
.node .mv{display:flex;gap:4px;margin:6px .6em 0 .2em}
.node .mv button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px;cursor:pointer;color:var(--mut)}
.node .mv button[disabled]{opacity:.35}
.add-node{align-self:center;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed var(--line2);background:transparent;color:var(--pri);border-radius:14px;padding:14px 18px;cursor:pointer;font-weight:700;font-size:13px;margin-left:8px}
.add-node:hover{background:var(--pri-soft)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
/* ideas */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipi{background:var(--pri-soft);border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
/* matrix */
.mx-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:70vh}
table.mx{border-collapse:separate;border-spacing:0;min-width:100%}
.mx th,.mx td{padding:8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;vertical-align:middle;background:var(--card)}
.mx thead th{position:sticky;top:0;z-index:2;background:var(--pri-soft);font-size:12.5px}
.mx .corner{left:0;z-index:4;text-align:left;min-width:150px}
.mx th.pname{position:sticky;left:0;z-index:1;text-align:left;min-width:150px;background:var(--card)}
.mx th.pname input{width:100%;border:1px solid transparent;background:transparent;font-weight:600;padding:6px;border-radius:8px}
.mx th.pname input:focus{border-color:var(--pri);outline:none;background:var(--field)}
.idea-t{min-width:118px;max-width:150px;white-space:normal;font-weight:600;line-height:1.25}
.vote{appearance:none;-webkit-appearance:none;width:3.4em;height:2.5em;text-align:center;text-align-last:center;border-radius:9px;border:1px solid var(--line2);background:var(--field);font-weight:800;cursor:pointer}
.vote.v1{background:#eaf0f8;color:#33507a}
.vote.v3{background:#fff2cf;border-color:#e0b43f;color:#7a5a00}
.vote.v9{background:#ffd9d5;border-color:var(--bad);color:#a01f18}
.mx tfoot td,.mx tfoot th{font-weight:800;background:var(--field);position:sticky;bottom:0}
.mx tfoot th{left:0;z-index:3;text-align:left}
.mx .tot{font-size:18px}
.mx .rkA,.mx thead th.rkA{box-shadow:inset 0 3px 0 #d6332b}
.mx .rkB,.mx thead th.rkB{box-shadow:inset 0 3px 0 #e8892b}
.mx .rkC,.mx thead th.rkC{box-shadow:inset 0 3px 0 #c99a00}
.legend-v{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.legend-v span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.legend-v b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:800;color:#222}
.n-ctl{display:flex;align-items:center;gap:8px}
.n-ctl input{width:70px;text-align:center;font-weight:700}
.rankp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media (max-width:760px){.rankp{grid-template-columns:1fr}}
.rk-card{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;background:var(--field)}
.rk-card b{display:block;font-size:14px}
.rk-card small{color:var(--mut)}
.rk-card.empty{opacity:.55}
/* 5M */
.cat-row{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cat-row:last-child{border-bottom:0}
.cat-row .chipsM{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.chipM{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.chipM small{font-weight:500;color:var(--mut);font-size:10.5px}
.chipM.on{color:#fff;border-color:transparent}
.chipM.on small{color:rgba(255,255,255,.85)}
.chipM.on[data-c="Man"]{background:#0b4a9e}.chipM.on[data-c="Machine"]{background:#6b3fa0}.chipM.on[data-c="Environment"]{background:#1b8a5a}.chipM.on[data-c="Material"]{background:#b85c00}.chipM.on[data-c="Method"]{background:#0e7c86}
.prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.paper{background:#fff;color:#14233b;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
/* whys */
.why-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.why-h b{display:block}
.why-h small{color:var(--mut)}
.why-row{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:stretch}
.why-prob{flex:0 0 auto;width:120px;background:#14233b;color:#fff;border-radius:10px;padding:10px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;justify-content:center}
.why-prob small{opacity:.75;font-weight:500;display:block;margin-bottom:3px}
.why-cell{flex:1 1 150px;min-width:150px;position:relative}
.why-cell label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--pri);margin-bottom:4px}
.why-cell textarea{min-height:84px}
.why-cell .rm{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:16px;line-height:1}
.add-why{flex:0 0 auto;align-self:center;border:2px dashed var(--line2);background:transparent;color:var(--pri);border-radius:12px;padding:16px 14px;cursor:pointer;font-weight:700}
.why-foot{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:12px}
@media (max-width:760px){.why-foot{grid-template-columns:1fr}.why-prob{width:100%}}
/* plan */
.grp{border:1px solid var(--line2);border-radius:12px;padding:12px;margin-top:12px;background:var(--field)}
.act-row{display:grid;grid-template-columns:2.4fr 1.2fr 1fr 1fr auto;gap:8px;margin-top:8px;align-items:center}
.act-row .in{background:var(--card)}
.act-head{display:grid;grid-template-columns:2.4fr 1.2fr 1fr 1fr auto;gap:8px;margin-top:10px;font-size:11.5px;font-weight:700;color:var(--mut)}
.act-head span:last-child,.act-row .del{width:36px}
.del{border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:8px;cursor:pointer;height:36px}
@media (max-width:760px){.act-row,.act-head{grid-template-columns:1fr 1fr}.act-head{display:none}.act-row>:first-child{grid-column:1 / -1}}
.tbl-res{width:100%;border-collapse:collapse;font-size:14px}
.tbl-res th,.tbl-res td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.tbl-res th{font-size:12px;color:var(--mut)}
.tbl-res input{min-width:90px}
.empty{text-align:center;padding:26px 10px}
.empty p{color:var(--mut);margin:0 0 12px}
/* nav bar */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.navbar .mid{font-size:12.5px;color:var(--mut);text-align:center;flex:1}
.navbar .btn{min-width:130px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#14233b;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(10,18,32,.55);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:var(--shadow)}
.modal .box p{margin:8px 0 16px;color:var(--mut)}
.modal .row{display:flex;gap:10px;justify-content:flex-end}
/* report view */
.rep-actions .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg2{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg2 button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;font-weight:600;font-size:13px}
.seg2 button.on{background:var(--pri);color:var(--pri-ink)}
#sheetWrap{position:relative;overflow:hidden;border-radius:6px;box-shadow:var(--shadow);background:#fff}
#sheetWrap.full{overflow-x:auto}
#sheetScaler{width:11in;height:17in;transform-origin:0 0}
@media print{
  @page{size:11in 17in;margin:0}
  :root{padding:0}
  html,body{background:#fff;margin:0}
  .top,.stepper,.navbar,#toast,.modal,.stephead,.rep-actions{display:none!important}
  main{max-width:none;padding:0;margin:0}
  #sheetWrap{overflow:visible!important;height:auto!important;box-shadow:none;border-radius:0}
  #sheetScaler{transform:none!important}
}
</style>

<!-- ===== Estilos de la hoja / componentes de reporte (se reutilizan en la exportación) ===== -->
<style id="sheetCss">
.badge{display:inline-flex;align-items:center;justify-content:center;width:1.8em;height:1.8em;border-radius:50%;color:#fff;font-weight:800;font-size:1em;flex:0 0 auto}
.badge.A{background:#d6332b}.badge.B{background:#e8892b}.badge.C{background:#c99a00}
.sheet{--sf:10px;font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:var(--sf);color:#14233b;background:#fff;width:11in;height:17in;padding:.36in;box-sizing:border-box;position:relative;overflow:hidden;line-height:1.28}
.sheet *{box-sizing:border-box}
.sheet-inner{height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:.55em}
.sheet-inner>*{flex:0 0 auto}
.sh-head{display:flex;align-items:center;gap:1.2em;border-bottom:.25em solid #0b4a9e;padding-bottom:.55em}
.sh-logo{display:block;height:3.3em;width:auto;flex:0 0 auto}
.sh-title{flex:1;min-width:0}
.sh-title small{font-weight:700;color:#5d6b82;letter-spacing:.08em;font-size:.85em}
.sh-title h1{font-size:2.3em;margin:.05em 0 0;line-height:1.1;font-weight:800}
.sh-date{text-align:right;font-weight:800;font-size:1.25em}
.sh-date small{font-weight:600;color:#5d6b82;font-size:.7em}
.sh-foot{font-size:.8em;color:#7a879c;text-align:right}
.sec{border:1px solid #bfcadd;border-radius:.4em;overflow:hidden;background:#fff}
.sec>h2{margin:0;background:#e9eef6;font-size:1.12em;font-weight:800;padding:.32em .7em;display:flex;gap:.6em;align-items:center;letter-spacing:.02em}
.sec>h2 .n{background:#0b4a9e;color:#fff;border-radius:.3em;min-width:1.7em;text-align:center;padding:.05em .3em}
.sec-b{padding:.55em .7em}
.rc-h{margin:0 0 .3em;font-size:.95em;font-weight:800;color:#0b4a9e}
.rc-p{margin:0 0 .35em;font-size:.95em}
.rc-mut{color:#8a97ab}
.rc-g3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:.8em}
.rc-g3>div{min-width:0}
.rc-t{width:100%;border-collapse:collapse;font-size:.92em;margin-bottom:.5em}
.rc-t th,.rc-t td{border:1px solid #bfcadd;padding:.3em .45em;text-align:left;vertical-align:top}
.rc-t th{background:#f1f4f9;font-weight:700;width:7.5em}
.rc-box{border:1px solid #d6332b;background:#fdeceb;border-radius:.3em;padding:.4em .55em;font-size:.95em}
.rc-box b{display:block;color:#b3261e;font-size:.85em;margin-bottom:.15em}
.rc-imgs{display:flex;flex-wrap:wrap;gap:.4em;align-items:flex-start}
.rc-imgs img{max-width:100%;max-height:10em;object-fit:contain;border:1px solid #d3dbe8;border-radius:.25em;display:block}
.rc-flow{display:flex;flex-wrap:wrap;gap:.5em 0;align-items:flex-start}
.rc-node{width:11em}
.rc-chev{--n:1.25em;background:#1f4e9c;clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% 50%,calc(100% - var(--n)) 100%,0 100%,var(--n) 50%);padding:.22em}
.rc-node:first-child .rc-chev{clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% 50%,calc(100% - var(--n)) 100%,0 100%)}
.rc-chev-in{--n:1.25em;background:#1f4e9c;color:#fff;clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% 50%,calc(100% - var(--n)) 100%,0 100%,var(--n) 50%);min-height:3.7em;display:flex;align-items:center;justify-content:center;text-align:center;padding:.3em 1.5em;font-weight:700;font-size:.92em;line-height:1.2;word-break:break-word}
.rc-node:first-child .rc-chev-in{clip-path:polygon(0 0,calc(100% - var(--n)) 0,100% 50%,calc(100% - var(--n)) 100%,0 100%)}
.rc-nok .rc-chev{background:#d6332b}
.rc-nok .rc-chev-in{background:#e8892b}
.rc-note{margin:.35em .6em 0 .2em;padding:.35em .5em;border-radius:.3em;font-size:.85em;background:#e3f6ea;border:1px solid #1f9d55;color:#14233b}
.rc-nok .rc-note{background:#fff1e0;border-color:#e8892b}
.rc-legend{display:flex;gap:1.2em;font-size:.82em;color:#5d6b82;margin-top:.4em}
.rc-legend i{display:inline-block;width:1em;height:1em;border-radius:.2em;vertical-align:-.15em;margin-right:.35em}
.rc-goals{display:grid;grid-template-columns:1.2fr 1.6fr .8fr;gap:.8em;align-items:stretch}
.rc-goal{border:1px solid #bfcadd;border-radius:.35em;padding:.45em .6em;background:#f7f9fc;font-size:.95em}
.rc-goal h3{margin:0 0 .2em;font-size:.85em;color:#0b4a9e;text-transform:uppercase;letter-spacing:.04em}
.rc-kpi{margin-top:.25em;font-size:.88em;color:#33415a}
.rc-kpi b{color:#14233b}
.rc-dead{border:2px solid #0b4a9e;border-radius:.35em;text-align:center;display:flex;flex-direction:column;justify-content:center;padding:.4em;background:#e6eefb}
.rc-dead small{font-weight:700;color:#0b4a9e;letter-spacing:.06em}
.rc-dead b{font-size:1.3em}
.rc-fish{width:100%;display:flex;justify-content:center}
.rc-fish svg{width:min(100%,95em);height:auto}
.rc-rank{display:flex;gap:.6em;flex-wrap:wrap;margin-top:.4em}
.rc-rk{display:flex;gap:.5em;align-items:center;border:1px solid #bfcadd;border-radius:.35em;padding:.3em .5em;font-size:.88em;background:#f7f9fc;flex:1 1 14em}
.rc-rk small{display:block;color:#5d6b82}
.rc-why{display:flex;align-items:stretch;gap:.3em;margin:.3em 0}
.rc-why .lt{display:flex;align-items:center;padding-right:.2em}
.rc-why .pr{flex:0 0 7em;background:#14233b;color:#fff;border-radius:.3em;padding:.3em .45em;font-size:.82em;font-weight:700;display:flex;align-items:center}
.rc-why .w{flex:1 1 0;min-width:0;border:1px solid #9aa9c2;border-radius:.3em;padding:.28em .42em;background:#f7f9fc;font-size:.88em;overflow-wrap:anywhere}
.rc-why .w small{display:block;font-weight:800;color:#0b4a9e;font-size:.78em}
.rc-why .w.root{background:#fdeceb;border-color:#d6332b;font-weight:700}
.rc-why .arr{align-self:center;color:#0b4a9e;font-weight:800;font-size:.9em}
.rc-why .imp{flex:0 0 5.5em;text-align:center;font-size:.8em;border:1px solid #bfcadd;border-radius:.3em;padding:.25em;background:#fff;display:flex;flex-direction:column;justify-content:center}
.rc-res{display:grid;grid-template-columns:1.3fr 1fr;gap:.8em}
.rc-res>div{min-width:0}
.rc-files{font-size:.85em;color:#33415a;margin:.3em 0 0;padding-left:1.1em}
.g{font-size:.92em;border:1px solid #9aa9c2;min-width:44em;background:#fff}
.g-r,.g-h{display:grid;grid-template-columns:2.3em 10em minmax(12em,1.5fr) 6.5em minmax(14em,2fr)}
.g-h{background:#e9eef6;font-weight:700}
.g-c{padding:.22em .4em;border-right:1px solid #cfd8e6;border-bottom:1px solid #cfd8e6;display:flex;align-items:center;min-width:0;overflow-wrap:anywhere;font-size:.95em}
.g-g{font-weight:700;color:#0b4a9e;font-size:.88em}
.g-pic{font-size:.85em;justify-content:center;text-align:center}
.g-ltop>.g-c,.g-ltop>.g-trk{border-top:2px solid #14233b}
.g-gtop>.g-c,.g-gtop>.g-trk{border-top:1px solid #7f8fa8}
.g-trk{position:relative;min-height:1.9em;border-bottom:1px solid #cfd8e6;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--w) - 1px),#cfd8e6 calc(var(--w) - 1px),#cfd8e6 var(--w))}
.g-months{display:grid}
.g-months span{text-align:center;border-left:1px solid #cfd8e6;padding:.22em 0;font-size:.9em}
.g-months span:first-child{border-left:0}
.g-bar{position:absolute;top:.28em;bottom:.28em;clip-path:polygon(0 0,calc(100% - .55em) 0,100% 50%,calc(100% - .55em) 100%,0 100%)}
.g-bar.LA{background:#d6332b}.g-bar.LB{background:#e8892b}.g-bar.LC{background:#c99a00}
.g-dl{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed #0b4a9e}
.g-sch{display:flex;flex-direction:column}
</style>

/* ---------- estado ---------- */
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const node=()=>({id:uid(),label:'',status:'ok',note:''});
const spec=()=>({id:uid(),text:'',ind:'',goal:'',unit:'',result:''});
function blank(){return{
  v:1,title:'',date:todayISO(),
  clar:{ext:'',int:'',purpose:'',ideal:{text:'',imgs:[]},cur:{text:'',imgs:[]},problem:''},
  flow:{steps:[node(),node(),node()],ev:{text:'',imgs:[]}},
  target:{big:{text:'',ind:'',base:'',goal:'',unit:'',result:''},specifics:[spec(),spec()],deadline:''},
  factor:{raw:'',ideas:[],n:3,names:[],votes:{},cats:{}},
  whys:{},plan:{},
  res:{text:'',files:[]}
};}
function merge(d,s){
  if(Array.isArray(d)) return Array.isArray(s)?s:d;
  if(d&&typeof d==='object'){
    const o={},sk=(s&&typeof s==='object'&&!Array.isArray(s))?s:{};
    new Set([...Object.keys(d),...Object.keys(sk)]).forEach(k=>{o[k]=(k in d)?merge(d[k],sk[k]):sk[k];});
    return o;
  }
  return (s===undefined||s===null)?d:s;
}
let S=blank(), cur=0, STEPS=[];
function getPath(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S);}
function setPath(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(o[k]==null)o[k]=/^\d+$/.test(ks[i+1])?[]:{};o=o[k];}o[ks[ks.length-1]]=v;}

/* ---------- lógica de datos ---------- */
function parseIdeas(raw){const seen=new Set(),out=[];String(raw||'').split(/[,\n;]+/).map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean).forEach(t=>{const k=t.toLowerCase();if(seen.has(k))return;seen.add(k);out.push(t);});return out;}
function syncIdeas(){const F=S.factor,old=new Map(F.ideas.map(i=>[i.text.toLowerCase(),i]));F.ideas=parseIdeas(F.raw).map(t=>old.get(t.toLowerCase())||{id:uid(),text:t});}
function ensureNames(){const F=S.factor;for(let p=0;p<F.n;p++){if(!F.names[p])F.names[p]='Participante '+(p+1);}}
function totals(){const F=S.factor;return F.ideas.map((it,i)=>{let t=0,nines=0,cnt=0;for(let p=0;p<F.n;p++){const v=+((F.votes[p]||{})[it.id]||0);if(v){t+=v;cnt++;if(v===9)nines++;}}return{id:it.id,text:it.text,i,t,nines,cnt};});}
function ranking(){return totals().filter(x=>x.t>0).sort((a,b)=>b.t-a.t||b.nines-a.nines||a.i-b.i).slice(0,3).map((x,k)=>Object.assign({},x,{letter:'ABC'[k]}));}
function ideaById(id){return S.factor.ideas.find(i=>i.id===id);}
function allCategorized(){const F=S.factor;return F.ideas.length>0&&F.ideas.every(i=>F.cats[i.id]);}
function ensureWhy(r){if(!S.whys[r.id])S.whys[r.id]={chain:[r.text,'','','',''],root:'',impact:''};const w=S.whys[r.id];if(!Array.isArray(w.chain)||!w.chain.length)w.chain=[r.text,'','','',''];return w;}
function ensurePlan(r){if(!S.plan[r.id])S.plan[r.id]={groups:[{id:uid(),name:'',acts:[{id:uid(),text:'',pic:'',start:'',end:''}]}]};return S.plan[r.id];}
const pd=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;};
const fmtDate=s=>{const d=pd(s);return d?String(d.getDate()).padStart(2,'0')+'/'+MES[d.getMonth()]+'/'+d.getFullYear():'—';};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const slug=s=>String(s||'proyecto').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,50)||'proyecto';
function wrapTxt(t,max,maxLines){
  const out=[];let cur='';
  String(t||'').split(/\s+/).filter(Boolean).forEach(w=>{
    if(w.length>max)w=w.slice(0,max-1)+'…';
    if((cur?cur+' '+w:w).length>max){if(cur)out.push(cur);cur=w;}else cur=cur?cur+' '+w:w;
  });
  if(cur)out.push(cur);
  if(out.length>maxLines){out.length=maxLines;const l=out[maxLines-1];out[maxLines-1]=(l.length>max-1?l.slice(0,max-1):l)+'…';}
  return out;
}

/* ---------- Ishikawa (SVG) ---------- */
function fishSVG(){
  const F=S.factor,R=ranking(),LET={};R.forEach(r=>LET[r.id]=r.letter);
  const TOP=['Man','Machine','Environment'],BOT=['Material','Method'];
  const COL={Man:'#0b4a9e',Machine:'#6b3fa0',Environment:'#1b8a5a',Material:'#b85c00',Method:'#0e7c86'};
  const by=c=>F.ideas.filter(i=>F.cats[i.id]===c);
  const SLOT=50,CATH=30,PADV=44,CL=215,W=1280,HEADX=1075,SL=0.3;
  const nT=Math.max(2,...TOP.map(c=>by(c).length)),nB=Math.max(2,...BOT.map(c=>by(c).length));
  const lenT=nT*SLOT+PADV,lenB=nB*SLOT+PADV,spineY=CATH+lenT,H=spineY+lenB+CATH;
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif" role="img" aria-label="Diagrama de Ishikawa"><rect width="'+W+'" height="'+H+'" fill="#fff"/>';
  s+='<line x1="24" y1="'+spineY+'" x2="'+HEADX+'" y2="'+spineY+'" stroke="#14233b" stroke-width="5" stroke-linecap="round"/>';
  const hw=W-HEADX-6;
  s+='<rect x="'+HEADX+'" y="'+(spineY-66)+'" width="'+hw+'" height="132" rx="10" fill="#14233b"/>';
  const hl=wrapTxt(S.title||'Problema',17,5),hy=spineY-(hl.length-1)*9+5;
  hl.forEach((l,j)=>{s+='<text x="'+(HEADX+hw/2)+'" y="'+(hy+j*18)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">'+esc(l)+'</text>';});
  function bone(cat,endX,isTop){
    const col=COL[cat],len=isTop?lenT:lenB,x0=endX-SL*len,y0=isTop?CATH:spineY+len;
    s+='<line x1="'+x0+'" y1="'+y0+'" x2="'+endX+'" y2="'+spineY+'" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round"/>';
    const by0=isTop?0:y0;
    s+='<rect x="'+(x0-72)+'" y="'+by0+'" width="144" height="'+CATH+'" rx="7" fill="'+col+'"/><text x="'+x0+'" y="'+(by0+20)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">'+cat+'</text>';
    const list=by(cat),n=list.length;
    list.forEach((it,k)=>{
      const f=(k+1)/(n+1),y=y0+f*(spineY-y0),x=x0+f*(endX-x0),L=LET[it.id];
      const lines=wrapTxt(it.text,L?27:33,2),nn=lines.length,x1=x-CL;
      s+='<line x1="'+x1+'" y1="'+y+'" x2="'+x+'" y2="'+y+'" stroke="'+col+'" stroke-width="2"/><circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+col+'"/>';
      const firstBase=y-6-(nn-1)*16,top=firstBase-14,h=y+2-top;
      if(L){
        s+='<rect x="'+x1+'" y="'+top+'" width="'+CL+'" height="'+h+'" rx="6" fill="'+LCOL[L]+'" fill-opacity=".14" stroke="'+LCOL[L]+'" stroke-width="2.2"/>';
        s+='<circle cx="'+(x1+15)+'" cy="'+(top+h/2)+'" r="11" fill="'+LCOL[L]+'"/><text x="'+(x1+15)+'" y="'+(top+h/2+4.5)+'" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">'+L+'</text>';
      }
      lines.forEach((l,j)=>{s+='<text x="'+(x1+(L?32:4))+'" y="'+(firstBase+j*16)+'" font-size="13" '+(L?'font-weight="700" ':'')+'fill="#14233b">'+esc(l)+(j===0?'<title>'+esc(it.text)+'</title>':'')+'</text>';});
    });
  }
  [380,700,1020].forEach((x,i)=>bone(TOP[i],x,true));
  [540,860].forEach((x,i)=>bone(BOT[i],x,false));
  return s+'</svg>';
}

/* ---------- Gantt ---------- */
function planRows(){
  const rows=[];
  ranking().forEach(r=>{const p=S.plan[r.id];if(!p)return;let lf=true;
    p.groups.forEach(g=>{const acts=g.acts.filter(a=>(a.text||'').trim());
      acts.forEach((a,ai)=>{rows.push({L:r.letter,lf,gf:ai===0,gn:g.name,a});lf=false;});});});
  return rows;
}
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function ganttRange(rows){
  const ds=[];rows.forEach(r=>{const a=pd(r.a.start),b=pd(r.a.end);if(a)ds.push(a);if(b)ds.push(b);});
  const dl=pd(S.target.deadline);if(dl)ds.push(dl);
  if(!ds.length){const t=new Date();return{y0:t.getFullYear(),m0:t.getMonth(),M:3};}
  const mn=new Date(Math.min(...ds)),mx=new Date(Math.max(...ds));
  let M=(mx.getFullYear()-mn.getFullYear())*12+mx.getMonth()-mn.getMonth()+1;
  M=Math.max(3,Math.min(24,M));
  return{y0:mn.getFullYear(),m0:mn.getMonth(),M};
}
function ganttHTML(){
  const rows=planRows();
  if(!rows.length)return '<p class="rc-p rc-mut">Aún no hay acciones registradas.</p>';
  const R=ganttRange(rows),M=R.M;
  const pos=(d,end)=>{const idx=(d.getFullYear()-R.y0)*12+d.getMonth()-R.m0;return Math.max(0,Math.min(M,idx+((d.getDate()-1)+(end?1:0))/dim(d.getFullYear(),d.getMonth())))/M*100;};
  const months=Array.from({length:M},(_,i)=>{const t=R.m0+i;return MES[t%12]+' '+String(R.y0+Math.floor(t/12)).slice(2);});
  const dl=pd(S.target.deadline);
  const dlHtml=dl?'<i class="g-dl" title="Fecha de cierre del objetivo general" style="left:'+pos(dl,false).toFixed(2)+'%"></i>':'';
  let h='<div class="g"><div class="g-h"><div class="g-c"></div><div class="g-c">Contramedida</div><div class="g-c">Acción</div><div class="g-c g-pic">PIC</div><div class="g-sch"><div class="g-c" style="justify-content:center;border-bottom:1px solid #cfd8e6">Cronograma</div><div class="g-months" style="grid-template-columns:repeat('+M+',1fr)">'+months.map(m=>'<span>'+m+'</span>').join('')+'</div></div></div>';
  rows.forEach(r=>{
    let a=pd(r.a.start),b=pd(r.a.end);if(!a&&b)a=b;if(!b&&a)b=a;if(a&&b&&b<a)b=a;
    let bar='';
    if(a&&b){const l=pos(a,false),w=Math.max(1.4,pos(b,true)-l);bar='<i class="g-bar L'+r.L+'" title="'+esc(fmtDate(r.a.start)+' → '+fmtDate(r.a.end))+'" style="left:'+l.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></i>';}
    h+='<div class="g-r'+(r.lf?' g-ltop':(r.gf?' g-gtop':''))+'"><div class="g-c">'+(r.lf?'<span class="badge '+r.L+'">'+r.L+'</span>':'')+'</div><div class="g-c g-g">'+(r.gf?esc(r.gn||'—'):'')+'</div><div class="g-c">'+esc(r.a.text)+'</div><div class="g-c g-pic">'+esc(r.a.pic)+'</div><div class="g-trk" style="--w:'+(100/M).toFixed(4)+'%">'+bar+dlHtml+'</div></div>';
  });
  return h+'</div>';
}

/* ---------- componentes de reporte ---------- */
function flowRO(){
  const st=S.flow.steps.filter(s=>(s.label||'').trim()||(s.note||'').trim());
  if(!st.length)return '<p class="rc-p rc-mut">Sin flujo capturado.</p>';
  return '<div class="rc-flow">'+st.map(s=>'<div class="rc-node '+(s.status==='nok'?'rc-nok':'rc-ok')+'"><div class="rc-chev"><div class="rc-chev-in">'+esc(s.label||'—')+'</div></div>'+((s.note||'').trim()?'<div class="rc-note">'+nl(s.note)+'</div>':'')+'</div>').join('')+'</div>'
    +'<div class="rc-legend"><span><i style="background:#1f4e9c"></i>Proceso OK</span><span><i style="background:#e8892b;outline:2px solid #d6332b"></i>Punto donde falló</span></div>';
}
function mediaRO(o){
  if(!o)return '';
  const t=(o.text||'').trim();
  return (t?'<p class="rc-p">'+nl(t)+'</p>':'<p class="rc-p rc-mut">—</p>')+((o.imgs&&o.imgs.length)?'<div class="rc-imgs">'+o.imgs.map(i=>'<img src="'+i.data+'" alt="">').join('')+'</div>':'');
}
function whysRO(){
  const R=ranking();if(!R.length)return '<p class="rc-p rc-mut">Sin causas priorizadas.</p>';
  return R.map(r=>{
    const w=ensureWhy(r);let last=-1;w.chain.forEach((c,i)=>{if((c||'').trim())last=i;});
    const ch=w.chain.slice(0,Math.max(1,last+1));
    const root=(w.root||'').trim()||(ch[ch.length-1]||'');
    return '<div class="rc-why"><div class="lt"><span class="badge '+r.letter+'">'+r.letter+'</span></div><div class="pr">'+esc(S.title||'Problema')+'</div>'
      +ch.map((c,i)=>'<span class="arr">▶</span><div class="w"><small>¿Por qué? '+(i+1)+'</small>'+nl(c)+'</div>').join('')
      +'<span class="arr">▶</span><div class="w root"><small>Causa raíz</small>'+nl(root)+'</div>'
      +'<div class="imp"><b>Impacto</b>'+esc(w.impact||'—')+'</div></div>';
  }).join('');
}
function sec(n,t,b){return '<section class="sec"><h2><span class="n">'+n+'</span>'+t+'</h2><div class="sec-b">'+b+'</div></section>';}

function fitSheet(){

  for(let k=0;k<10;k++){const mid=(lo+hi)/2;sheet.style.setProperty('--sf',mid+'px');if(inner.scrollHeight<=inner.clientHeight+1){best=mid;lo=mid;}else hi=mid;}
  sheet.style.setProperty('--sf',best+'px');
  const fi=$('#fitInfo');if(fi)fi.textContent='Hoja de 11 × 17 in en vertical · letra base ajustada a '+best.toFixed(1)+' px para que todo quepa en una sola hoja.';

function renderStepper(){
  $('#stepper').innerHTML=STEPS.map((s,i)=>'<button type="button" class="pill '+(i===cur?'on':'')+(i!==cur&&s.done()?' done':'')+'" data-act="go" data-i="'+i+'"><b>'+(i!==cur&&s.done()?'✓':(i+1))+'</b><span>'+s.short+'</span></button>').join('');
  const a=$('#stepper .on');if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});

function render(keep){
  const st=STEPS[cur],y=window.scrollY;
  $('#view').innerHTML='<div class="stephead"><span class="eyebrow">Paso '+(cur+1)+' de '+STEPS.length+'</span><h1>'+st.title+'</h1><p>'+st.sub+'</p></div>'+st.view();
  renderStepper();
  $('#prevBtn').disabled=cur===0;
  const last=cur===STEPS.length-1;
  $('#nextBtn').style.display=last?'none':'';
  $('#navMid').textContent=last?'Reporte listo para descargar':'';

}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();window.scrollTo(0,0);persist();}
function next(){const m=STEPS[cur].gate&&STEPS[cur].gate();if(m){toast(m);return;}go(cur+1);}

let saveTm,warned=false;

function loadSaved(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);S=merge(blank(),o.S);cur=Math.max(0,Math.min(STEPS.length-1,o.cur||0));}}catch(e){}}
async function saveFile(filename,data){
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('Archivo listo ✓');}catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo'+(e&&e.code?' ('+e.code+')':''));}return;}
  try{const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();}catch(e){toast('La descarga no está disponible en esta vista.');}
}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f);});}
async function readImage(f){
  const raw=await readFile(f);
  if(f.size<700*1024||/svg|gif/.test(f.type))return raw;
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=raw;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg',.85);return out.length<raw.length?out:raw;
  }catch(e){return raw;}
}
function loadScript(src){return new Promise((res,rej)=>{if($('script[src="'+src+'"]')&&window.html2canvas&&window.jspdf)return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar '+src));document.head.appendChild(s);});}
function reportDoc(){
  const sheet=$('#sheet').outerHTML;
  return '<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>'+esc(S.title||'Problem Solving')+' · Problem Solving</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>'+$('#sheetCss').textContent+'@page{size:11in 17in;margin:0}html,body{margin:0;background:#e7ebf2}.sheet{margin:0 auto}@media print{html,body{background:#fff}}</style></head><body>'+sheet+'</body></html>';
}

/* ---------- acciones ---------- */
const ACT={
  go:d=>go(+d.i), prev:()=>go(cur-1), next:()=>next(),
  setSt:d=>{S.flow.steps[+d.i].status=d.v;persist();render(true);},
  mvNode:d=>{const a=S.flow.steps,i=+d.i,j=i+ +d.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist();render(true);},
  delNode:d=>{if(S.flow.steps.length<=1){toast('Debe quedar al menos una etapa.');return;}S.flow.steps.splice(+d.i,1);persist();render(true);},
  addNode:()=>{S.flow.steps.push(node());persist();render(true);const t=$$('.flow-ed textarea.lbl, .flow-ed .rc-chev-in textarea');if(t.length)t[t.length-1].focus();},
  rmImg:d=>{getPath(d.path).splice(+d.i,1);persist();render(true);},
  rmFile:d=>{S.res.files.splice(+d.i,1);persist();render(true);},
  addSpec:()=>{S.target.specifics.push(spec());persist();render(true);},
  delSpec:d=>{if(S.target.specifics.length<=1){toast('Debe quedar al menos un objetivo específico.');return;}S.target.specifics.splice(+d.i,1);persist();render(true);},
  nDelta:d=>{const F=S.factor;F.n=Math.max(1,Math.min(30,F.n+ +d.d));ensureNames();persist();render(true);},
  cat:d=>{S.factor.cats[d.id]=d.c;persist();render(true);},
  addWhy:d=>{S.whys[d.id].chain.push('');persist();render(true);},
  rmWhy:d=>{S.whys[d.id].chain.splice(+d.k,1);persist();render(true);},
  addGroup:d=>{S.plan[d.id].groups.push({id:uid(),name:'',acts:[{id:uid(),text:'',pic:'',start:'',end:''}]});persist();render(true);},
  delGroup:d=>{const g=S.plan[d.id].groups;if(g.length<=1){toast('Debe quedar al menos una contramedida.');return;}g.splice(+d.gi,1);persist();render(true);},
  addAct:d=>{S.plan[d.id].groups[+d.gi].acts.push({id:uid(),text:'',pic:'',start:'',end:''});persist();render(true);},
  delAct:d=>{const a=S.plan[d.id].groups[+d.gi].acts;if(a.length<=1){toast('Debe quedar al menos una acción.');return;}a.splice(+d.ai,1);persist();render(true);},
  zoom:d=>{zoomMode=d.m;render(true);},
  exportJSON:()=>saveFile('ProblemSolving_'+slug(S.title)+'.json',JSON.stringify({app:'ktmex-problem-solving',v:1,S,cur})),
  importJSON:()=>$('#importFile').click(),
  newProject:async()=>{if(await ask('¿Empezar un proyecto nuevo?','Se borrará lo capturado en esta vista. Guarda el proyecto antes si quieres conservarlo.','Empezar nuevo')){S=blank();cur=0;persist();render();window.scrollTo(0,0);}},
  printSheet:()=>{try{window.print();}catch(e){toast('Imprimir no está disponible aquí: usa “Descargar PDF”.');}},
  saveHTML:()=>saveFile('ProblemSolving_'+slug(S.title)+'_11x17.html',reportDoc()),
  savePDF:async()=>{
    toast('Generando PDF…');
    try{
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      fitSheet();
      const canvas=await window.html2canvas($('#sheet'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,onclone:d=>{const sc=d.getElementById('sheetScaler');if(sc)sc.style.transform='none';}});
      const img=canvas.toDataURL('image/jpeg',.92),{jsPDF}=window.jspdf;
      const pdf=new jsPDF({unit:'in',format:[11,17],orientation:'portrait'});
      pdf.addImage(img,'JPEG',0,0,11,17);
      await saveFile('ProblemSolving_'+slug(S.title)+'_11x17.pdf',pdf.output('blob'));
    }catch(e){toast('No se pudo generar el PDF. Usa “Imprimir” o “Descargar HTML”.');}
  }
};

/* ---------- eventos ---------- */
function onBound(p){
  if(p==='factor.raw'){syncIdeas();const c=$('#chips');if(c)c.innerHTML=S.factor.ideas.map(i=>'<span class="chipi">'+esc(i.text)+'</span>').join('');const n=$('#ideaCount');if(n)n.textContent=S.factor.ideas.length;}
  if(p.indexOf('target.big.')===0){const B=S.target.big,a=parseFloat(B.base),b=parseFloat(B.goal),g=$('#gapNote');if(g)g.innerHTML=(isFinite(a)&&isFinite(b))?'Brecha a cerrar: <b>'+(+Math.abs(a-b).toFixed(4))+' '+esc(B.unit)+'</b>':'';}
  if(p.indexOf('plan.')===0||p==='target.deadline'){const g=$('#ganttBox');if(g)g.innerHTML=ganttHTML();}
}
function bindEvents(){
  const view=$('#view');
  const onVal=e=>{
    const t=e.target,p=t.dataset&&t.dataset.bind;if(!p)return;
    setPath(p,t.type==='checkbox'?t.checked:t.value);
    if(t.classList.contains('auto'))autosize(t);
    onBound(p);persist();
  };
  view.addEventListener('input',onVal);
  view.addEventListener('change',async e=>{
    const t=e.target;
    if(t.dataset.bind){onVal(e);return;}
    if(t.matches&&t.matches('select.vote')){
      const parts=t.dataset.vote.split('|'),p=parts[0],id=parts[1],v=t.value;
      if(!S.factor.votes[p])S.factor.votes[p]={};
      if(v)S.factor.votes[p][id]=+v;else delete S.factor.votes[p][id];
      t.className='vote v'+(v||'');updateMatrix();persist();return;
    }
    if(t.dataset.n!==undefined){S.factor.n=Math.max(1,Math.min(30,parseInt(t.value,10)||1));ensureNames();persist();render(true);return;}
    if(t.dataset.upload){
      const arr=getPath(t.dataset.upload);
      for(const f of Array.from(t.files||[])){try{arr.push({id:uid(),name:f.name,data:await readImage(f)});}catch(err){toast('No se pudo leer '+f.name);}}
      persist();render(true);return;
    }
    if(t.dataset.uploadFiles){
      const arr=getPath(t.dataset.uploadFiles);
      for(const f of Array.from(t.files||[])){
        const isImg=/^image\//.test(f.type);
        if(!isImg&&f.size>4*1024*1024){toast(f.name+' pesa más de 4 MB; no se puede guardar en esta vista.');continue;}
        try{arr.push({id:uid(),name:f.name,type:f.type||'application/octet-stream',size:f.size,data:isImg?await readImage(f):await readFile(f)});}catch(err){toast('No se pudo leer '+f.name);}
      }
      persist();render(true);return;
    }
  });
  document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=ACT[b.dataset.act];if(a){e.preventDefault();a(b.dataset,b,e);}});
  $('#importFile').addEventListener('change',async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    try{const o=JSON.parse(await f.text());if(!o||!o.S)throw new Error('formato');S=merge(blank(),o.S);cur=Math.max(0,Math.min(STEPS.length-1,o.cur||0));persist();render();window.scrollTo(0,0);toast('Proyecto cargado ✓');}
    catch(err){toast('El archivo no es un proyecto válido.');}
  });
  window.addEventListener('resize',scalePreview);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(cur===STEPS.length-1){fitSheet();scalePreview();}});
}

function init(){loadSaved();bindEvents();render();}
if(typeof document!=='undefined'&&document.getElementById&&document.getElementById('view'))init();
</script>
